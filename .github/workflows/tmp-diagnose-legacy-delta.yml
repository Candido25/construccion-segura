name: Temporary diagnose legacy solar transport delta

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-diagnose-legacy-delta.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Recreate candidate output and capture analysis
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p legacy-delta/current legacy-delta/output legacy-delta/source legacy-delta/diagnosis
          git fetch origin agent/gas-energia-equipos-20260727
          for part in 00 01 02 03; do
            git show origin/agent/gas-energia-equipos-20260727:.tmp/bloque9.part${part} >> legacy-delta/source/payload.b64
          done
          base64 -d legacy-delta/source/payload.b64 | gzip -dc > legacy-delta/source/original.py
          cp backend/normativa_tecnica.json legacy-delta/current/normativa_tecnica.json
          cp backend/preguntas_tecnicas.json legacy-delta/current/preguntas_tecnicas.json
          cp scripts/check_normativa.py legacy-delta/current/check_normativa.py

          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/tmp-extract-legacy-delta.yml').read_text(encoding='utf-8')
          blocks = re.findall(r"          python - <<'PY'\n(.*?)\n          PY", workflow, flags=re.S)
          if len(blocks) < 2:
              raise SystemExit(f'Se esperaban al menos dos bloques Python y se encontraron {len(blocks)}.')
          Path('legacy-delta/source/adapt-block.py').write_text(textwrap.dedent(blocks[0]), encoding='utf-8')
          Path('legacy-delta/source/analyze-block.py').write_text(textwrap.dedent(blocks[1]), encoding='utf-8')
          PY

          python legacy-delta/source/adapt-block.py > legacy-delta/diagnosis/adapt.log 2>&1
          python legacy-delta/source/adapted.py > legacy-delta/diagnosis/generator.log 2>&1
          set +e
          python legacy-delta/source/analyze-block.py > legacy-delta/diagnosis/analysis.log 2>&1
          status=$?
          set -e
          echo "analysis_exit_status=$status" > legacy-delta/diagnosis/status.txt
          python - <<'PY' > legacy-delta/diagnosis/basic-summary.txt 2>&1
          import json
          from pathlib import Path
          out=Path('legacy-delta/output')
          for name in ['summary.json','delta-summary.json','delta_specs.json','overlap_specs.json','semantic-flags.json']:
              path=out/name
              print(name, 'exists=', path.exists(), 'bytes=', path.stat().st_size if path.exists() else 0)
          if (out/'summary.json').exists(): print((out/'summary.json').read_text(encoding='utf-8'))
          if (out/'delta_specs.json').exists():
              data=json.loads((out/'delta_specs.json').read_text(encoding='utf-8'))
              print('delta_specs_count',len(data))
              from collections import Counter
              print('norms',Counter(x.get('fuente',{}).get('norma') for x in data))
              print('classes',Counter(x.get('clasificacion') for x in data))
          PY

      - name: Upload diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-solar-transport-diagnosis
          path: legacy-delta
          retention-days: 3
