name: Verificar fragmentos de obras preliminares

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/data_obras_preliminares/**
      - .github/workflows/diagnosticar-obras-preliminares.yml

permissions:
  contents: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          ref: agent/ampliar-obras-preliminares-seguridad-20260727

      - name: Calcular huellas
        run: |
          wc -c scripts/data_obras_preliminares/part*.txt > docs/HUELLAS_OBRAS_PRELIMINARES.txt
          sha256sum scripts/data_obras_preliminares/part*.txt >> docs/HUELLAS_OBRAS_PRELIMINARES.txt

      - name: Confirmar huellas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/HUELLAS_OBRAS_PRELIMINARES.txt
          git commit -m "Registrar huellas de obras preliminares"
          git push origin HEAD:agent/ampliar-obras-preliminares-seguridad-20260727
