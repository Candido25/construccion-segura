name: Temporary official RNE numeral audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-audit-rne-numerals.yml'

permissions:
  contents: read

jobs:
  extract-official-rne:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4

      - name: Install PDF text tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Download official RNE PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/pdfs audit/text
          download() {
            local name="$1"
            local url="$2"
            curl --fail --location --retry 6 --retry-all-errors --retry-delay 5 \
              --connect-timeout 30 --max-time 240 \
              -A 'Mozilla/5.0' -e 'https://www.gob.pe/' \
              "$url" -o "audit/pdfs/${name}.pdf"
            file "audit/pdfs/${name}.pdf"
            pdfinfo "audit/pdfs/${name}.pdf" | head -20 > "audit/${name}-pdfinfo.txt"
            pdftotext -layout "audit/pdfs/${name}.pdf" "audit/text/${name}.txt"
          }

          download a010 'https://cdn.www.gob.pe/uploads/document/file/2366528/35%20A.010%20CONDICIONES%20GENERALES%20DE%20DISE%C3%91O%20-%20RM%20N%C2%B0%20191-2021-VIVIENDA.pdf?v=1636058378'
          download a020 'https://cdn.www.gob.pe/uploads/document/file/2366560/36%20A.020%20VIVIENDA%20-%20RM%20N%C2%BA%20188-2021-VIVIENDA.pdf?v=1636059082'
          download e050 'https://cdn.www.gob.pe/uploads/document/file/2366655/54%20E.050%20SUELOS%20Y%20CIMENTACIONES%20RM%20N%C2%B0%20406-2018-VIVIENDA.pdf?v=1677250657'
          download e060 'https://cdn.www.gob.pe/uploads/document/file/2366660/55%20E.060%20CONCRETO%20ARMADO%20DS%20N%C2%B0%20010-2009.pdf?v=1677250657'

      - name: Extract relevant clauses and current records
        run: |
          python - <<'PY'
          import json
          import re
          import unicodedata
          from pathlib import Path

          root = Path('audit')
          data = json.loads(Path('backend/normativa_tecnica.json').read_text(encoding='utf-8'))

          def norm(value):
              value = unicodedata.normalize('NFD', str(value).lower())
              return ''.join(ch for ch in value if unicodedata.category(ch) != 'Mn')

          patterns = {
              'e050': [
                  'Informe Técnico de Suelos', 'no menos de 3 puntos', '3 m de profundidad',
                  '600 m2', '500 m2', 'Artículo 6', '6.3', 'Artículo 26',
                  '0,80 m', '0.80 m', 'profundidad de cimentación'
              ],
              'a010': [
                  'Artículo 29', 'Artículo 30', 'escaleras', '17 pasos',
                  '0,25 m', '0.25 m', '0,18 m', '0.18 m', '0,90 m', '0.90 m',
                  '0,85 m', '0.85 m', 'barandas'
              ],
              'a020': [
                  'Artículo 15', 'Artículo 16', 'escaleras', 'ancho libre',
                  '0,90 m', '0.90 m', '0,80 m', '0.80 m', '1,20 m', '1.20 m'
              ],
              'e060': [
                  'L/20', 'L/24', 'Tabla 9.1', 'espesor mínimo', 'losas en una dirección',
                  'control de deflexiones', 'escalera'
              ],
          }

          report = []
          report.append('# REGISTROS ACTUALES')
          for item in data['parametros']:
              report.append(
                  f"{item['id']} | {item['categoria']} | {item['elemento']} | "
                  f"{item['parametro']} | {item['clasificacion']} | {item['valor']['texto']} | "
                  f"numeral={item['fuente'].get('numeral')} | estado={item['estado_revision']}"
              )

          for doc, wanted in patterns.items():
              text = (root / 'text' / f'{doc}.txt').read_text(encoding='utf-8', errors='replace')
              pages = text.split('\f')
              report.append(f"\n# HALLAZGOS {doc.upper()} ({len(pages)} páginas extraídas)")
              seen = set()
              for pattern in wanted:
                  needle = norm(pattern)
                  matches = 0
                  for page_number, page in enumerate(pages, 1):
                      lines = page.splitlines()
                      normalized = [norm(line) for line in lines]
                      for index, line in enumerate(normalized):
                          if needle not in line:
                              continue
                          key = (pattern, page_number, index)
                          if key in seen:
                              continue
                          seen.add(key)
                          matches += 1
                          start = max(0, index - 5)
                          end = min(len(lines), index + 10)
                          excerpt = '\n'.join(lines[start:end]).strip()
                          report.append(
                              f"\n## patrón={pattern!r} | página PDF={page_number}\n{excerpt}"
                          )
                          if matches >= 8:
                              break
                      if matches >= 8:
                          break
                  if matches == 0:
                      report.append(f"\n## patrón={pattern!r} | SIN COINCIDENCIAS")

          Path('audit/report.txt').write_text('\n'.join(report) + '\n', encoding='utf-8')
          print('\n'.join(report[:1600]))
          PY

      - name: Upload official audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-rne-numeral-audit
          path: audit/
          if-no-files-found: error
          retention-days: 3
