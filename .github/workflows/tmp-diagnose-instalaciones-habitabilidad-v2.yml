name: Temporary diagnose installations and habitability v2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-diagnose-instalaciones-habitabilidad-v2.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Recreate corrected proposal
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/.tmp_install_00.b64 scripts/.tmp_install_01.b64 scripts/.tmp_install_02.b64 scripts/.tmp_install_03.b64 scripts/.tmp_install_04.b64 | base64 -d | gzip -d > /tmp/apply.py
          python /tmp/apply.py > /tmp/generator.txt 2>&1
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('backend/normativa_tecnica.json')
          d=json.loads(p.read_text())
          x=next(i for i in d['parametros'] if i['id']=='em020-pau-altura-instalacion')
          x['clasificacion']='condicion_normativa'
          p.write_text(json.dumps(d,ensure_ascii=False,separators=(',',':'))+'\n')
          PY
          python -m pip install --disable-pip-version-check -q -r requirements.txt
      - name: Capture validation
        shell: bash
        run: |
          mkdir -p diagnosis
          cp /tmp/generator.txt diagnosis/generator.txt
          set +e
          python scripts/check_normativa.py > diagnosis/check.txt 2>&1
          echo "check_status=$?" >> diagnosis/check.txt
          python -m py_compile backend/api.py backend/normativa.py > diagnosis/compile.txt 2>&1
          echo "compile_status=$?" >> diagnosis/compile.txt
          python scripts/prepare_frontend.py --source . --output /tmp/public > diagnosis/package.txt 2>&1
          echo "package_status=$?" >> diagnosis/package.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: installations-habitability-diagnosis-v2
          path: diagnosis
          retention-days: 2
