name: Temporary apply normative batch 4

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-apply-normativa-lote-4.yml'

permissions:
  contents: write

jobs:
  apply-normative-batch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply verified parameters and FAQ additions
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          norm_path = Path('backend/normativa_tecnica.json')
          faq_path = Path('backend/preguntas_tecnicas.json')
          norm = json.loads(norm_path.read_text(encoding='utf-8'))
          faq = json.loads(faq_path.read_text(encoding='utf-8'))

          if norm.get('version') != '1.3.0' or len(norm.get('parametros', [])) != 70:
              raise SystemExit('La base normativa cambió desde el lote 3; revisar antes de aplicar.')

          review_date = '2026-07-27'
          e060_url = 'https://www.gob.pe/institucion/vivienda/informes-publicaciones/2309793-reglamento-nacional-de-edificaciones-rne'
          e030_url = 'https://www.gob.pe/institucion/vivienda/normas-legales/8081915-183-2026-vivienda'

          def source(norm_name: str, title: str, device: str, numeral: str, url: str) -> dict:
              return {
                  'tipo': 'RNE',
                  'norma': norm_name,
                  'denominacion': title,
                  'dispositivo': device,
                  'numeral': numeral,
                  'numeral_confirmado': True,
                  'url_oficial': url,
              }

          def e060(numeral: str) -> dict:
              return source('E.060', 'Concreto Armado', 'DS N.° 010-2009-VIVIENDA', numeral, e060_url)

          def e030(numeral: str) -> dict:
              return source('E.030', 'Diseño Sismorresistente', 'RM N.° 183-2026-VIVIENDA', numeral, e030_url)

          parameters = [
              {
                  'id': 'e060-desarrollo-traccion-longitud-minima',
                  'categoria': 'Concreto y acero de refuerzo',
                  'elemento': 'Barra corrugada sometida a tracción',
                  'parametro': 'Longitud de desarrollo mínima',
                  'clasificacion': 'minimo_normativo',
                  'valor': {'tipo': 'numero', 'valor': 300, 'unidad': 'mm', 'texto': 'La longitud de desarrollo en tracción calculada conforme al Capítulo 12 no debe ser menor de 300 mm.'},
                  'condiciones': ['La longitud real se calcula según diámetro, acero, concreto, recubrimiento, separación y confinamiento.', 'El mínimo de 300 mm no sustituye el cálculo de la longitud requerida.'],
                  'fuente': e060('12.2.1-12.2.4'),
                  'estado_revision': 'validado_con_numeral',
                  'advertencia': 'No cortes una barra dejando solo 30 cm si el cálculo o el plano exige una longitud mayor.',
                  'faq_relacionadas': ['q1540'],
                  'fecha_revision': review_date,
              },
              {
                  'id': 'e060-desarrollo-compresion-longitud-minima',
                  'categoria': 'Concreto y acero de refuerzo',
                  'elemento': 'Barra corrugada sometida a compresión',
