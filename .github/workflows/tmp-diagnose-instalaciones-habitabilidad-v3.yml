name: Temporary diagnose installations and habitability v3

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-diagnose-instalaciones-habitabilidad-v3.yml'

permissions:
  contents: read

jobs:
  diagnose-exact-step:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Recreate corrected proposal
        shell: bash
        run: |
          cat scripts/.tmp_install_00.b64 scripts/.tmp_install_01.b64 scripts/.tmp_install_02.b64 scripts/.tmp_install_03.b64 scripts/.tmp_install_04.b64 | base64 -d | gzip -d > /tmp/apply.py
          python /tmp/apply.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('backend/normativa_tecnica.json')
          d=json.loads(p.read_text())
          next(i for i in d['parametros'] if i['id']=='em020-pau-altura-instalacion')['clasificacion']='condicion_normativa'
          p.write_text(json.dumps(d,ensure_ascii=False,separators=(',',':'))+'\n')
          PY
          python -m pip install --disable-pip-version-check -q -r requirements.txt
      - name: Capture every validation command
        shell: bash
        run: |
          mkdir -p diagnosis
          set +e
          python scripts/check_normativa.py > diagnosis/01-check.txt 2>&1; echo status=$? >> diagnosis/01-check.txt
          python -m py_compile backend/api.py backend/normativa.py > diagnosis/02-compile.txt 2>&1; echo status=$? >> diagnosis/02-compile.txt
          rm -rf /tmp/construccion-public
          python scripts/prepare_frontend.py --source . --output /tmp/construccion-public > diagnosis/03-package.txt 2>&1; echo status=$? >> diagnosis/03-package.txt
          test -f /tmp/construccion-public/app/normative-module.js; echo normative_module_status=$? > diagnosis/04-files.txt
          test -f /tmp/construccion-public/index.html; echo index_status=$? >> diagnosis/04-files.txt
          find /tmp/construccion-public -maxdepth 2 -type f | sort >> diagnosis/04-files.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: installations-habitability-diagnosis-v3
          path: diagnosis
          retention-days: 2
