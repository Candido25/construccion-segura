name: Temporary integrate hero image HTML

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate-hero-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/portada-imagen-html-20260726
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Convert hero background to a real image
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index_path = Path("frontend/index.html")
          index_text = index_path.read_text(encoding="utf-8")
          old_html = '        <div class="hero-image"></div>'
          new_html = '''        <picture class="hero-image">
                  <img src="assets/site-photos/web/hero-portada.webp" width="2844" height="1600" alt="" decoding="async" fetchpriority="high">
                </picture>'''
          if old_html not in index_text:
              raise SystemExit("No se encontró el contenedor hero-image esperado en frontend/index.html")
          index_path.write_text(index_text.replace(old_html, new_html, 1), encoding="utf-8")

          css_path = Path("frontend/hero.css")
          css_text = css_path.read_text(encoding="utf-8")
          old_css = '''.home-conversion-hero .hero-image {
            background:
              linear-gradient(200deg, rgba(255,244,232,0.06), rgba(30,52,62,0.42)),
              url("assets/site-photos/web/hero-portada.webp") center/cover;
            border-radius: 0 0 0 var(--radius);
            filter: saturate(0.9) contrast(1.03);
          }
          '''
          new_css = '''.home-conversion-hero .hero-image {
            display: block;
            overflow: hidden;
            border-radius: 0 0 0 var(--radius);
            filter: saturate(0.9) contrast(1.03);
          }

          .home-conversion-hero .hero-image img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
          }

          .home-conversion-hero .hero-image::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(200deg, rgba(255,244,232,0.06), rgba(30,52,62,0.42));
            pointer-events: none;
          }
          '''
          if old_css not in css_text:
              raise SystemExit("No se encontró el bloque hero-image esperado en frontend/hero.css")
          css_path.write_text(css_text.replace(old_css, new_css, 1), encoding="utf-8")

          sw_path = Path("frontend/service-worker.js")
          sw_text = sw_path.read_text(encoding="utf-8")
          if 'const CACHE_VERSION = "mi-casa-segura-pwa-v16";' not in sw_text:
              raise SystemExit("La versión esperada de caché no coincide")
          sw_text = sw_text.replace(
              'const CACHE_VERSION = "mi-casa-segura-pwa-v16";',
              'const CACHE_VERSION = "mi-casa-segura-pwa-v17";',
              1,
          )
          anchor = '  "/assets/brand/logo-marca-construccion-segura-transparente.png"\n'
          image_entry = '  "/assets/site-photos/web/hero-portada.webp",\n'
          if image_entry not in sw_text:
              if anchor not in sw_text:
                  raise SystemExit("No se encontró el punto de inserción del recurso de portada")
              sw_text = sw_text.replace(anchor, image_entry + anchor, 1)
          sw_path.write_text(sw_text, encoding="utf-8")
          PY

      - name: Validate the integration
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check Pillow==11.3.0 tinycss2==1.4.0
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          image_path = Path("frontend/assets/site-photos/web/hero-portada.webp")
          with Image.open(image_path) as image:
              image.load()
              if image.format != "WEBP":
                  raise SystemExit(f"Formato inesperado: {image.format}")
              if image.size != (2844, 1600):
                  raise SystemExit(f"Dimensiones inesperadas: {image.size}")
          PY
          python scripts/prepare_frontend.py
          python scripts/run_frontend_validator.py check_assets
          python scripts/run_frontend_validator.py check_resources
          python scripts/run_frontend_validator.py check_site
          python -m py_compile backend/api.py scripts/prepare_frontend.py scripts/run_frontend_validator.py
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find frontend -type f -name '*.js' -print0)
          grep -q '<picture class="hero-image">' frontend/index.html
          grep -q 'object-fit: cover' frontend/hero.css
          grep -q 'mi-casa-segura-pwa-v17' frontend/service-worker.js

      - name: Commit integrated page changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/index.html frontend/hero.css frontend/service-worker.js
          if git diff --cached --quiet; then
            echo "La integración ya está confirmada en la rama."
            exit 0
          fi
          git commit -m "Convertir imagen de portada a HTML real"
          git push origin HEAD:agent/portada-imagen-html-20260726
