name: Temporary live normative 1.7 audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-live-normativa-1-7.yml'

permissions:
  contents: read

jobs:
  verify-live-version:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Wait for and verify Render deployment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live-audit-1-7
          python - <<'PY'
          from __future__ import annotations

          import json
          import time
          import urllib.request
          from collections import Counter
          from pathlib import Path

          BASE = 'https://construccion-segura.onrender.com'

          def fetch(path: str) -> dict:
              request = urllib.request.Request(
                  BASE + path,
                  headers={
                      'User-Agent': 'ConstruccionSegura-live-audit/1.7',
                      'Accept': 'application/json',
                      'Cache-Control': 'no-cache',
                  },
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  if response.status != 200:
                      raise RuntimeError(f'{path}: HTTP {response.status}')
                  return json.loads(response.read().decode('utf-8'))

          last_state = None
          root = None
          listing = None
          for attempt in range(1, 25):
              try:
                  root = fetch('/')
                  listing = fetch('/normativa')
                  last_state = {
                      'attempt': attempt,
                      'version': listing.get('version'),
                      'parameters': listing.get('total_elementos'),
                      'questions': root.get('total_preguntas'),
                      'root_parameters': root.get('total_parametros_normativos'),
                  }
                  if (
                      last_state['version'] == '1.7.0'
                      and last_state['parameters'] == 545
                      and last_state['questions'] == 2008
                      and last_state['root_parameters'] == 545
                  ):
                      break
              except Exception as error:  # noqa: BLE001
                  last_state = {'attempt': attempt, 'error': str(error)}
              time.sleep(min(15, 3 + attempt))
          else:
              Path('live-audit-1-7/report.json').write_text(
                  json.dumps({'ultimo_estado': last_state}, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
              )
              raise SystemExit(f'Render no publicó 1.7.0 dentro del plazo: {last_state}')

          results = listing.get('resultados', [])
          states = Counter(item.get('estado_revision') for item in results)
          sources = Counter(item.get('fuente', {}).get('tipo') for item in results)

          damage = fetch('/api/v1/normativa/parametros/edan-vivienda-inhabitable')
          load_test = fetch('/api/v1/normativa/parametros/e060-prueba-carga-mantenimiento-total')
          underpinning = fetch('/api/v1/normativa/parametros/e050-calzadura-panel-ancho-maximo')
          demolition = fetch('/api/v1/normativa/parametros/g050-demolicion-vivalva-zona-seguridad')
          license_rule = fetch('/api/v1/normativa/parametros/licencia-vigencia-prorroga')
          professional = fetch('/api/v1/normativa/parametros/criterio-ampliacion-evaluar-edificio-completo')

          license_text = license_rule.get('valor', {}).get('texto', '')
          checks = {
              'version': listing.get('version') == '1.7.0',
              'parameters': len(results) == 545 and listing.get('total_elementos') == 545,
              'questions': root.get('total_preguntas') == 2008,
              'root_parameters': root.get('total_parametros_normativos') == 545,
              'rne_validated': states['validado_con_numeral'] == 511,
              'official_validated': states['validado_con_fuente_oficial'] == 17,
              'technical_reviewed': states['criterio_tecnico_revisado'] == 16,
              'pilot': states['piloto_verificado'] == 1,
              'new_source_types': sources['normativa_nacional'] == 12 and sources['manual_oficial'] == 5,
              'edan': damage.get('estado_revision') == 'validado_con_fuente_oficial' and damage.get('fuente', {}).get('tipo') == 'manual_oficial',
              'load_test': load_test.get('valor', {}).get('valor') == 24,
              'underpinning': underpinning.get('valor', {}).get('valor') == 1.2,
              'demolition': demolition.get('valor', {}).get('valor') == 8,
              'license': '36 meses' in license_text and '12 meses' in license_text,
              'professional_criterion': professional.get('estado_revision') == 'criterio_tecnico_revisado' and professional.get('fuente', {}).get('tipo') == 'criterio_tecnico',
          }

          report = {
              'attempts_until_deployment': last_state.get('attempt'),
              'version_normativa': listing.get('version'),
              'total_parametros': listing.get('total_elementos'),
              'total_preguntas': root.get('total_preguntas'),
              'estados': dict(states),
              'tipos_fuente': dict(sources),
              'edan_estado': damage.get('estado_revision'),
              'prueba_carga_horas': load_test.get('valor', {}).get('valor'),
              'calzadura_panel_m': underpinning.get('valor', {}).get('valor'),
              'demolicion_zona_m': demolition.get('valor', {}).get('valor'),
              'licencia_texto': license_text,
              'criterio_ampliacion_estado': professional.get('estado_revision'),
              'comprobaciones': checks,
          }
          Path('live-audit-1-7/report.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          Path('live-audit-1-7/report.txt').write_text(
              '\n'.join([
                  f"version_normativa={listing.get('version')}",
                  f"total_parametros={listing.get('total_elementos')}",
                  f"total_preguntas={root.get('total_preguntas')}",
                  f"validado_con_numeral={states['validado_con_numeral']}",
                  f"validado_con_fuente_oficial={states['validado_con_fuente_oficial']}",
                  f"criterio_tecnico_revisado={states['criterio_tecnico_revisado']}",
                  f"piloto_verificado={states['piloto_verificado']}",
                  f"normativa_nacional={sources['normativa_nacional']}",
                  f"manual_oficial={sources['manual_oficial']}",
                  f"prueba_carga_horas={load_test.get('valor', {}).get('valor')}",
                  f"calzadura_panel_m={underpinning.get('valor', {}).get('valor')}",
                  f"demolicion_zona_m={demolition.get('valor', {}).get('valor')}",
                  f"comprobaciones_correctas={sum(checks.values())}/{len(checks)}",
              ]) + '\n', encoding='utf-8'
          )
          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              raise SystemExit('Comprobaciones fallidas: ' + ', '.join(failed))
          PY

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-normativa-1-7-audit
          path: live-audit-1-7
          retention-days: 1
