name: Temporary live normative 1.6 audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-live-normativa-1-6.yml'

permissions:
  contents: read

jobs:
  verify-live-normative-version:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for and verify Render deployment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live-audit-1-6
          python - <<'PY'
          from __future__ import annotations

          import json
          import time
          import urllib.request
          from pathlib import Path

          BASE = 'https://construccion-segura.onrender.com'

          def fetch(path: str) -> dict:
              request = urllib.request.Request(
                  BASE + path,
                  headers={
                      'User-Agent': 'ConstruccionSegura-live-audit/1.6',
                      'Accept': 'application/json',
                      'Cache-Control': 'no-cache',
                  },
              )
              with urllib.request.urlopen(request, timeout=45) as response:
                  if response.status != 200:
                      raise RuntimeError(f'{path}: HTTP {response.status}')
                  return json.loads(response.read().decode('utf-8'))

          last_state = None
          root = None
          listing = None
          for attempt in range(1, 25):
              try:
                  root = fetch('/')
                  listing = fetch('/api/v1/normativa/parametros?limite=100')
                  version = listing.get('version') or listing.get('version_normativa')
                  total = listing.get('total_encontrados')
                  questions = root.get('total_preguntas')
                  root_parameters = root.get('total_parametros_normativos')
                  last_state = {
                      'attempt': attempt,
                      'version': version,
                      'total': total,
                      'questions': questions,
                      'root_parameters': root_parameters,
                  }
                  if version == '1.6.0' and total == 374 and questions == 1837 and root_parameters == 374:
                      break
              except Exception as error:  # noqa: BLE001
                  last_state = {'attempt': attempt, 'error': str(error)}
              time.sleep(min(15, 3 + attempt))
          else:
              Path('live-audit-1-6/report.json').write_text(
                  json.dumps({'ultimo_estado': last_state}, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
              )
              raise SystemExit(f'Render no publicó 1.6.0 dentro del tiempo de espera: {last_state}')

          compatibility = fetch('/normativa')
          warm = fetch('/api/v1/normativa/parametros/is010-dotacion-vivienda-calido')
          ventilation = fetch('/api/v1/normativa/parametros/a010-ventilacion-natural-vano-minimo')
          drainage = fetch('/api/v1/normativa/parametros/is010-desague-pendiente-hasta-75')
          pau = fetch('/api/v1/normativa/parametros/em020-pau-caja-dimensiones-minimas')
          thermal = fetch('/api/v1/normativa/parametros/em110-u-techo-altoandino-maxima')
          pilot_detail = fetch('/api/v1/normativa/parametros/e060-escalera-garganta-sin-minimo-universal')

          results = compatibility.get('resultados', [])
          validated = sum(item.get('estado_revision') == 'validado_con_numeral' for item in results)
          pilot = sum(item.get('estado_revision') == 'piloto_verificado' for item in results)
          ventilation_formula = ventilation.get('valor', {}).get('formula', '')
          pau_text = pau.get('valor', {}).get('texto', '').replace(' ', '').lower()

          checks = {
              'version_normativa': (listing.get('version') or listing.get('version_normativa')) == '1.6.0',
              'total_parametros': listing.get('total_encontrados') == 374,
              'compatibilidad_completa': compatibility.get('total_elementos') == 374 and len(results) == 374,
              'validados': validated == 373,
              'piloto': pilot == 1,
              'detalle_piloto': pilot_detail.get('estado_revision') == 'piloto_verificado',
              'preguntas': root.get('total_preguntas') == 1837,
              'root_parametros': root.get('total_parametros_normativos') == 374,
              'dotacion_calido': warm.get('valor', {}).get('valor') == 169,
              'ventilacion_natural': '0.05' in ventilation_formula,
              'pendiente_desague': drainage.get('valor', {}).get('valor') == 1.5,
              'pau_dimensiones': '300mm' in pau_text,
              'transmitancia_altoandino': thermal.get('valor', {}).get('valor') == 0.83,
          }

          report = {
              'intentos_hasta_despliegue': last_state.get('attempt'),
              'version_normativa': listing.get('version') or listing.get('version_normativa'),
              'total_parametros': listing.get('total_encontrados'),
              'resultados_completos': len(results),
              'validados_con_numeral': validated,
              'piloto_verificado': pilot,
              'total_preguntas': root.get('total_preguntas'),
              'dotacion_vivienda_clima_calido_litros_persona_dia': warm.get('valor', {}).get('valor'),
              'ventilacion_natural_formula': ventilation_formula,
              'pendiente_desague_hasta_75_mm_porcentaje': drainage.get('valor', {}).get('valor'),
              'pau_dimensiones': pau.get('valor', {}).get('texto'),
              'u_techo_altoandino': thermal.get('valor', {}).get('valor'),
              'comprobaciones': checks,
          }
          Path('live-audit-1-6/report.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          Path('live-audit-1-6/report.txt').write_text(
              '\n'.join([
                  f"intentos_hasta_despliegue={last_state.get('attempt')}",
                  f"version_normativa={report['version_normativa']}",
                  f"total_parametros={report['total_parametros']}",
                  f"resultados_completos={len(results)}",
                  f"validados_con_numeral={validated}",
                  f"piloto_verificado={pilot}",
                  f"total_preguntas={report['total_preguntas']}",
                  f"dotacion_calido={report['dotacion_vivienda_clima_calido_litros_persona_dia']}",
                  f"ventilacion_formula={ventilation_formula}",
                  f"pendiente_desague={report['pendiente_desague_hasta_75_mm_porcentaje']}",
                  f"pau_dimensiones={report['pau_dimensiones']}",
                  f"u_techo_altoandino={report['u_techo_altoandino']}",
                  f"comprobaciones_correctas={sum(checks.values())}/{len(checks)}",
              ]) + '\n',
              encoding='utf-8',
          )
          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              raise SystemExit('Comprobaciones fallidas: ' + ', '.join(failed))
          PY

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-normativa-1-6-audit
          path: live-audit-1-6
          retention-days: 1
