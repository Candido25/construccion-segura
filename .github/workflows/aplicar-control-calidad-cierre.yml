name: Aplicar control de calidad, recepción y cierre

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/ampliar_control_calidad_cierre.py
      - scripts/corregir_control_calidad.py
      - scripts/control_calidad_payload.trigger
      - .github/workflows/aplicar-control-calidad-cierre.yml

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ampliar-control-calidad-cierre-20260727
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/corregir_control_calidad.py
      - name: Recuperar inventario validado
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          import hashlib, json, os, urllib.request
          expected = {
              1: (3000, "d20e2d7628259034ecf322ed3fcd881769022623137a61a6f570e505bb8eeacf"),
              2: (3000, "a5b504efd8cde08b41dd5227b1cc3ab4d721ec947f3cc139208180132781cf03"),
              3: (3000, "2e1ac6a97ee19a936ec7258b1ec10546fdb5a555439db7808048ab454194c554"),
              4: (3000, "a199d48ff0508008c9301d4030e423fab1fed6c41b739e8429cf1e8c5b7dc02a"),
              5: (3000, "7577b736f428fe169ae587417c22e9efce6203d34e21ca42193284c7afb85ad1"),
              6: (3000, "7786c7075687576e6a819ff9b3618537659caefd9f340dcc205052aed86d4e7d"),
              7: (48, "be7ee51f784e6ff9fa33d163f27d61782c8852a87530f01e93f52a5a02373ea9"),
          }
          repo = os.environ["GITHUB_REPOSITORY"]
          number = os.environ["PR_NUMBER"]
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/issues/{number}/comments?per_page=100",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request) as response:
              comments = json.load(response)
          chunks = {}
          for comment in comments:
              body = comment.get("body", "")
              if body.startswith("CONTROL_CALIDAD_PAYLOAD_") and ":" in body:
                  label, data = body.split(":", 1)
                  chunks[int(label.removeprefix("CONTROL_CALIDAD_PAYLOAD_"))] = "".join(data.split())
          chunks[5] = chunks[51] + chunks[52] + chunks[53]
          for order, (length, digest) in expected.items():
              data = chunks.get(order, "")
              if len(data) != length or hashlib.sha256(data.encode()).hexdigest() != digest:
                  raise SystemExit(f"Fragmento {order} inválido")
          payload = "".join(chunks[order] for order in sorted(expected))
          open("/tmp/control_calidad_payload.b64", "w", encoding="utf-8").write(payload)
          PY
      - name: Aplicar inventario y validar
        run: |
          python scripts/ampliar_control_calidad_cierre.py /tmp/control_calidad_payload.b64
          python scripts/check_normativa.py
      - name: Publicar archivos definitivos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/normativa_tecnica.json backend/preguntas_tecnicas.json scripts/check_normativa.py docs/VALIDACION_CONTROL_CALIDAD_CIERRE_2026-07-27.md
          git diff --cached --quiet || git commit -m "Ampliar control de calidad, recepción y cierre"
          git push origin HEAD:agent/ampliar-control-calidad-cierre-20260727
