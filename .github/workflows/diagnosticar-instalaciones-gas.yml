name: Diagnosticar instalaciones de gas

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/diagnosticar_instalaciones_gas.py
      - .github/workflows/diagnosticar-instalaciones-gas.yml

permissions:
  contents: write

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          ref: agent/ampliar-gas-combustion-20260727
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar diagnóstico
        run: python scripts/diagnosticar_instalaciones_gas.py
      - name: Confirmar diagnóstico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DIAGNOSTICO_INSTALACIONES_GAS_2026-07-27.md
          git diff --cached --quiet || git commit -m "Registrar diagnóstico de instalaciones de gas"
          git push origin HEAD:agent/ampliar-gas-combustion-20260727
