name: Temporary live normative 1.1 audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-live-normativa-1-1.yml'

permissions:
  contents: read

jobs:
  verify-live-normative-version:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify Render normative deployment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          endpoint='https://construccion-segura.onrender.com/api/v1/normativa/parametros?limite=20'

          ready=0
          for attempt in $(seq 1 18); do
            code=$(curl --retry 3 --retry-all-errors --retry-delay 4 \
              --connect-timeout 25 --max-time 180 -sS \
              -H 'Origin: https://www.construccionsegura.org.pe' \
              -o audit/parametros.json -w '%{http_code}' \
              "${endpoint}&audit=${GITHUB_RUN_ID}-${attempt}") || code=000
            echo "attempt=${attempt} http=${code}" | tee -a audit/report.txt
            if [ "$code" = '200' ] && python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('audit/parametros.json').read_text(encoding='utf-8'))
          raise SystemExit(0 if payload.get('version') == '1.1.0' else 1)
          PY
            then
              ready=1
              break
            fi
            sleep 20
          done

          if [ "$ready" -ne 1 ]; then
            echo 'Render no publicó la versión normativa 1.1.0 dentro del periodo de comprobación.' >&2
            cat audit/parametros.json >&2 || true
            exit 1
          fi

          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          payload = json.loads(Path('audit/parametros.json').read_text(encoding='utf-8'))
          items = payload['resultados']
          assert payload['version'] == '1.1.0', payload
          assert payload['total_encontrados'] == 20, payload
          assert payload['mostrados'] == 20, payload

          states = Counter(item['estado_revision'] for item in items)
          assert states['validado_con_numeral'] == 19, states
          assert states['piloto_verificado'] == 1, states

          by_id = {item['id']: item for item in items}
          contrahuella = by_id['a010-escalera-contrahuella-maxima']
          assert contrahuella['fuente']['numeral'] == '23.2.c', contrahuella
          assert contrahuella['fuente']['numeral_confirmado'] is True, contrahuella

          descanso = by_id['a010-escalera-baranda-descanso-altura-minima']
          assert descanso['elemento'] == 'Baranda en descanso con abertura en altura', descanso
          assert 'más de 1.00 m' in descanso['valor']['texto'], descanso

          garganta = by_id['e060-escalera-garganta-sin-minimo-universal']
          assert garganta['estado_revision'] == 'piloto_verificado', garganta
          assert '9.6.2.1' in garganta['fuente']['numeral'], garganta

          report = Path('audit/report.txt')
          with report.open('a', encoding='utf-8') as stream:
              stream.write(f"version={payload['version']}\n")
              stream.write(f"total={payload['total_encontrados']}\n")
              stream.write(f"validado_con_numeral={states['validado_con_numeral']}\n")
              stream.write(f"piloto_verificado={states['piloto_verificado']}\n")
              stream.write(f"contrahuella_numeral={contrahuella['fuente']['numeral']}\n")
              stream.write(f"garganta_estado={garganta['estado_revision']}\n")
          print(report.read_text(encoding='utf-8'))
          PY

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-normativa-1-1-audit
          path: audit/
          if-no-files-found: warn
          retention-days: 1
