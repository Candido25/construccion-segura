name: Temporary diagnose pathologies repairs

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-diagnose-patologias-reparaciones.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Execute apply script and capture output
        shell: bash
        run: |
          mkdir -p diagnosis
          set +e
          python - <<'PY' > diagnosis/output.txt 2>&1
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/tmp-apply-patologias-reparaciones.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'apply-pathologies.py', 'exec'), {})
          PY
          echo "exit_status=$?" >> diagnosis/output.txt
          python - <<'PY' >> diagnosis/output.txt 2>&1
          import json
          from pathlib import Path
          for name in ['backend/normativa_tecnica.json','backend/preguntas_tecnicas.json']:
              path=Path(name)
              try:
                  data=json.loads(path.read_text(encoding='utf-8'))
                  print(name, data.get('version'), len(data.get('parametros',[])), sum(len(c.get('preguntas',[])) for c in data.get('categorias',[])))
              except Exception as error:
                  print(name, type(error).__name__, error)
          PY
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: pathologies-apply-diagnosis
          path: diagnosis
          retention-days: 2
