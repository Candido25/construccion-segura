name: Site checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-static-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Prepare isolated public package
        run: python scripts/prepare_frontend.py

      - name: Ensure public identity uses Ingeniero
        run: |
          matches=$(grep -RIlE 'Ing\. Civil|Ingeniero civil|ingeniero civil' public --include='*.html' || true)
          if [ -n "$matches" ]; then
            echo "Retired specialty found in:"
            printf '%s\n' "$matches"
            exit 1
          fi

      - name: Validate local links and duplicate IDs
        run: python scripts/run_frontend_validator.py check_site

      - name: Validate backend API syntax
        run: python -m py_compile backend/api.py backend/normativa.py

      - name: Validate structured normative contract
        run: python scripts/check_normativa.py

      - name: Validate normative frontend integration
        run: python scripts/check_normative_frontend.py

      - name: Validate Mi Casa Segura architecture
        run: node scripts/check_app_architecture.mjs

      - name: Validate all public JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find public -type f -name '*.js' -print0)
