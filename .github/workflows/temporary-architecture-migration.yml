name: Temporary architecture migration

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect-and-migrate:
    if: github.head_ref == 'agent/arquitectura-raiz-estatica-20260726' || github.ref_name == 'agent/arquitectura-raiz-estatica-20260726'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/arquitectura-raiz-estatica-20260726
          fetch-depth: 0

      - name: Inspect current public architecture
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '=== TOP LEVEL ==='
            find . -maxdepth 1 -mindepth 1 -printf '%f\n' | sort
            echo '=== FRONTEND TOP LEVEL ==='
            find frontend -maxdepth 1 -mindepth 1 -printf '%f\n' | sort
            echo '=== WORKFLOWS ==='
            find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort
            echo '=== FRONTEND REFERENCES IN SCRIPTS/WORKFLOWS ==='
            grep -RIn --exclude='temporary-architecture-migration.yml' -E 'frontend|baseline-public|prepare_frontend|check_site' scripts .github/workflows || true
            echo '=== GITIGNORE ==='
            test -f .gitignore && cat .gitignore || true
          } > architecture-inspection.txt
          tail -n 80 architecture-inspection.txt

      - name: Upload architecture inspection
        uses: actions/upload-artifact@v4
        with:
          name: architecture-inspection
          path: architecture-inspection.txt
          retention-days: 1
