name: Temporary apply pathologies repairs and extensions

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-apply-patologias-reparaciones.yml'

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply reviewed expansion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import base64
          import gzip
          import json
          import re
          from pathlib import Path

          ROOT = Path('.')
          BACKEND = ROOT / 'backend'
          records = json.loads(gzip.decompress(base64.b64decode(
              (ROOT / 'scripts/.tmp_pathologies_records.b64').read_text(encoding='utf-8')
          )).decode('utf-8'))

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'No se encontró el texto esperado para {label}')
              return text.replace(old, new, 1)

          normative_path = BACKEND / 'normativa_tecnica.json'
          faq_path = BACKEND / 'preguntas_tecnicas.json'
          normative = json.loads(normative_path.read_text(encoding='utf-8'))
          faq = json.loads(faq_path.read_text(encoding='utf-8'))
          if normative.get('version') != '1.6.0' or len(normative.get('parametros', [])) != 374:
              raise SystemExit('La base inicial no coincide con la versión 1.6.0 de 374 parámetros.')

          existing_ids = {item['id'] for item in normative['parametros']}
          proposed_ids = [item['id'] for item in records]
          if len(proposed_ids) != len(set(proposed_ids)) or existing_ids.intersection(proposed_ids):
              raise SystemExit('El lote contiene identificadores duplicados o ya existentes.')

          categories = {category.get('nombre'): category for category in faq.get('categorias', [])}
          existing_questions = [
              item for category in faq.get('categorias', [])
              for item in category.get('preguntas', []) if isinstance(item, dict)
          ]
          max_q = max(int(item['id'][1:]) for item in existing_questions if re.fullmatch(r'q\d+', item.get('id', '')))
          question_keys = {
              re.sub(r'\s+', ' ', str(item.get('pregunta', '')).strip().lower())
              for item in existing_questions
          }

          for offset, raw in enumerate(records, 1):
              item = dict(raw)
              category_name = item.pop('_qcat')
              question = item.pop('_question')
              answer = item.pop('_answer')
              if category_name not in categories:
                  raise SystemExit(f'Categoría FAQ inexistente: {category_name}')
              key = re.sub(r'\s+', ' ', question.strip().lower())
              if key in question_keys:
                  raise SystemExit(f'Pregunta duplicada: {question}')
              qid = f'q{max_q + offset}'
              categories[category_name]['preguntas'].append({
                  'id': qid,
                  'pregunta': question,
                  'respuesta': answer,
              })
              question_keys.add(key)
              item['faq_relacionadas'] = [qid]
              normative['parametros'].append(item)

          normative['version'] = '1.7.0'
          normative['fecha_revision'] = '2026-07-27'
          normative_path.write_text(
              json.dumps(normative, ensure_ascii=False, separators=(',', ':')) + '\n',
              encoding='utf-8',
          )
          faq_path.write_text(
              json.dumps(faq, ensure_ascii=False, separators=(',', ':')) + '\n',
              encoding='utf-8',
          )

          model_path = BACKEND / 'normativa.py'
          model = model_path.read_text(encoding='utf-8')
          model = replace_once(
              model,
              '    tipo: Literal["RNE", "criterio_tecnico", "fuente_interna"]\n',
              '    tipo: Literal["RNE", "normativa_nacional", "manual_oficial", "criterio_tecnico", "fuente_interna"]\n',
              'tipos de fuente',
          )
          model = replace_once(
              model,
              '    "validado_con_numeral",\n    "borrador",',
              '    "validado_con_numeral",\n    "validado_con_fuente_oficial",\n    "criterio_tecnico_revisado",\n    "borrador",',
              'estados editoriales',
          )
          old_validator = '''        if self.fuente.tipo == "RNE" and not self.fuente.url_oficial:
              raise ValueError("Todo parámetro atribuido al RNE requiere una URL oficial.")
          if self.clasificacion in {
              "minimo_normativo",
              "maximo_normativo",
              "formula_normativa",
              "condicion_normativa",
              "prohibicion",
          } and self.fuente.tipo != "RNE":
              raise ValueError("Los requisitos normativos deben apuntar a una fuente RNE.")
          if not self.faq_relacionadas:
              raise ValueError("Cada parámetro debe conservar trazabilidad con al menos una FAQ.")
          return self
          '''
          old_validator = old_validator.replace('\n          ', '\n').lstrip('\n')
          new_validator = '''        fuentes_oficiales = {"RNE", "normativa_nacional", "manual_oficial"}
              if self.fuente.tipo in fuentes_oficiales and not self.fuente.url_oficial:
                  raise ValueError("Toda fuente oficial requiere una URL oficial.")
              if self.clasificacion in {
                  "minimo_normativo",
                  "maximo_normativo",
                  "formula_normativa",
                  "prohibicion",
              } and self.fuente.tipo not in {"RNE", "normativa_nacional"}:
                  raise ValueError("Los límites y prohibiciones normativos requieren una norma oficial.")
              if self.clasificacion == "condicion_normativa" and self.fuente.tipo not in fuentes_oficiales:
                  raise ValueError("Una condición normativa debe apuntar a una fuente oficial.")
              if self.estado_revision == "validado_con_numeral" and self.fuente.tipo != "RNE":
                  raise ValueError("El estado validado_con_numeral se reserva a cláusulas del RNE.")
              if self.estado_revision == "validado_con_fuente_oficial":
                  if self.fuente.tipo not in {"normativa_nacional", "manual_oficial"}:
                      raise ValueError("El estado oficial requiere normativa nacional o manual oficial.")
                  if not self.fuente.numeral or not self.fuente.numeral_confirmado:
                      raise ValueError("Una fuente oficial validada requiere referencia confirmada.")
              if self.estado_revision == "criterio_tecnico_revisado":
                  if self.fuente.tipo != "criterio_tecnico":
                      raise ValueError("Un criterio técnico revisado requiere fuente de criterio técnico.")
                  if self.clasificacion not in {"recomendacion", "depende_calculo"}:
                      raise ValueError("Un criterio técnico solo puede ser recomendación o depender del cálculo.")
              if not self.faq_relacionadas:
                  raise ValueError("Cada parámetro debe conservar trazabilidad con al menos una FAQ.")
              return self
          '''
          new_validator = new_validator.replace('\n              ', '\n        ').lstrip('\n')
          model = replace_once(model, old_validator, new_validator, 'validador de trazabilidad')
          model_path.write_text(model, encoding='utf-8')

          frontend_path = ROOT / 'frontend/app/normative-module.js'
          frontend = frontend_path.read_text(encoding='utf-8')
          frontend = replace_once(
              frontend,
              '    validado_con_numeral: "Validado con numeral",\n    borrador:',
              '    validado_con_numeral: "Validado con numeral",\n    validado_con_fuente_oficial: "Validado con fuente oficial",\n    criterio_tecnico_revisado: "Criterio técnico revisado",\n    borrador:',
              'etiquetas editoriales',
          )
          frontend = replace_once(
              frontend,
              '''    const numeral = source.numeral_confirmado && source.numeral
                ? `<span>Numeral ${escapeHtml(source.numeral)}</span>`
                : '<span class="is-pending">Numeral específico pendiente de verificación editorial</span>';
          ''',
              '''    const referenceLabel = source.tipo === "RNE" ? "Numeral" : "Referencia";
              const numeral = source.numeral_confirmado && source.numeral
                ? `<span>${referenceLabel} ${escapeHtml(source.numeral)}</span>`
                : `<span class="is-pending">${referenceLabel} específica pendiente de verificación editorial</span>`;
          ''',
              'referencia de fuente',
          )
          frontend_path.write_text(frontend, encoding='utf-8')

          contract_path = ROOT / 'docs/CONTRATO_NORMATIVA.md'
          contract = contract_path.read_text(encoding='utf-8')
          contract = replace_once(
              contract,
              '3. Toda atribución al RNE conserva norma, dispositivo y URL oficial.\n',
              '3. Toda atribución oficial conserva tipo de fuente, norma o manual, dispositivo, referencia y URL oficial.\n',
              'principio de fuente',
          )
          contract = replace_once(
              contract,
              '''## Estados editoriales

          - `piloto_verificado`: valor revisado para el piloto; numeral aún pendiente.
          - `validado_con_numeral`: norma y numeral confirmados.
          - `borrador`:'''.replace('\n          ', '\n'),
              '''## Tipos de fuente

          - `RNE`: norma integrante del Reglamento Nacional de Edificaciones.
          - `normativa_nacional`: ley, decreto, reglamento o trámite oficial distinto del RNE.
          - `manual_oficial`: manual o guía aprobada por una entidad pública.
          - `criterio_tecnico`: criterio profesional que no se presenta como obligación normativa.
          - `fuente_interna`: contenido editorial interno.

          ## Estados editoriales

          - `piloto_verificado`: valor revisado para el piloto; numeral aún pendiente.
          - `validado_con_numeral`: cláusula del RNE y numeral confirmados.
          - `validado_con_fuente_oficial`: referencia confirmada de normativa nacional o manual oficial.
          - `criterio_tecnico_revisado`: recomendación o decisión sujeta a diagnóstico o cálculo profesional.
          - `borrador`:'''.replace('\n          ', '\n'),
              'tipos de fuente y estados',
          )
          contract_path.write_text(contract, encoding='utf-8')

          checker_path = ROOT / 'scripts/check_normativa.py'
          checker = checker_path.read_text(encoding='utf-8')
          replacements = [
              ('if len(base.parametros) < 374:', 'if len(base.parametros) < 545:'),
              ('por lo menos 374 parámetros validados', 'por lo menos 545 parámetros revisados'),
              ('if parametro.fuente.tipo == "RNE":', 'if parametro.fuente.tipo in {"RNE", "normativa_nacional", "manual_oficial"}:'),
              ('la fuente RNE no es oficial', 'la fuente oficial no apunta a gob.pe'),
              ('if validados < 373:', 'if validados < 511:'),
              ('al menos 373 numerales validados', 'al menos 511 numerales RNE validados'),
              ('if base.version != "1.6.0":', 'if base.version != "1.7.0":'),
              ('La versión normativa esperada es 1.6.0', 'La versión normativa esperada es 1.7.0'),
              ('if len(todas) < 1837:', 'if len(todas) < 2008:'),
              ('El bloque de instalaciones requiere por lo menos 1837 preguntas técnicas.', 'El bloque de patologías requiere por lo menos 2008 preguntas técnicas.'),
          ]
          for old, new in replacements:
              checker = replace_once(checker, old, new, old)
          checker = replace_once(
              checker,
              '''    BaseNormativa.model_validate(datos_crudos)

              import api  # noqa: E402
          '''.replace('\n              ', '\n'),
              '''    oficiales = sum(
                  parametro.estado_revision == "validado_con_fuente_oficial"
                  for parametro in base.parametros
              )
              criterios = sum(
                  parametro.estado_revision == "criterio_tecnico_revisado"
                  for parametro in base.parametros
              )
              if oficiales < 17:
                  raise SystemExit(f"El bloque requiere al menos 17 referencias oficiales externas al RNE; hay {oficiales}.")
              if criterios < 16:
                  raise SystemExit(f"El bloque requiere al menos 16 criterios técnicos revisados; hay {criterios}.")

              BaseNormativa.model_validate(datos_crudos)

              import api  # noqa: E402
          '''.replace('\n              ', '\n'),
              'conteos de estados nuevos',
          )
          checker = replace_once(
              checker,
              '''    dotacion = api.detalle_parametro_normativo(
                  "is010-dotacion-vivienda-calido"
              )
          '''.replace('\n              ', '\n'),
              '''    dano = api.detalle_parametro_normativo("edan-vivienda-inhabitable")
              if dano["estado_revision"] != "validado_con_fuente_oficial":
                  raise SystemExit("La clasificación EDAN debe conservar su estado oficial.")

              prueba = api.detalle_parametro_normativo("e060-prueba-carga-mantenimiento-total")
              if prueba["valor"]["valor"] != 24:
                  raise SystemExit("La prueba de carga debe conservar 24 horas.")

              calzadura = api.detalle_parametro_normativo("e050-calzadura-panel-ancho-maximo")
              if calzadura["valor"]["valor"] != 1.2:
                  raise SystemExit("El panel de calzadura debe conservar 1.20 m.")

              demolicion = api.detalle_parametro_normativo("g050-demolicion-vivalva-zona-seguridad")
              if demolicion["valor"]["valor"] != 8:
                  raise SystemExit("La zona de seguridad de la cuchara vivalva debe ser 8 m.")

              licencia = api.detalle_parametro_normativo("licencia-vigencia-prorroga")
              if "36 meses" not in licencia["valor"]["texto"] or "12 meses" not in licencia["valor"]["texto"]:
                  raise SystemExit("La licencia no conserva su vigencia y prórroga.")

              criterio = api.detalle_parametro_normativo("criterio-ampliacion-evaluar-edificio-completo")
              if criterio["estado_revision"] != "criterio_tecnico_revisado":
                  raise SystemExit("La ampliación debe mostrarse como criterio técnico revisado.")

              dotacion = api.detalle_parametro_normativo(
                  "is010-dotacion-vivienda-calido"
              )
          '''.replace('\n              ', '\n'),
              'comprobaciones del bloque',
          )
          checker_path.write_text(checker, encoding='utf-8')

          report = '''# Validación normativa de patologías, reparaciones y ampliaciones — 27 de julio de 2026

          ## Alcance

          Se incorporaron **171 parámetros técnicos** y **171 preguntas nuevas** sobre definiciones de intervención, mantenimiento, evaluación y reforzamiento de estructuras existentes, pruebas de carga, excavaciones y calzaduras, seguridad de demoliciones, clasificación EDAN, licencias y diagnóstico profesional de patologías.

          ## Fuentes oficiales revisadas

          - G.040 Definiciones — RM N.° 029-2021-VIVIENDA.
          - G.050 Seguridad durante la Construcción — DS N.° 010-2009-VIVIENDA.
          - GE.040 Uso y Mantenimiento.
          - E.030 Diseño Sismorresistente 2026 — RM N.° 183-2026-VIVIENDA.
          - E.050 Suelos y Cimentaciones — RM N.° 406-2018-VIVIENDA.
          - E.060 Concreto Armado — DS N.° 010-2009-VIVIENDA.
          - Reglamento de Licencias — DS N.° 029-2019-VIVIENDA.
          - Manual EDAN del MVCS, versión 3.0 — RM N.° 170-2025-VIVIENDA.

          ## Resultado

          - Versión normativa: `1.7.0`.
          - Parámetros totales: 545.
          - Registros `validado_con_numeral`: 511.
          - Registros `validado_con_fuente_oficial`: 17.
          - Registros `criterio_tecnico_revisado`: 16.
          - Registros piloto: 1.
          - Preguntas técnicas: 2008.

          ## Evolución del contrato

          La base distingue ahora las cláusulas del RNE, la normativa nacional y los manuales oficiales, y los criterios técnicos sujetos a diagnóstico o cálculo profesional.

          ## Criterios editoriales

          - Una grieta no se clasifica solo por su ancho.
          - La reparación no debe ocultar evidencia antes del diagnóstico.
          - Agregar pisos exige evaluar la estructura y cimentación completas.
          - Las categorías EDAN no sustituyen un análisis estructural detallado.
          - Una licencia administrativa no reemplaza el proyecto ni la seguridad profesional.
          '''.replace('\n          ', '\n')
          (ROOT / 'docs/VALIDACION_NORMATIVA_PATOLOGIAS_REPARACIONES_2026-07-27.md').write_text(report, encoding='utf-8')

          totals = {
              'version': normative['version'],
              'new_parameters': len(records),
              'total_parameters': len(normative['parametros']),
              'total_questions': sum(len(c.get('preguntas', [])) for c in faq.get('categorias', [])),
          }
          print(json.dumps(totals, ensure_ascii=False))
          if totals != {'version': '1.7.0', 'new_parameters': 171, 'total_parameters': 545, 'total_questions': 2008}:
              raise SystemExit(f'Totales inesperados: {totals}')
          PY

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -q -r requirements.txt

      - name: Validate contract API and frontend
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_normativa.py
          python -m py_compile backend/api.py backend/normativa.py scripts/check_normativa.py
          node --check frontend/app/normative-module.js
          rm -rf public
          python scripts/prepare_frontend.py
          test -f public/index.html
          test -f public/app/normative-module.js
          test ! -e public/backend
          test ! -e public/scripts

      - name: Commit permanent files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            backend/normativa_tecnica.json \
            backend/preguntas_tecnicas.json \
            backend/normativa.py \
            frontend/app/normative-module.js \
            docs/CONTRATO_NORMATIVA.md \
            docs/VALIDACION_NORMATIVA_PATOLOGIAS_REPARACIONES_2026-07-27.md \
            scripts/check_normativa.py
          git diff --cached --quiet && exit 0
          git commit -m 'Ampliar normativa de patologías y reparaciones'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
