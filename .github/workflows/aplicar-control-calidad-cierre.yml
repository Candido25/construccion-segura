name: Aplicar control de calidad, recepción y cierre

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/ampliar_control_calidad_cierre.py
      - scripts/control_calidad_payload.trigger
      - .github/workflows/aplicar-control-calidad-cierre.yml

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ampliar-control-calidad-cierre-20260727
          fetch-depth: 0
      - name: Esperar disparador
        id: disparador
        run: |
          if [ -f scripts/control_calidad_payload.trigger ]; then
            echo "activo=true" >> "$GITHUB_OUTPUT"
          else
            echo "activo=false" >> "$GITHUB_OUTPUT"
            echo "El flujo se activará después de cargar el inventario revisado."
          fi
      - uses: actions/setup-python@v5
        if: steps.disparador.outputs.activo == 'true'
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
        if: steps.disparador.outputs.activo == 'true'
      - name: Recuperar inventario desde comentarios del PR
        if: steps.disparador.outputs.activo == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          number = os.environ["PR_NUMBER"]
          token = os.environ["GH_TOKEN"]
          url = f"https://api.github.com/repos/{repo}/issues/{number}/comments?per_page=100"
          request = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urllib.request.urlopen(request) as response:
              comments = json.load(response)
          chunks = []
          prefix = "CONTROL_CALIDAD_PAYLOAD_"
          for comment in comments:
              body = comment.get("body", "")
              if not body.startswith(prefix) or ":" not in body:
                  continue
              label, data = body.split(":", 1)
              try:
                  order = int(label.removeprefix(prefix))
              except ValueError:
                  continue
              chunks.append((order, "".join(data.split())))
          chunks.sort()
          if not chunks or [n for n, _ in chunks] != list(range(1, len(chunks) + 1)):
              raise SystemExit("Inventario incompleto o desordenado en los comentarios del PR")
          payload = "".join(data for _, data in chunks)
          open("/tmp/control_calidad_payload.b64", "w", encoding="utf-8").write(payload)
          print(f"Inventario recuperado: {len(chunks)} fragmentos, {len(payload)} caracteres")
          PY
      - name: Aplicar inventario y validar
        if: steps.disparador.outputs.activo == 'true'
        run: |
          python scripts/ampliar_control_calidad_cierre.py /tmp/control_calidad_payload.b64
          python scripts/check_normativa.py
      - name: Publicar archivos definitivos
        if: steps.disparador.outputs.activo == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/normativa_tecnica.json backend/preguntas_tecnicas.json scripts/check_normativa.py docs/VALIDACION_CONTROL_CALIDAD_CIERRE_2026-07-27.md
          git diff --cached --quiet || git commit -m "Ampliar control de calidad, recepción y cierre"
          git push origin HEAD:agent/ampliar-control-calidad-cierre-20260727
