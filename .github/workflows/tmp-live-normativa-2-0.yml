name: Temporary live normative 2.0 audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-live-normativa-2-0.yml'

permissions:
  contents: read

jobs:
  verify-live-version:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Wait for and verify Render deployment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live-audit-2-0
          python - <<'PY'
          from __future__ import annotations

          import json
          import time
          import urllib.request
          from collections import Counter
          from pathlib import Path

          BASE='https://construccion-segura.onrender.com'

          def fetch(path: str) -> dict:
              request=urllib.request.Request(
                  BASE+path,
                  headers={
                      'User-Agent':'ConstruccionSegura-live-audit/2.0',
                      'Accept':'application/json',
                      'Cache-Control':'no-cache',
                  },
              )
              with urllib.request.urlopen(request,timeout=45) as response:
                  if response.status!=200:
                      raise RuntimeError(f'{path}: HTTP {response.status}')
                  return json.loads(response.read().decode('utf-8'))

          last=None
          root=None
          complete=None
          for attempt in range(1,25):
              try:
                  root=fetch('/')
                  complete=fetch('/normativa')
                  last={
                      'attempt':attempt,
                      'version':complete.get('version'),
                      'parameters':complete.get('total_elementos'),
                      'questions':root.get('total_preguntas'),
                      'root_parameters':root.get('total_parametros_normativos'),
                  }
                  if (
                      last['version']=='2.0.0'
                      and last['parameters']==886
                      and last['questions']==2349
                      and last['root_parameters']==886
                  ):
                      break
              except Exception as error:  # noqa: BLE001
                  last={'attempt':attempt,'error':str(error)}
              time.sleep(min(15,3+attempt))
          else:
              Path('live-audit-2-0/report.json').write_text(
                  json.dumps({'ultimo_estado':last},ensure_ascii=False,indent=2)+'\n',
                  encoding='utf-8',
              )
              raise SystemExit(f'Render no publicó 2.0.0 dentro del tiempo de espera: {last}')

          results=complete.get('resultados',[])
          states=Counter(item.get('estado_revision') for item in results)
          norms=Counter(item.get('fuente',{}).get('norma') for item in results)

          samples={
              'collector_orientation':fetch('/api/v1/normativa/parametros/em080-colector-orientacion-norte'),
              'collector_inclination':fetch('/api/v1/normativa/parametros/em080-colector-inclinacion-latitud-mas-10'),
              'pv_area':fetch('/api/v1/normativa/parametros/em080-fv-superficie-preliminar-kwp'),
              'pv_weight':fetch('/api/v1/normativa/parametros/em080-fv-peso-preliminar'),
              'pv_ground':fetch('/api/v1/normativa/parametros/em080-fv-marcos-puesta-tierra'),
              'pv_lightning':fetch('/api/v1/normativa/parametros/em080-fv-tierra-no-pararrayo'),
              'shaft_low':fetch('/api/v1/normativa/parametros/em070-pozo-fuego-hasta-3-pisos'),
              'shaft_high':fetch('/api/v1/normativa/parametros/em070-pozo-resistencia-fuego'),
              'gas_openings':fetch('/api/v1/normativa/parametros/em040-edificacion-nueva-aberturas-area-total'),
          }

          checks={
              'version':complete.get('version')=='2.0.0',
              'parameters':len(results)==886 and complete.get('total_elementos')==886,
              'questions':root.get('total_preguntas')==2349,
              'validated':states['validado_con_numeral']==852,
              'official':states['validado_con_fuente_oficial']==17,
              'criteria':states['criterio_tecnico_revisado']==16,
              'pilot':states['piloto_verificado']==1,
              'em080_count':norms['EM.080']==45,
              'collector_north':'norte' in samples['collector_orientation'].get('valor',{}).get('texto','').lower(),
              'inclination_formula':'+ 10' in samples['collector_inclination'].get('valor',{}).get('formula',''),
              'pv_area_formula':'10' in samples['pv_area'].get('valor',{}).get('formula',''),
              'pv_weight_formula':'15' in samples['pv_weight'].get('valor',{}).get('formula',''),
              'pv_ground':samples['pv_ground'].get('estado_revision')=='validado_con_numeral',
              'pv_not_lightning':'no sustituye' in samples['pv_lightning'].get('valor',{}).get('texto','').lower(),
              'shaft_one_hour':samples['shaft_low'].get('valor',{}).get('valor')==1,
              'shaft_two_hours':samples['shaft_high'].get('valor',{}).get('valor')==2 and 'más de tres pisos' in samples['shaft_high'].get('elemento','').lower(),
              'gas_openings':samples['gas_openings'].get('valor',{}).get('valor')==280,
          }

          report={
              'attempts_until_deploy':last.get('attempt'),
              'version_normativa':complete.get('version'),
              'total_parametros':len(results),
              'total_preguntas':root.get('total_preguntas'),
              'estados':dict(states),
              'em080_parametros':norms['EM.080'],
              'muestras':samples,
              'comprobaciones':checks,
          }
          Path('live-audit-2-0/report.json').write_text(
              json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'
          )
          Path('live-audit-2-0/report.txt').write_text(
              '\n'.join([
                  f"intentos_hasta_despliegue={last.get('attempt')}",
                  f"version_normativa={complete.get('version')}",
                  f"total_parametros={len(results)}",
                  f"total_preguntas={root.get('total_preguntas')}",
                  f"validado_con_numeral={states['validado_con_numeral']}",
                  f"validado_con_fuente_oficial={states['validado_con_fuente_oficial']}",
                  f"criterio_tecnico_revisado={states['criterio_tecnico_revisado']}",
                  f"piloto_verificado={states['piloto_verificado']}",
                  f"em080_parametros={norms['EM.080']}",
                  f"fv_superficie_formula={samples['pv_area'].get('valor',{}).get('formula')}",
                  f"fv_peso_formula={samples['pv_weight'].get('valor',{}).get('formula')}",
                  f"pozo_hasta_3_pisos_h={samples['shaft_low'].get('valor',{}).get('valor')}",
                  f"pozo_mas_3_pisos_h={samples['shaft_high'].get('valor',{}).get('valor')}",
                  f"gas_aberturas_cm2={samples['gas_openings'].get('valor',{}).get('valor')}",
                  f"comprobaciones_correctas={sum(checks.values())}/{len(checks)}",
              ])+'\n',encoding='utf-8'
          )
          failed=[name for name,passed in checks.items() if not passed]
          if failed:
              raise SystemExit('Comprobaciones fallidas: '+', '.join(failed))
          PY

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-normativa-2-0-audit
          path: live-audit-2-0
          retention-days: 1
