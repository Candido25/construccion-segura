name: Aplicar ampliación de impermeabilización y humedad

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/aplicar_ampliacion_impermeabilizacion.py
      - .github/workflows/aplicar-impermeabilizacion-humedad.yml

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ampliar-impermeabilizacion-humedad-20260727
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Aplicar inventario de impermeabilización
        run: python scripts/aplicar_ampliacion_impermeabilizacion.py
      - name: Validar base y API
        run: python scripts/check_normativa.py
      - name: Confirmar archivos generados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/normativa_tecnica.json backend/preguntas_tecnicas.json scripts/check_normativa.py docs/VALIDACION_IMPERMEABILIZACION_HUMEDAD_2026-07-27.md
          git diff --cached --quiet || git commit -m "Ampliar impermeabilización y tratamiento de humedad"
          git push origin HEAD:agent/ampliar-impermeabilizacion-humedad-20260727
