name: Temporary normative batch 3 audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-audit-normativa-lote-3.yml'

permissions:
  contents: read

jobs:
  audit-official-standards:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install PDF text tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Download official E.060 and E.070 PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          curl --fail --location --retry 5 --retry-all-errors \
            -A 'Mozilla/5.0' \
            'https://cdn.www.gob.pe/uploads/document/file/2366660/55%20E.060%20CONCRETO%20ARMADO%20DS%20N%C2%B0%20010-2009.pdf?v=1677250657' \
            -o audit/E060.pdf
          curl --fail --location --retry 5 --retry-all-errors \
            -A 'Mozilla/5.0' \
            'https://cdn.www.gob.pe/uploads/document/file/2366661/56%20E.070%20ALBA%C3%91ILERIA.pdf?v=1677250657' \
            -o audit/E070.pdf
          pdftotext -layout audit/E060.pdf audit/E060.txt
          pdftotext -layout audit/E070.pdf audit/E070.txt
          sha256sum audit/E060.pdf audit/E070.pdf > audit/checksums.txt

      - name: Extract clauses and map existing questions
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          import unicodedata
          from pathlib import Path

          audit = Path('audit')

          def normalize(value: str) -> str:
              value = unicodedata.normalize('NFD', value.lower())
              value = ''.join(ch for ch in value if unicodedata.category(ch) != 'Mn')
              return re.sub(r'\s+', ' ', value).strip()

          def contexts(text: str, patterns: list[str], radius: int = 420) -> list[tuple[str, str]]:
              norm = normalize(text)
              found = []
              for pattern in patterns:
                  needle = normalize(pattern)
                  start = 0
                  matches = 0
                  while matches < 4:
                      pos = norm.find(needle, start)
                      if pos < 0:
                          break
                      lo = max(0, pos - radius)
                      hi = min(len(norm), pos + len(needle) + radius)
                      found.append((pattern, norm[lo:hi]))
                      start = pos + len(needle)
                      matches += 1
              return found

          e060 = (audit / 'E060.txt').read_text(encoding='utf-8', errors='ignore')
          e070 = (audit / 'E070.txt').read_text(encoding='utf-8', errors='ignore')

          patterns_e060 = [
              '17 MPa', '14 MPa', '70 mm', '50 mm', '40 mm', '20 mm',
              '25 mm', '1/5', '1/3', '3/4', '7 días', '3 días',
              'recubrimiento de concreto', 'espaciamiento libre',
              'tamaño máximo nominal del agregado grueso', 'juntas de construcción',
              'superficie del concreto', 'doblado de las barras'
          ]
          patterns_e070 = [
              '10 mm', '15 mm', '1,30 m', '1.30 m', '5 cm', '17,15 MPa',
              '13,72 MPa', 'confinamiento', 'columna', 'viga solera', 'dentada',
              'juntas verticales', 'unidades tubulares', 'muro portante',
              'espesor efectivo', 'tuberías', 'mortero', 'grout'
          ]

          lines = ['# Auditoría normativa lote 3', '']
          for name, text, pats in [('E.060', e060, patterns_e060), ('E.070', e070, patterns_e070)]:
              lines += [f'## Contextos {name}', '']
              for pattern, excerpt in contexts(text, pats):
                  lines += [f'### {pattern}', '', excerpt, '']

          raw = json.loads(Path('backend/preguntas_tecnicas.json').read_text(encoding='utf-8'))
          questions = []
          for category in raw.get('categorias', []):
              category_name = category.get('nombre') or category.get('categoria') or ''
              for item in category.get('preguntas', []):
                  if not isinstance(item, dict):
                      continue
                  question = item.get('pregunta', '')
                  answer = item.get('respuesta', '')
                  questions.append({
                      'id': item.get('id'),
                      'categoria': category_name,
                      'pregunta': question,
                      'respuesta': answer,
                      'searchable': normalize(f'{category_name} {question} {answer}'),
                  })

          topics = {
              'resistencia del concreto': ['resistencia concreto', 'f c', 'concreto estructural'],
              'recubrimiento': ['recubrimiento acero', 'recubrimiento columna', 'recubrimiento viga', 'acero tierra'],
              'separación de barras': ['separacion barras', 'espacio libre acero'],
              'agregado grueso': ['tamano agregado', 'piedra concreto'],
              'curado': ['curado concreto', 'curar concreto'],
              'juntas de construcción': ['junta construccion concreto', 'junta fria'],
              'juntas de mortero': ['espesor junta mortero', 'junta albañileria'],
              'altura diaria del muro': ['altura muro por dia', 'hiladas por dia'],
              'confinamiento': ['columna confinamiento', 'viga solera', 'albanileria confinada'],
              'dentado': ['dentado muro columna', 'dientes albanileria'],
              'grout': ['grout', 'concreto liquido'],
              'unidad tubular': ['ladrillo pandereta muro portante', 'unidad tubular'],
              'tuberías en muros': ['tuberia muro portante', 'picado muro'],
          }

          lines += ['## Mapeo de preguntas existentes', '']
          for topic, phrases in topics.items():
              scored = []
              for item in questions:
                  score = sum(1 for phrase in phrases if normalize(phrase) in item['searchable'])
                  words = set(normalize(' '.join(phrases)).split())
                  score += sum(0.08 for word in words if len(word) > 4 and word in item['searchable'])
                  if score:
                      scored.append((score, item))
              scored.sort(key=lambda pair: (-pair[0], str(pair[1]['id'])))
              lines += [f'### {topic}', '']
              for score, item in scored[:12]:
                  response = re.sub(r'\s+', ' ', item['respuesta'])[:420]
                  lines.append(
                      f"- {item['id']} | {item['categoria']} | {item['pregunta']} | {response}"
                  )
              lines.append('')

          (audit / 'report.md').write_text('\n'.join(lines), encoding='utf-8')
          print(f'Preguntas analizadas: {len(questions)}')
          print(f'Reporte: {audit / "report.md"}')
          PY

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: normative-batch-3-audit
          path: audit/
          if-no-files-found: error
          retention-days: 3
