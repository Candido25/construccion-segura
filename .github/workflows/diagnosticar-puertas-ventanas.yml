name: Diagnosticar puertas y ventanas

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/diagnosticar_puertas_ventanas.py
      - .github/workflows/diagnosticar-puertas-ventanas.yml

permissions:
  contents: write

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          ref: agent/ampliar-puertas-ventanas-seguridad-20260727

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar diagnóstico
        run: python scripts/diagnosticar_puertas_ventanas.py

      - name: Confirmar diagnóstico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DIAGNOSTICO_PUERTAS_VENTANAS_2026-07-27.md
          git diff --cached --quiet || git commit -m "Registrar diagnóstico de puertas y ventanas"
          git push origin HEAD:agent/ampliar-puertas-ventanas-seguridad-20260727
