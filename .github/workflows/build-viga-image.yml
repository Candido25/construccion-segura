name: Build verified beam image

on:
  push:
    branches:
      - content/reduccion-viga-ducto-20260721

permissions:
  contents: write

jobs:
  build-image:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/reduccion-viga-ducto-20260721
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image verifier
        run: python -m pip install --disable-pip-version-check pillow

      - name: Decode and validate WebP
        shell: bash
        run: |
          set -euo pipefail
          source_file='assets/site-photos/casos/multifamiliar-seis-niveles/reduccion-viga-ducto-20260721.webp.b64'
          target_file='assets/site-photos/casos/multifamiliar-seis-niveles/reduccion-viga-ducto-20260721.webp'
          base64 --decode "$source_file" > "$target_file"
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib
          path = Path('assets/site-photos/casos/multifamiliar-seis-niveles/reduccion-viga-ducto-20260721.webp')
          data = path.read_bytes()
          expected = 'd52c531b0a7c0cb41a96eff6e0a6ed3b58e16049048874c5917bb2877ad7a541'
          actual = hashlib.sha256(data).hexdigest()
          if actual != expected:
              raise SystemExit(f'SHA-256 incorrecto: {actual}')
          with Image.open(path) as image:
              image.load()
              if image.format != 'WEBP' or image.size != (400, 225):
                  raise SystemExit(f'Imagen inválida: {image.format} {image.size}')
          print(f'Imagen verificada: {actual}')
          PY

      - name: Remove temporary files and commit final image
        shell: bash
        run: |
          set -euo pipefail
          rm -f assets/site-photos/casos/multifamiliar-seis-niveles/reduccion-viga-ducto-20260721.webp.b64
          rm -f .viga-image-trigger
          rm -f .github/workflows/build-viga-image.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publicar fotografía verificada de reducción de viga'
          git push origin HEAD:content/reduccion-viga-ducto-20260721
