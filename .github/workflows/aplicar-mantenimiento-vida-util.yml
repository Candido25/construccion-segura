name: Aplicar mantenimiento y vida útil

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/ampliar_mantenimiento_vida_util.py
      - .github/workflows/aplicar-mantenimiento-vida-util.yml

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ampliar-mantenimiento-vida-util-20260727
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Recuperar y verificar inventario
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          import hashlib, json, os, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          number = os.environ["PR_NUMBER"]
          token = os.environ["GH_TOKEN"]
          url = f"https://api.github.com/repos/{repo}/issues/{number}/comments?per_page=100"
          request = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urllib.request.urlopen(request) as response:
              comments = json.load(response)
          expected = {
              1: (3000, "1aa82b75b6dc63215eaa1ff4ab4aa424e9ea87b9f7f7ce04c5d15f1efc75ca86"),
              2: (3000, "ee8933cdd4a2e74bb246fe1c6d1a45dee0fa963a1025b70829e8c081ab2a1d88"),
              3: (3000, "8cf90524abbac1812ddb8634255e1d290104ff372bcbcae9f55911877b612863"),
              4: (3000, "958155d501f06dd83cb94c115f833d236b42f81dded48ded4b67f93c1be3e010"),
              5: (3000, "0f6d99c170fd7f3bf452d7cea1a0007ff7c6d0548ec2e1282d12dfd8701e3482"),
              6: (2356, "a17d966d5ff66defbfa2c3b69ecc5622c94e4fa66b95d1251959b2c6dfc9e21e"),
          }
          chunks = {}
          for comment in comments:
              body = comment.get("body", "")
              if not body.startswith("MANTENIMIENTO_PAYLOAD_") or ":" not in body:
                  continue
              label, data = body.split(":", 1)
              order = int(label.removeprefix("MANTENIMIENTO_PAYLOAD_"))
              chunks[order] = "".join(data.split())
          valid = True
          for order, (wanted_length, wanted_digest) in expected.items():
              data = chunks.get(order, "")
              digest = hashlib.sha256(data.encode()).hexdigest()
              ok = len(data) == wanted_length and digest == wanted_digest
              print(f"CHUNK_{order}: len={len(data)} sha256={digest} ok={ok}")
              valid = valid and ok
          payload = "".join(chunks.get(order, "") for order in sorted(expected))
          total_digest = hashlib.sha256(payload.encode()).hexdigest()
          print(f"TOTAL: len={len(payload)} sha256={total_digest}")
          valid = valid and len(payload) == 17356 and total_digest == "3de58339eb2b8e1f976de466f2bb03a0c55b86cdf6120b82741f296f6c946ce0"
          if not valid:
              raise SystemExit("El inventario no supera la verificación de integridad")
          open("/tmp/mantenimiento_payload.b64", "w", encoding="utf-8").write(payload)
          PY
      - name: Aplicar inventario y validar
        run: |
          python scripts/ampliar_mantenimiento_vida_util.py /tmp/mantenimiento_payload.b64
          python scripts/check_normativa.py
      - name: Publicar archivos definitivos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/normativa_tecnica.json backend/preguntas_tecnicas.json scripts/check_normativa.py docs/VALIDACION_MANTENIMIENTO_VIDA_UTIL_2026-07-27.md
          git diff --cached --quiet || git commit -m "Ampliar mantenimiento preventivo y vida útil"
          git pull --rebase origin agent/ampliar-mantenimiento-vida-util-20260727
          git push origin HEAD:agent/ampliar-mantenimiento-vida-util-20260727
