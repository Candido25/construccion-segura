name: AAB Android firmado

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generar-aab-firmado:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Comprobar secretos de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.MCS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MCS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MCS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MCS_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Falta MCS_KEYSTORE_BASE64" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Falta MCS_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Falta MCS_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Falta MCS_KEY_PASSWORD" && exit 1)

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Reconstruir clave privada temporal
        env:
          KEYSTORE_BASE64: ${{ secrets.MCS_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mi-casa-segura-upload.jks"

      - name: Validar proyecto
        run: node scripts/check_android_phase2.mjs

      - name: Generar AAB firmado
        env:
          MCS_KEYSTORE_PATH: ${{ runner.temp }}/mi-casa-segura-upload.jks
          MCS_KEYSTORE_PASSWORD: ${{ secrets.MCS_KEYSTORE_PASSWORD }}
          MCS_KEY_ALIAS: ${{ secrets.MCS_KEY_ALIAS }}
          MCS_KEY_PASSWORD: ${{ secrets.MCS_KEY_PASSWORD }}
        run: gradle -p android --no-daemon clean lintRelease bundleRelease

      - name: Verificar firma del AAB
        run: jarsigner -verify -verbose -certs android/app/build/outputs/bundle/release/app-release.aab

      - name: Guardar AAB firmado
        uses: actions/upload-artifact@v4
        with:
          name: mi-casa-segura-release-signed-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

      - name: Eliminar clave temporal
        if: always()
        run: rm -f "$RUNNER_TEMP/mi-casa-segura-upload.jks"
