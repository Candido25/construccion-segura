name: Temporary live normative 1.9 audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-live-normativa-1-9.yml'

permissions:
  contents: read

jobs:
  verify-live-normative-version:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Wait for and verify Render deployment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live-audit-1-9
          python - <<'PY'
          from __future__ import annotations

          import json
          import time
          import urllib.request
          from collections import Counter
          from pathlib import Path

          BASE = 'https://construccion-segura.onrender.com'

          def fetch(path: str) -> dict:
              request = urllib.request.Request(
                  BASE + path,
                  headers={
                      'User-Agent': 'ConstruccionSegura-live-audit/1.9',
                      'Accept': 'application/json',
                      'Cache-Control': 'no-cache',
                  },
              )
              with urllib.request.urlopen(request, timeout=45) as response:
                  if response.status != 200:
                      raise RuntimeError(f'{path}: HTTP {response.status}')
                  return json.loads(response.read().decode('utf-8'))

          last_state = None
          root = None
          legacy = None
          for attempt in range(1, 25):
              try:
                  root = fetch('/')
                  legacy = fetch('/normativa')
                  version = legacy.get('version')
                  total = legacy.get('total_elementos')
                  questions = root.get('total_preguntas')
                  root_parameters = root.get('total_parametros_normativos')
                  last_state = {
                      'attempt': attempt,
                      'version': version,
                      'total': total,
                      'questions': questions,
                      'root_parameters': root_parameters,
                  }
                  if version == '1.9.0' and total == 748 and questions == 2211 and root_parameters == 748:
                      break
              except Exception as error:  # noqa: BLE001
                  last_state = {'attempt': attempt, 'error': str(error)}
              time.sleep(min(15, 3 + attempt))
          else:
              Path('live-audit-1-9/report.json').write_text(
                  json.dumps({'ultimo_estado': last_state}, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
              )
              raise SystemExit(f'Render no publicó 1.9.0 dentro del tiempo de espera: {last_state}')

          results = legacy.get('resultados', [])
          states = Counter(item.get('estado_revision') for item in results)
          sources = Counter(item.get('fuente', {}).get('tipo') for item in results)

          gas = fetch('/api/v1/normativa/parametros/em040-glp-presion-maxima-despues-regulador')
          communication = fetch('/api/v1/normativa/parametros/em040-comunicacion-ambientes-area-minima')
          shaft = fetch('/api/v1/normativa/parametros/em070-pozo-iluminacion-minima')
          minicarga = fetch('/api/v1/normativa/parametros/em070-minicarga-capacidad-maxima')
          chimney = fetch('/api/v1/normativa/parametros/em060-chimenea-metalica-vivienda-prohibida')
          pilot = fetch('/api/v1/normativa/parametros/e060-escalera-garganta-sin-minimo-universal')

          checks = {
              'version_normativa': legacy.get('version') == '1.9.0',
              'total_parametros': legacy.get('total_elementos') == 748 and len(results) == 748,
              'total_preguntas': root.get('total_preguntas') == 2211,
              'root_parametros': root.get('total_parametros_normativos') == 748,
              'validados_rne': states.get('validado_con_numeral') == 714,
              'fuentes_oficiales': states.get('validado_con_fuente_oficial') == 17,
              'criterios_tecnicos': states.get('criterio_tecnico_revisado') == 16,
              'piloto_unico': states.get('piloto_verificado') == 1,
              'fuente_rne_total': sources.get('RNE') == 715,
              'gas_20_psig': gas.get('valor', {}).get('valor') == 20 and gas.get('fuente', {}).get('norma') == 'EM.040',
              'comunicacion_2_m2': communication.get('valor', {}).get('valor') == 2,
              'pozo_50_lux': shaft.get('valor', {}).get('valor') == 50 and shaft.get('fuente', {}).get('norma') == 'EM.070',
              'minicarga_300_kg': minicarga.get('valor', {}).get('valor') == 300,
              'chimenea_prohibida': chimney.get('clasificacion') == 'prohibicion' and chimney.get('fuente', {}).get('norma') == 'EM.060',
              'piloto_conservado': pilot.get('estado_revision') == 'piloto_verificado',
          }

          report = {
              'intentos_hasta_despliegue': last_state.get('attempt'),
              'version_normativa': legacy.get('version'),
              'total_parametros': legacy.get('total_elementos'),
              'resultados_recibidos': len(results),
              'total_preguntas': root.get('total_preguntas'),
              'estados_editoriales': dict(states),
              'tipos_fuente': dict(sources),
              'gas_presion_psig': gas.get('valor', {}).get('valor'),
              'comunicacion_ambientes_m2': communication.get('valor', {}).get('valor'),
              'pozo_ascensor_lux': shaft.get('valor', {}).get('valor'),
              'minicarga_kg': minicarga.get('valor', {}).get('valor'),
              'chimenea_clasificacion': chimney.get('clasificacion'),
              'comprobaciones': checks,
          }
          Path('live-audit-1-9/report.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          Path('live-audit-1-9/report.txt').write_text(
              '\n'.join([
                  f"intentos_hasta_despliegue={last_state.get('attempt')}",
                  f"version_normativa={legacy.get('version')}",
                  f"total_parametros={legacy.get('total_elementos')}",
                  f"resultados_recibidos={len(results)}",
                  f"total_preguntas={root.get('total_preguntas')}",
                  f"validado_con_numeral={states.get('validado_con_numeral')}",
                  f"validado_con_fuente_oficial={states.get('validado_con_fuente_oficial')}",
                  f"criterio_tecnico_revisado={states.get('criterio_tecnico_revisado')}",
                  f"piloto_verificado={states.get('piloto_verificado')}",
                  f"gas_presion_psig={gas.get('valor', {}).get('valor')}",
                  f"comunicacion_ambientes_m2={communication.get('valor', {}).get('valor')}",
                  f"pozo_ascensor_lux={shaft.get('valor', {}).get('valor')}",
                  f"minicarga_kg={minicarga.get('valor', {}).get('valor')}",
                  f"chimenea_clasificacion={chimney.get('clasificacion')}",
                  f"comprobaciones_correctas={sum(checks.values())}/{len(checks)}",
              ]) + '\n',
              encoding='utf-8',
          )
          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              raise SystemExit('Comprobaciones fallidas: ' + ', '.join(failed))
          PY

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-normativa-1-9-audit
          path: live-audit-1-9
          retention-days: 1
