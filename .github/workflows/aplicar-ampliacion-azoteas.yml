name: Aplicar ampliación de azoteas

on:
  push:
    branches:
      - agent/ampliar-azoteas-drenaje-estacionamientos-20260727
    paths:
      - scripts/aplicar_ampliacion_azoteas.py
      - scripts/data_azoteas/**
      - .github/workflows/aplicar-ampliacion-azoteas.yml

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Aplicar inventario normativo
        run: python scripts/aplicar_ampliacion_azoteas.py

      - name: Validar base y API
        run: python scripts/check_normativa.py

      - name: Confirmar archivos generados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/normativa_tecnica.json backend/preguntas_tecnicas.json scripts/check_normativa.py docs/VALIDACION_AZOTEAS_DRENAJE_ESTACIONAMIENTOS_2026-07-27.md
          git diff --cached --quiet || git commit -m "Ampliar azoteas, drenaje y estacionamientos"
          git push
