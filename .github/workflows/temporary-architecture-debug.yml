name: Temporary architecture debug

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-migration:
    if: github.head_ref == 'agent/arquitectura-raiz-estatica-20260726' || github.ref_name == 'agent/arquitectura-raiz-estatica-20260726'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/arquitectura-raiz-estatica-20260726
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reproduce migration in workspace
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/temporary-architecture-migration.yml').read_text(encoding='utf-8')
          marker = '      - name: Migrate institutional site to repository root\n'
          start = text.index(marker)
          run_marker = '        run: |\n'
          block_start = text.index(run_marker, start) + len(run_marker)
          end = text.index('      - name: Install validators\n', block_start)
          lines = text[block_start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/reproduce-migration.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/reproduce-migration.sh

      - name: Install validators
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 tinycss2==1.4.0

      - name: Produce detailed validation report
        shell: bash
        run: |
          set +e
          report=migration-validation.txt
          : > "$report"
          final=0
          run_check() {
            name="$1"
            shift
            echo "=== $name ===" | tee -a "$report"
            "$@" >> "$report" 2>&1
            status=$?
            echo "status=$status" | tee -a "$report"
            echo >> "$report"
            if [ "$status" -ne 0 ]; then final=1; fi
          }
          run_check prepare python scripts/prepare_frontend.py
          run_check assets python scripts/run_frontend_validator.py check_assets
          run_check resources python scripts/run_frontend_validator.py check_resources
          run_check site python scripts/run_frontend_validator.py check_site
          run_check backend python -m py_compile backend/api.py
          echo "=== JavaScript ===" >> "$report"
          while IFS= read -r -d '' file; do
            node --check "$file" >> "$report" 2>&1 || final=1
          done < <(find public -type f -name '*.js' -print0)
          echo "final=$final" | tee -a "$report"
          printf '%s\n' "$final" > migration-validation.status
          tail -n 120 "$report"
          exit 0

      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: migration-validation-debug
          path: |
            migration-validation.txt
            migration-validation.status
          retention-days: 1
