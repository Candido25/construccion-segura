name: Temporary live normative 1.2 audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-live-normativa-1-2.yml'

permissions:
  contents: read

jobs:
  verify-live-normative-version:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify Render normative deployment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          endpoint='https://construccion-segura.onrender.com/api/v1/normativa/parametros?limite=50'
          ready=0
          for attempt in $(seq 1 18); do
            code=$(curl --retry 3 --retry-all-errors --retry-delay 4 --connect-timeout 25 --max-time 180 -sS \
              -H 'Origin: https://www.construccionsegura.org.pe' \
              -o audit/parametros.json -w '%{http_code}' \
              "${endpoint}&audit=${GITHUB_RUN_ID}-${attempt}") || code=000
            echo "attempt=${attempt} http=${code}" | tee -a audit/report.txt
            if [ "$code" = '200' ] && python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('audit/parametros.json').read_text(encoding='utf-8'))
          raise SystemExit(0 if payload.get('version') == '1.2.0' else 1)
          PY
            then
              ready=1
              break
            fi
            sleep 20
          done
          test "$ready" = '1'

          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          payload = json.loads(Path('audit/parametros.json').read_text(encoding='utf-8'))
          items = payload['resultados']
          assert payload['version'] == '1.2.0', payload
          assert payload['total_encontrados'] == 41, payload
          assert payload['mostrados'] == 41, payload
          states = Counter(item['estado_revision'] for item in items)
          assert states['validado_con_numeral'] == 40, states
          assert states['piloto_verificado'] == 1, states
          by_id = {item['id']: item for item in items}
          assert by_id['a020-escalera-caracol-abanico-huella-minima']['fuente']['numeral'] == '15.1.b'
          assert by_id['e050-relleno-controlado-finos-hasta-12-compactacion-minima']['valor']['valor'] == 95
          assert by_id['e060-losa-escalera-voladizo-referencia-espesor']['valor']['formula'] == 'h ≥ L/10'
          report = Path('audit/report.txt')
          with report.open('a', encoding='utf-8') as stream:
              stream.write(f"version={payload['version']}\n")
              stream.write(f"total={payload['total_encontrados']}\n")
              stream.write(f"validado_con_numeral={states['validado_con_numeral']}\n")
              stream.write(f"piloto_verificado={states['piloto_verificado']}\n")
              stream.write('caracol_numeral=15.1.b\n')
              stream.write('compactacion_finos_hasta_12=95%\n')
              stream.write('voladizo_formula=h ≥ L/10\n')
          print(report.read_text(encoding='utf-8'))
          PY

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-normativa-1-2-audit
          path: audit/
          if-no-files-found: warn
          retention-days: 1
