name: Temporary robust fix apply workflow batch 4

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-fix-apply-lote-4-v2.yml'

permissions:
  contents: write

jobs:
  fix-workflow:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Patch and push with retry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/tmp-apply-normativa-lote-4.yml')
          text = path.read_text(encoding='utf-8')
          old = '-r backend/requirements.txt'
          new = '-r requirements.txt'
          if old not in text:
              raise SystemExit('No se encontró la ruta antigua de dependencias.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          grep -nF -- '-r requirements.txt' .github/workflows/tmp-apply-normativa-lote-4.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/tmp-apply-normativa-lote-4.yml
          git commit -m 'Corregir ruta de dependencias del lote 4'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin '${{ github.event.pull_request.head.ref }}'
            if git push origin HEAD:'${{ github.event.pull_request.head.ref }}'; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
