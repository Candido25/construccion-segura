                  ('q1521', '¿Cómo se limita el tamaño máximo de la piedra del concreto?', 'La E.060 exige que el tamaño máximo nominal no supere 1/5 de la menor dimensión del encofrado, 1/3 del espesor de la losa ni 3/4 del espacio libre entre barras. Debe cumplirse la condición más restrictiva.'),
