name: Temporary apply normative block 8

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-aplicar-bloque-8.yml'

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Reconstruct and execute reviewed generator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /mnt/data/bloques89/current /mnt/data/bloques89/block8
          cp backend/normativa_tecnica.json /mnt/data/bloques89/current/
          cp backend/preguntas_tecnicas.json /mnt/data/bloques89/current/
          cp backend/normativa.py /mnt/data/bloques89/current/
          cp scripts/check_normativa.py /mnt/data/bloques89/current/
          cp frontend/app/normative-module.js /mnt/data/bloques89/current/
          cp docs/CONTRATO_NORMATIVA.md /mnt/data/bloques89/current/
          cat .tmp/bloque8.part00 .tmp/bloque8.part01 .tmp/bloque8.part02 .tmp/bloque8.part03 .tmp/bloque8.part04 .tmp/bloque8.part05 \
            | base64 -d | gzip -d > /tmp/build_block8.py
          python /tmp/build_block8.py
          cp /mnt/data/bloques89/block8/normativa_tecnica.json backend/normativa_tecnica.json
          cp /mnt/data/bloques89/block8/preguntas_tecnicas.json backend/preguntas_tecnicas.json
          cp /mnt/data/bloques89/block8/check_normativa.py scripts/check_normativa.py
          cp /mnt/data/bloques89/block8/VALIDACION_NORMATIVA_ACCESIBILIDAD_SEGURIDAD_2026-07-27.md docs/

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q -r requirements.txt

      - name: Validate contract API and package
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_normativa.py
          python -m py_compile backend/api.py backend/normativa.py scripts/check_normativa.py
          node --check frontend/app/normative-module.js
          rm -rf public
          python scripts/prepare_frontend.py
          test -f public/index.html
          test -f public/app/normative-module.js
          test ! -e public/backend
          test ! -e public/scripts
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          data=json.loads(Path('backend/normativa_tecnica.json').read_text(encoding='utf-8'))
          faq=json.loads(Path('backend/preguntas_tecnicas.json').read_text(encoding='utf-8'))
          assert data['version']=='1.8.0'
          assert len(data['parametros'])==697
          assert sum(len(c.get('preguntas',[])) for c in faq['categorias'])==2160
          states=Counter(p['estado_revision'] for p in data['parametros'])
          assert states['validado_con_numeral']==663
          print('version',data['version'])
          print('parameters',len(data['parametros']))
          print('questions',sum(len(c.get('preguntas',[])) for c in faq['categorias']))
          print('states',states)
          PY

      - name: Commit permanent files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/normativa_tecnica.json backend/preguntas_tecnicas.json scripts/check_normativa.py docs/VALIDACION_NORMATIVA_ACCESIBILIDAD_SEGURIDAD_2026-07-27.md
          git diff --cached --quiet && exit 0
          git commit -m 'Ampliar accesibilidad evacuación y protección contra incendios'
          git pull --rebase origin '${{ github.event.pull_request.head.ref }}'
          git push origin HEAD:'${{ github.event.pull_request.head.ref }}'
