name: Temporary diagnose normative batch 4

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-diagnose-normativa-lote-4.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Recreate proposed data
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/tmp-apply-normativa-lote-4.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          exec(compile(textwrap.dedent(workflow[start:end]), 'batch-data.py', 'exec'), {})
          PY
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/check_normativa.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('if len(base.parametros) < 70:', 'if len(base.parametros) < 100:', 1)
          text = text.replace('por lo menos 70 parámetros validados', 'por lo menos 100 parámetros validados', 1)
          text = text.replace('if validados < 69:', 'if validados < 99:', 1)
          text = text.replace('al menos 69 numerales validados', 'al menos 99 numerales validados', 1)
          marker = '    detalle = api.detalle_parametro_normativo(\n        "a010-escalera-contrahuella-maxima"\n    )\n'
          extra = '''    desarrollo = api.detalle_parametro_normativo(\n        "e060-desarrollo-traccion-longitud-minima"\n    )\n    if desarrollo["valor"]["valor"] != 300:\n        raise SystemExit("La longitud mínima de desarrollo a tracción debe ser 300 mm.")\n\n    separacion = api.detalle_parametro_normativo(\n        "e030-separacion-edificios-formula-minima"\n    )\n    if "0.02" not in separacion["valor"]["formula"]:\n        raise SystemExit("La fórmula de separación sísmica no conserva la E.030 2026.")\n\n'''
          text = text.replace(marker, extra + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q -r requirements.txt

      - name: Capture validation output
        shell: bash
        run: |
          mkdir -p diagnose-lote-4
          set +e
          python scripts/check_normativa.py > diagnose-lote-4/check.txt 2>&1
          status=$?
          echo "exit_status=$status" >> diagnose-lote-4/check.txt
          python -m py_compile backend/api.py backend/normativa.py > diagnose-lote-4/compile.txt 2>&1
          echo "compile_status=$?" >> diagnose-lote-4/compile.txt
          python - <<'PY' > diagnose-lote-4/summary.txt 2>&1
          import json
          from pathlib import Path
          data=json.loads(Path('backend/normativa_tecnica.json').read_text(encoding='utf-8'))
          faq=json.loads(Path('backend/preguntas_tecnicas.json').read_text(encoding='utf-8'))
          print('version', data.get('version'))
          print('parameters', len(data.get('parametros', [])))
          print('validated', sum(p.get('estado_revision') == 'validado_con_numeral' for p in data.get('parametros', [])))
          print('pilot', sum(p.get('estado_revision') == 'piloto_verificado' for p in data.get('parametros', [])))
          print('questions', sum(len(c.get('preguntas', [])) for c in faq.get('categorias', [])))
          ids=[p.get('id') for p in data.get('parametros', [])]
          print('duplicate_parameter_ids', len(ids)-len(set(ids)))
          qids=[q.get('id') for c in faq.get('categorias', []) for q in c.get('preguntas', [])]
          print('duplicate_question_ids', len(qids)-len(set(qids)))
          PY
          exit 0

      - name: Upload diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: normative-batch-4-diagnosis
          path: diagnose-lote-4
          retention-days: 2
