name: Temporary export and audit blocks 8 and 9

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-export-auditoria-bloques-8-9.yml'

permissions:
  contents: read

jobs:
  export-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Download official standards
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export/current export/official
          cp backend/normativa_tecnica.json export/current/
          cp backend/preguntas_tecnicas.json export/current/
          cp backend/normativa.py export/current/
          cp scripts/check_normativa.py export/current/
          cp frontend/app/normative-module.js export/current/
          cp docs/CONTRATO_NORMATIVA.md export/current/

          download_pdf() {
            local url="$1"
            local output="$2"
            curl -L --fail --retry 4 --retry-all-errors -A 'Mozilla/5.0 ConstruccionSegura/1.0' "$url" -o "$output"
            pdftotext -layout "$output" "${output%.pdf}.txt"
          }

          download_pdf 'https://cdn.www.gob.pe/uploads/document/file/4175227/46%20A.120%20ACCESIBILIDAD%20UNIVERSAL%20EN%20EDIFICACIONES%20-%20RM%20N%C2%B0%20075-2023-VIVIENDA.pdf?v=1677250657' export/official/A120-2023.pdf
          download_pdf 'https://cdn.www.gob.pe/uploads/document/file/2366635/47%20A.130%20REQUISITOS%20DE%20SEGURIDAD%20DS%20N%C2%B0%20017-2012.pdf?v=1677250657' export/official/A130-vigente.pdf
          download_pdf 'https://cdn.www.gob.pe/uploads/document/file/2366528/35%20A.010%20CONDICIONES%20GENERALES%20DE%20DISE%C3%91O%20-%20RM%20N%C2%B0%20191-2021-VIVIENDA.pdf?v=1636058378' export/official/A010-2021.pdf
          download_pdf 'https://cdn.www.gob.pe/uploads/document/file/10157784/8267220-guia-de-accesibilidad.pdf?v=1781544136' export/official/Guia-viviendas-accesibles-2026.pdf
          download_pdf 'https://cdn.www.gob.pe/uploads/document/file/2366693/65%20EM.040%20INSTALACIONES%20DE%20GAS%20-%20RM%20N%C2%B0%20341-2018-VIVIENDA.pdf?v=1677250657' export/official/EM040-gas.pdf
          download_pdf 'https://cdn.www.gob.pe/uploads/document/file/2366694/66%20EM.050%20INSTALACIONES%20DE%20CLIMATIZACI%C3%93N.pdf?v=1677250657' export/official/EM050-climatizacion.pdf
          download_pdf 'https://cdn.www.gob.pe/uploads/document/file/2366695/67%20EM.060%20CHIMENEAS%20Y%20HOGARES.pdf?v=1677250657' export/official/EM060-chimeneas.pdf
          download_pdf 'https://cdn.www.gob.pe/uploads/document/file/2366715/68%20EM.070%20TRANSPORTE%20MEC%C3%81NICO%20-%20RM%20N%C2%B0%20084-2019-VIVIENDA.pdf?v=1677250657' export/official/EM070-transporte.pdf
          download_pdf 'https://cdn.www.gob.pe/uploads/document/file/2366716/69%20EM.080%20INSTALACIONES%20CON%20ENERG%C3%8DA%20SOLAR%20DS%20N%C2%B0%20010-2009.pdf?v=1677250657' export/official/EM080-solar.pdf

      - name: Build concise indexes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          terms = {
              'A120-2023.txt': ['rampa', 'pendiente', 'pasamano', 'puerta', 'circulacion', 'servicio higienico', 'estacionamiento', 'senalizacion', 'ascensor', 'vivienda'],
              'A130-vigente.txt': ['evacuacion', 'salida', 'puerta', 'escalera', 'extintor', 'detector', 'alarma', 'resistencia al fuego', 'senalizacion', 'iluminacion de emergencia'],
              'A010-2021.txt': ['evacuacion', 'puerta', 'pasaje', 'escalera', 'baranda', 'seguridad'],
              'Guia-viviendas-accesibles-2026.txt': ['vivienda', 'dormitorio', 'bano', 'cocina', 'circulacion', 'giro', 'alcance'],
              'EM040-gas.txt': ['ventilacion', 'cilindro', 'tuberia', 'valvula', 'medidor', 'artefacto', 'prueba', 'distancia'],
              'EM050-climatizacion.txt': ['equipo', 'ducto', 'condensado', 'ventilacion', 'mantenimiento'],
              'EM060-chimeneas.txt': ['chimenea', 'hogar', 'conducto', 'distancia', 'combustible', 'ventilacion'],
              'EM070-transporte.txt': ['ascensor', 'plataforma', 'elevador', 'puerta', 'capacidad', 'mantenimiento'],
              'EM080-solar.txt': ['colector', 'tanque', 'tuberia', 'aislamiento', 'valvula', 'estructura', 'mantenimiento'],
          }
          out = ['# Índice de auditoría de bloques 8 y 9', '']
          base = Path('export/official')
          for filename, words in terms.items():
              path = base / filename
              text = path.read_text(encoding='utf-8', errors='ignore').splitlines()
              out += [f'## {filename}', '']
              normalized = [line.lower() for line in text]
              emitted = 0
              for i, line in enumerate(normalized):
                  if any(word in line for word in words):
                      start = max(0, i-2); end = min(len(text), i+5)
                      block = '\n'.join(text[start:end]).strip()
                      if block:
                          out += ['```text', block[:1800], '```', '']
                          emitted += 1
                      if emitted >= 18:
                          break
          Path('export/index.md').write_text('\n'.join(out), encoding='utf-8')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: bloques-8-9-auditoria
          path: export
          retention-days: 3
