                  'elemento': 'Agregado grueso',
                  'parametro': 'Tamaño máximo respecto al espesor de losa',
                  'clasificacion': 'formula_normativa',
                  'valor': {'tipo': 'formula', 'formula': 'Dmax ≤ h/3', 'texto': 'En losas, el tamaño máximo nominal no debe superar 1/3 de su altura.'},
                  'condiciones': ['h representa el espesor de la losa.', 'También deben cumplirse simultáneamente los límites por encofrado y separación del acero.'],
                  'fuente': e060('3.3.2(b)'),
                  'estado_revision': 'validado_con_numeral',
