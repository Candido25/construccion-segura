name: Temporary apply solar gas transport completion

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-apply-solar-transport-completion.yml'

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Reconstruct and apply filtered legacy expansion
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/legacy-current /tmp/legacy-output /tmp/legacy-source
          git fetch origin agent/gas-energia-equipos-20260727
          for part in 00 01 02 03; do
            git show origin/agent/gas-energia-equipos-20260727:.tmp/bloque9.part${part} >> /tmp/legacy-source/payload.b64
          done
          base64 -d /tmp/legacy-source/payload.b64 | gzip -dc > /tmp/legacy-source/original.py
          cp backend/normativa_tecnica.json /tmp/legacy-current/normativa_tecnica.json
          cp backend/preguntas_tecnicas.json /tmp/legacy-current/preguntas_tecnicas.json
          cp scripts/check_normativa.py /tmp/legacy-current/check_normativa.py

          python - <<'PY'
          from pathlib import Path

          text = Path('/tmp/legacy-source/original.py').read_text(encoding='utf-8')
          text = text.replace("BASE=Path('/mnt/data/bloques89/block8')", "BASE=Path('/tmp/legacy-current')", 1)
          text = text.replace("OUT=Path('/mnt/data/bloques89/block9')", "OUT=Path('/tmp/legacy-output')", 1)
          text = text.replace("norm.get('version')!='1.8.0' or len(norm.get('parametros',[]))!=697", "norm.get('version')!='1.9.0' or len(norm.get('parametros',[]))!=748", 1)
          text = text.replace("!=2160", "!=2211", 1)

          excluded = {
              'em040-ventilacion-productos-combustion-necesaria',
              'em040-ambiente-abierto-muro-porcentaje-minimo',
              'em040-ambiente-abierto-borde-superior',
              'em040-ambiente-abierto-techo-porcentaje-minimo',
              'em040-espacio-confinado-relacion-volumen-potencia',
              'em040-espacio-no-confinado-relacion-volumen-potencia',
              'em040-ambientes-conectados-abertura-integracion',
              'em040-glp-tuberia-despues-regulador-presion-maxima',
              'em040-glp-linea-carga-cubierta-ventilada',
              'em040-glp-tanque-exterior',
              'em040-glp-tanque-nivelado',
              'em040-glp-tanque-sin-techo',
              'em040-glp-tanque-altura-mayor-16m',
              'em040-glp-hermeticidad-todo-tramo',
              'em070-puerta-pozo-interbloqueo',
              'em070-cabina-no-mueve-puerta-abierta',
              'em070-puerta-detecta-obstaculo',
              'em070-tablero-independiente-equipo',
              'em070-pozo-cartel-acceso-autorizado',
              'em070-pozo-fuego-mas-3-pisos',
              'em070-pozo-foso-impermeable',
              'em070-pozo-sin-instalaciones-ajenas',
              'em070-plataforma-inclinada-desnivel-referencia',
          }
          excluded_literal = repr(excluded)

          old = """existing={p['id'] for p in norm['parametros']}\nids=[s['id'] for s in specs]\nif len(ids)!=len(set(ids)) or existing.intersection(ids): raise SystemExit('IDs duplicados')\nstart=2161\n"""
          new = f"""existing={{p['id'] for p in norm['parametros']}}\nexcluded_ids={excluded_literal}\nall_specs=list(specs)\noverlap_specs=[s for s in all_specs if s['id'] in existing]\nspecs=[s for s in all_specs if s['id'] not in existing and s['id'] not in excluded_ids]\nids=[s['id'] for s in specs]\nif len(ids)!=len(set(ids)): raise SystemExit('IDs duplicados en la ampliación filtrada')\nif len(specs)!=138: raise SystemExit(f'Se esperaban 138 registros y se obtuvieron {{len(specs)}}')\nstart=2212\n"""
          if old not in text:
              raise SystemExit('No se encontró el bloque de deduplicación del generador legado.')
          text = text.replace(old, new, 1)

          replacements = [
              ("norm['version']='1.9.0'", "norm['version']='2.0.0'"),
              ("'if len(base.parametros) < 697:'", "'if len(base.parametros) < 748:'"),
              ("'por lo menos 697 parámetros revisados'", "'por lo menos 748 parámetros revisados'"),
              ("'if validados < 663:'", "'if validados < 714:'"),
              ("'al menos 663 numerales RNE validados'", "'al menos 714 numerales RNE validados'"),
              ("'if base.version != \"1.8.0\":'", "'if base.version != \"1.9.0\":'"),
              ("'La versión normativa esperada es 1.8.0'", "'La versión normativa esperada es 1.9.0'"),
              ("'if len(todas) < 2160:'", "'if len(todas) < 2211:'"),
              ("'El bloque de accesibilidad y seguridad requiere por lo menos 2160 preguntas técnicas.'", "'El bloque de gas y equipos especiales requiere por lo menos 2211 preguntas técnicas.'"),
              ("663+len(specs)", "714+len(specs)"),
              ("Versión normativa: `1.9.0`", "Versión normativa: `2.0.0`"),
          ]
          for old_value, new_value in replacements:
              if old_value not in text:
                  raise SystemExit(f'No se encontró el texto esperado: {old_value}')
              text = text.replace(old_value, new_value)

          Path('/tmp/legacy-source/adapted.py').write_text(text, encoding='utf-8')
          PY

          python /tmp/legacy-source/adapted.py

      - name: Refine existing fire-resistance record and editorial report
        shell: bash
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          norm_path=Path('/tmp/legacy-output/normativa_tecnica.json')
          faq_path=Path('/tmp/legacy-output/preguntas_tecnicas.json')
          norm=json.loads(norm_path.read_text(encoding='utf-8'))
          faq=json.loads(faq_path.read_text(encoding='utf-8'))

          for item in norm['parametros']:
              if item['id']=='em070-pozo-resistencia-fuego':
                  item['elemento']='Pozo de ascensor en edificación de más de tres pisos'
                  item['valor']['texto']='El cerramiento cortafuego del pozo debe resistir por lo menos dos horas en edificaciones de más de tres pisos.'
                  item['condiciones']=['Aplica a edificaciones de más de tres pisos conforme a 6.7(g).', 'Para edificaciones de hasta tres pisos se incorpora el requisito específico de una hora.']
                  item['fuente']['numeral']='6.7(g)'
                  break
          else:
              raise SystemExit('No se encontró el registro existente de resistencia al fuego del pozo.')

          ids=[item['id'] for item in norm['parametros']]
          if norm.get('version')!='2.0.0' or len(ids)!=886 or len(ids)!=len(set(ids)):
              raise SystemExit('La base filtrada no conserva versión, total o unicidad esperados.')
          questions=sum(len(c.get('preguntas',[])) for c in faq.get('categorias',[]))
          if questions!=2349:
              raise SystemExit(f'Se esperaban 2349 preguntas y hay {questions}.')
          states=Counter(item['estado_revision'] for item in norm['parametros'])
          if states['validado_con_numeral']!=852:
              raise SystemExit(f'Se esperaban 852 numerales RNE y hay {states["validado_con_numeral"]}.')
          solar=[item for item in norm['parametros'] if item.get('fuente',{}).get('norma')=='EM.080']
          if len(solar)!=45:
              raise SystemExit(f'Se esperaban 45 parámetros EM.080 y hay {len(solar)}.')

          excluded={
              'em040-ventilacion-productos-combustion-necesaria',
              'em040-glp-tuberia-despues-regulador-presion-maxima',
              'em070-puerta-pozo-interbloqueo',
              'em070-cabina-no-mueve-puerta-abierta',
              'em070-puerta-detecta-obstaculo',
              'em070-pozo-foso-impermeable',
          }
          if excluded.intersection(ids):
              raise SystemExit('Persisten identificadores expresamente retirados por duplicidad.')

          norm_path.write_text(json.dumps(norm,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          doc='''# Validación normativa de energía solar y complementos de gas y transporte — 27 de julio de 2026

## Alcance

Se incorporaron 138 parámetros y 138 preguntas después de recuperar y depurar el trabajo técnico del PR 78:

- 48 reglas adicionales de instalaciones de gas;
- 45 reglas adicionales de transporte mecánico;
- 45 reglas de instalaciones con energía solar.

## Fuentes oficiales

- EM.040 Instalaciones de Gas — RM N.° 341-2018-VIVIENDA.
- EM.070 Transporte Mecánico — RM N.° 084-2019-VIVIENDA.
- EM.080 Instalaciones con Energía Solar — DS N.° 010-2009-VIVIENDA.

## Resultado

- Versión normativa: `2.0.0`.
- Parámetros totales: 886.
- Registros `validado_con_numeral`: 852.
- Registros `validado_con_fuente_oficial`: 17.
- Criterios técnicos revisados: 16.
- Pilotos: 1.
- Preguntas técnicas: 2349.

## Depuración editorial

Se descartaron 23 registros del generador original por repetir conceptos ya incorporados en la versión 1.9.0. También se precisó que la resistencia de dos horas del pozo de ascensor corresponde a edificaciones de más de tres pisos y se añadió el requisito de una hora para edificaciones de hasta tres pisos.

## Criterios de seguridad

- La orientación, inclinación y superficie preliminar de paneles no sustituyen el diseño estructural ni eléctrico.
- Los anclajes solares deben fijarse a elementos resistentes y mantener la impermeabilización de la cubierta.
- La puesta a tierra de los marcos fotovoltaicos no reemplaza un sistema de protección contra rayos.
- Las redes de gas requieren personal competente, pruebas y el proyecto correspondiente.
- Los equipos de transporte mecánico no son soluciones improvisables de autoconstrucción.
'''
          Path('/tmp/legacy-output/VALIDACION_NORMATIVA_SOLAR_COMPLEMENTOS_2026-07-27.md').write_text(doc,encoding='utf-8')
          PY

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q -r requirements.txt

      - name: Stage permanent files and update validator title
        shell: bash
        run: |
          cp /tmp/legacy-output/normativa_tecnica.json backend/normativa_tecnica.json
          cp /tmp/legacy-output/preguntas_tecnicas.json backend/preguntas_tecnicas.json
          cp /tmp/legacy-output/check_normativa.py scripts/check_normativa.py
          cp /tmp/legacy-output/VALIDACION_NORMATIVA_SOLAR_COMPLEMENTOS_2026-07-27.md docs/VALIDACION_NORMATIVA_SOLAR_COMPLEMENTOS_2026-07-27.md
          rm -f docs/VALIDACION_NORMATIVA_GAS_SOLAR_TRANSPORTE_2026-07-27.md

      - name: Validate contract API and package
        shell: bash
        run: |
          python scripts/check_normativa.py
          python -m py_compile backend/api.py backend/normativa.py
          python scripts/prepare_frontend.py
          test -f public/app/normative-module.js
          test -f public/app/normative.css
          test -f public/backend/normativa_tecnica.json
          git status --short
          test -z "$(git status --short public)"

      - name: Commit permanent files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/normativa_tecnica.json backend/preguntas_tecnicas.json scripts/check_normativa.py docs/VALIDACION_NORMATIVA_SOLAR_COMPLEMENTOS_2026-07-27.md
          git diff --cached --quiet && exit 0
          git commit -m 'Completar normativa de energía solar, gas y transporte'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
