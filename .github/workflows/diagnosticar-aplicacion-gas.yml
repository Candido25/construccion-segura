name: Diagnosticar aplicación de gas

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/diagnosticar-aplicacion-gas.yml

permissions:
  contents: write

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ampliar-instalaciones-gas-20260727
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: |
          set +e
          python scripts/aplicar_ampliacion_gas.py > docs/RESULTADO_GAS.txt 2>&1
          echo "ESTADO=$?" >> docs/RESULTADO_GAS.txt
          exit 0
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/RESULTADO_GAS.txt
          git diff --cached --quiet || git commit -m "Registrar diagnóstico de gas"
          git push origin HEAD:agent/ampliar-instalaciones-gas-20260727
