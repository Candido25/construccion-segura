name: Temporary diagnose solar transport completion

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-diagnose-solar-completion.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/ampliar-normativa-cubiertas-energia-20260727
          fetch-depth: 0

      - name: Recreate scripts and capture each stage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/legacy-current /tmp/legacy-output /tmp/legacy-source diagnosis-solar
          git fetch origin agent/gas-energia-equipos-20260727
          for part in 00 01 02 03; do
            git show origin/agent/gas-energia-equipos-20260727:.tmp/bloque9.part${part} >> /tmp/legacy-source/payload.b64
          done
          base64 -d /tmp/legacy-source/payload.b64 | gzip -dc > /tmp/legacy-source/original.py
          cp backend/normativa_tecnica.json /tmp/legacy-current/normativa_tecnica.json
          cp backend/preguntas_tecnicas.json /tmp/legacy-current/preguntas_tecnicas.json
          cp scripts/check_normativa.py /tmp/legacy-current/check_normativa.py

          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap
          workflow=Path('.github/workflows/tmp-apply-solar-transport-completion.yml').read_text(encoding='utf-8')
          blocks=re.findall(r"          python - <<'PY'\n(.*?)\n          PY", workflow, flags=re.S)
          print('blocks',len(blocks))
          if len(blocks)!=2: raise SystemExit('Cantidad inesperada de bloques Python.')
          Path('/tmp/legacy-source/adapt.py').write_text(textwrap.dedent(blocks[0]),encoding='utf-8')
          Path('/tmp/legacy-source/refine.py').write_text(textwrap.dedent(blocks[1]),encoding='utf-8')
          PY

          set +e
          python /tmp/legacy-source/adapt.py > diagnosis-solar/01-adapt.log 2>&1
          echo $? > diagnosis-solar/01-adapt.status
          test -f /tmp/legacy-source/adapted.py
          python /tmp/legacy-source/adapted.py > diagnosis-solar/02-generate.log 2>&1
          echo $? > diagnosis-solar/02-generate.status
          if test -f /tmp/legacy-output/normativa_tecnica.json; then
            python /tmp/legacy-source/refine.py > diagnosis-solar/03-refine.log 2>&1
            echo $? > diagnosis-solar/03-refine.status
          else
            echo 'output not generated' > diagnosis-solar/03-refine.log
            echo 99 > diagnosis-solar/03-refine.status
          fi
          set -e

          python - <<'PY' > diagnosis-solar/04-summary.log 2>&1
          import json
          from collections import Counter
          from pathlib import Path
          out=Path('/tmp/legacy-output')
          for filename in ['normativa_tecnica.json','preguntas_tecnicas.json','check_normativa.py','VALIDACION_NORMATIVA_SOLAR_COMPLEMENTOS_2026-07-27.md']:
              path=out/filename
              print(filename,'exists',path.exists(),'bytes',path.stat().st_size if path.exists() else 0)
          if (out/'normativa_tecnica.json').exists():
              norm=json.loads((out/'normativa_tecnica.json').read_text(encoding='utf-8'))
              print('version',norm.get('version'))
              print('parameters',len(norm.get('parametros',[])))
              print('states',Counter(x.get('estado_revision') for x in norm.get('parametros',[])))
              print('norms',Counter(x.get('fuente',{}).get('norma') for x in norm.get('parametros',[])))
          if (out/'preguntas_tecnicas.json').exists():
              faq=json.loads((out/'preguntas_tecnicas.json').read_text(encoding='utf-8'))
              print('questions',sum(len(c.get('preguntas',[])) for c in faq.get('categorias',[])))
          PY

      - name: Upload diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solar-transport-completion-diagnosis
          path: diagnosis-solar
          retention-days: 2
