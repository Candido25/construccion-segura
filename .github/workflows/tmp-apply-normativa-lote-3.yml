                  ('q1524', '¿Cuál es la separación libre mínima entre barras longitudinales de una columna?', 'En elementos a compresión con estribos o espiral, la E.060 exige por lo menos 1.5 veces el diámetro de la barra y nunca menos de 40 mm.'),
                  ('q1525', '¿Cuánto recubrimiento necesita el acero cuando el concreto se vacía contra tierra?', 'La E.060 establece 70 mm para concreto colocado contra el suelo y permanentemente expuesto a él. El acero debe mantenerse separado de la tierra mediante elementos adecuados.'),
                  ('q1526', '¿Cuál es el recubrimiento mínimo interior en losas, muros y viguetas?', 'Para concreto no expuesto a la intemperie ni al suelo y barras de 1 3/8 pulg. o menores, la E.060 establece 20 mm. Condiciones severas pueden exigir más.'),
                  ('q1527', '¿Cuál es el recubrimiento mínimo interior en vigas y columnas?', 'Para concreto no expuesto a la intemperie ni en contacto con el suelo, la E.060 establece 40 mm para la armadura principal, estribos y espirales.'),
