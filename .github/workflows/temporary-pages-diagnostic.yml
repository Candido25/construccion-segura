name: Temporary Pages diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read
  pages: read
  deployments: read

jobs:
  inspect-pages:
    if: github.head_ref == 'audit/pages-deploy-20260726'
    runs-on: ubuntu-latest
    steps:
      - name: Inspect workflow, Pages and production status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p pages-audit
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          headers=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          curl -sS "${headers[@]}" "${api}/actions/workflows/static.yml/runs?branch=main&per_page=10" > pages-audit/workflow-runs.json
          curl -sS -D pages-audit/pages.headers "${headers[@]}" "${api}/pages" > pages-audit/pages.json
          curl -sS "${headers[@]}" "${api}/deployments?environment=github-pages&per_page=10" > pages-audit/deployments.json

          curl -sS -D pages-audit/home.headers -o pages-audit/home.body -w '%{http_code} %{time_total} %{url_effective}\n' \
            -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
            https://www.construccionsegura.org.pe/ > pages-audit/home.metrics || true

          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('pages-audit')
          lines = []

          try:
              runs = json.loads((root / 'workflow-runs.json').read_text())
          except Exception as exc:
              lines.append(f'workflow_runs_error={exc}')
              runs = {}
          for run in runs.get('workflow_runs', [])[:10]:
              lines.append(
                  'workflow_run=' + '|'.join([
                      str(run.get('id')),
                      str(run.get('status')),
                      str(run.get('conclusion')),
                      str(run.get('head_sha')),
                      str(run.get('created_at')),
                      str(run.get('updated_at')),
                      str(run.get('html_url')),
                  ])
              )

          try:
              pages = json.loads((root / 'pages.json').read_text())
          except Exception as exc:
              lines.append(f'pages_error={exc}')
              pages = {}
          for key in ('status', 'html_url', 'cname', 'build_type'):
              lines.append(f'pages_{key}={pages.get(key)}')
          source = pages.get('source') or {}
          lines.append(f'pages_source={source.get("branch")}:{source.get("path")}')

          try:
              deployments = json.loads((root / 'deployments.json').read_text())
          except Exception as exc:
              lines.append(f'deployments_error={exc}')
              deployments = []
          for deployment in deployments[:10] if isinstance(deployments, list) else []:
              lines.append(
                  'deployment=' + '|'.join([
                      str(deployment.get('id')),
                      str(deployment.get('sha')),
                      str(deployment.get('created_at')),
                      str(deployment.get('statuses_url')),
                  ])
              )

          lines.append('home=' + (root / 'home.metrics').read_text().strip())
          body = (root / 'home.body').read_text(errors='replace')
          lines.append(f'home_has_current_identity={"Ing. Omar Oswaldo Alcantara Aquino" in body}')
          lines.append(f'home_body_length={len(body)}')
          report = '\n'.join(lines) + '\n'
          (root / 'report.txt').write_text(report)
          print(report)
          PY

      - name: Upload Pages diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: pages-deployment-diagnostic
          path: pages-audit/
          retention-days: 1
