name: Temporary apply normative batch 4 v2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-apply-normativa-lote-4-v2.yml'

permissions:
  contents: write

jobs:
  apply-normative-batch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Execute reviewed batch data script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/tmp-apply-normativa-lote-4.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'normative-batch-4-data.py', 'exec'), {})
          PY

      - name: Update normative validation thresholds
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/check_normativa.py')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('if len(base.parametros) < 70:', 'if len(base.parametros) < 100:'),
              ('por lo menos 70 parámetros validados', 'por lo menos 100 parámetros validados'),
              ('if validados < 69:', 'if validados < 99:'),
              ('al menos 69 numerales validados', 'al menos 99 numerales validados'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'No se encontró el umbral esperado: {old}')
              text = text.replace(old, new, 1)
          marker = '    detalle = api.detalle_parametro_normativo(\n        "a010-escalera-contrahuella-maxima"\n    )\n'
          if marker not in text:
              raise SystemExit('No se encontró el punto de inserción del validador.')
          extra = '''    desarrollo = api.detalle_parametro_normativo(\n        "e060-desarrollo-traccion-longitud-minima"\n    )\n    if desarrollo["valor"]["valor"] != 300:\n        raise SystemExit("La longitud mínima de desarrollo a tracción debe ser 300 mm.")\n\n    separacion = api.detalle_parametro_normativo(\n        "e030-separacion-edificios-formula-minima"\n    )\n    if "0.02" not in separacion["valor"]["formula"]:\n        raise SystemExit("La fórmula de separación sísmica no conserva la E.030 2026.")\n\n'''
          text = text.replace(marker, extra + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Document batch 4
        shell: bash
        run: |
          cat > docs/VALIDACION_NORMATIVA_LOTE_4_2026-07-27.md <<'EOF'
          # Validación normativa - lote 4 - 27 de julio de 2026

          Se incorporaron 30 parámetros y 30 preguntas sobre desarrollo y empalme del acero, integridad de vigas, losas nervadas, refuerzo por retracción, deflexiones, diafragmas y separación sísmica.

          Fuentes revisadas:

          - E.060 Concreto Armado, DS N.° 010-2009-VIVIENDA.
          - E.030 Diseño Sismorresistente 2026, RM N.° 183-2026-VIVIENDA.
          - RM N.° 217-2026-VIVIENDA, disposición transitoria de la E.030 2026.

          Resultado:

          - versión normativa `1.4.0`;
          - 100 parámetros;
          - 99 registros validados con numeral;
          - un registro piloto;
          - 1569 preguntas técnicas.

          Criterios editoriales:

          - Los mínimos de desarrollo de 300 mm y 200 mm son límites inferiores y no sustituyen el cálculo.
          - Los empalmes Clase A y B se expresan en función de `ld`.
          - Los detalles de vigas del artículo 21.4 conservan expresamente su condición de aplicación.
          - La separación sísmica usa la E.030 2026; 30 mm es solo el límite inferior.
          - La condición de diafragma rígido requiere verificar rigidez, resistencia y conexión.
          EOF

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -q -r requirements.txt

      - name: Validate expanded base
        run: |
          python scripts/check_normativa.py
          python -m py_compile backend/api.py backend/normativa.py

      - name: Commit expanded base
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/normativa_tecnica.json backend/preguntas_tecnicas.json scripts/check_normativa.py docs/VALIDACION_NORMATIVA_LOTE_4_2026-07-27.md
          git diff --cached --quiet && exit 0
          git commit -m 'Ampliar normativa de vigas, losas y sismo'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
