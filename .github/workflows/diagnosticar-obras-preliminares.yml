name: Finalizar ampliación de obras preliminares

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/diagnosticar-obras-preliminares.yml

permissions:
  contents: write

jobs:
  finalizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          ref: agent/ampliar-obras-preliminares-seguridad-20260727

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Limpiar archivos temporales y validar
        run: |
          rm -f scripts/aplicar_ampliacion_obras_preliminares.py
          rm -f scripts/diagnosticar_obras_preliminares.py
          rm -rf scripts/data_obras_preliminares
          rm -f docs/DIAGNOSTICO_OBRAS_PRELIMINARES_2026-07-27.md
          rm -f docs/RESULTADO_APLICACION_OBRAS_PRELIMINARES.txt
          rm -f docs/HUELLAS_OBRAS_PRELIMINARES.txt
          rm -f .github/workflows/diagnosticar-obras-preliminares.yml
          python scripts/check_normativa.py

      - name: Confirmar resultado definitivo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalizar obras preliminares y seguridad"
          git push origin HEAD:agent/ampliar-obras-preliminares-seguridad-20260727
