name: Temporary live normative 1.5 audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-live-normativa-1-5.yml'

permissions:
  contents: read

jobs:
  verify-live-normative-version:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for and verify Render deployment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live-audit-1-5
          python - <<'PY'
          from __future__ import annotations

          import json
          import time
          import urllib.request
          from pathlib import Path

          BASE = 'https://construccion-segura.onrender.com'

          def fetch(path: str) -> dict:
              request = urllib.request.Request(
                  BASE + path,
                  headers={
                      'User-Agent': 'ConstruccionSegura-live-audit/1.5',
                      'Accept': 'application/json',
                      'Cache-Control': 'no-cache',
                  },
              )
              with urllib.request.urlopen(request, timeout=50) as response:
                  if response.status != 200:
                      raise RuntimeError(f'{path}: HTTP {response.status}')
                  return json.loads(response.read().decode('utf-8'))

          listing = None
          root = None
          last_state = None
          for attempt in range(1, 28):
              try:
                  root = fetch('/')
                  listing = fetch('/api/v1/normativa/parametros?limite=100')
                  version = listing.get('version')
                  total = listing.get('total_encontrados')
                  questions = root.get('total_preguntas')
                  root_parameters = root.get('total_parametros_normativos')
                  last_state = {
                      'attempt': attempt,
                      'version': version,
                      'total': total,
                      'questions': questions,
                      'root_parameters': root_parameters,
                  }
                  if version == '1.5.0' and total == 192 and questions == 1661 and root_parameters == 192:
                      break
              except Exception as error:  # noqa: BLE001
                  last_state = {'attempt': attempt, 'error': str(error)}
              time.sleep(min(15, 3 + attempt))
          else:
              Path('live-audit-1-5/report.json').write_text(
                  json.dumps({'ultimo_estado': last_state}, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
              )
              raise SystemExit(f'Render no publicó 1.5.0 dentro del tiempo de espera: {last_state}')

          ids = {
              'mezclado': 'e060-mezclado-tiempo-minimo',
              'tuberias_columna': 'e060-columna-tuberias-area-maxima',
              'testigos': 'e060-testigos-criterio-aceptacion',
              'unidad_concreto': 'e070-unidad-concreto-edad-minima',
              'instalacion_seca': 'e070-instalacion-seca-diametro-maximo',
              'plan_seguridad': 'g050-plan-seguridad-obligatorio',
              'anclaje_caidas': 'g050-caida-anclaje-resistencia-minima',
              'andamio': 'g050-andamio-inspeccion-diaria',
              'calidad': 'ge030-expediente-final-etapa',
              'piloto': 'e060-escalera-garganta-sin-minimo-universal',
          }
          details = {
              name: fetch(f'/api/v1/normativa/parametros/{parameter_id}')
              for name, parameter_id in ids.items()
          }

          results = listing.get('resultados', [])
          checks = {
              'version': listing.get('version') == '1.5.0',
              'total_parametros': listing.get('total_encontrados') == 192,
              'muestra_100': listing.get('mostrados') == 100 and len(results) == 100,
              'preguntas': root.get('total_preguntas') == 1661,
              'root_parametros': root.get('total_parametros_normativos') == 192,
              'mezclado_90_s': details['mezclado'].get('valor', {}).get('valor') == 90,
              'tuberias_columna_4_pct': details['tuberias_columna'].get('valor', {}).get('valor') == 4,
              'testigos_85_75': '85%' in details['testigos'].get('valor', {}).get('texto', '') and '75%' in details['testigos'].get('valor', {}).get('texto', ''),
              'bloque_28_dias': details['unidad_concreto'].get('valor', {}).get('valor') == 28,
              'tubo_seco_55_mm': details['instalacion_seca'].get('valor', {}).get('valor') == 55,
              'psst_obligatorio': details['plan_seguridad'].get('clasificacion') == 'condicion_normativa',
              'anclaje_2265_kgf': details['anclaje_caidas'].get('valor', {}).get('valor') == 2265,
              'andamio_inspeccion': 'diariamente' in details['andamio'].get('valor', {}).get('texto', '').lower(),
              'expediente_calidad': details['calidad'].get('fuente', {}).get('norma') == 'GE.030',
              'piloto_conservado': details['piloto'].get('estado_revision') == 'piloto_verificado',
          }

          report = {
              'intentos_hasta_despliegue': last_state.get('attempt'),
              'version_normativa': listing.get('version'),
              'total_parametros': listing.get('total_encontrados'),
              'mostrados_en_listado': listing.get('mostrados'),
              'total_preguntas': root.get('total_preguntas'),
              'muestras': details,
              'comprobaciones': checks,
          }
          Path('live-audit-1-5/report.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          Path('live-audit-1-5/report.txt').write_text(
              '\n'.join([
                  f"intentos_hasta_despliegue={last_state.get('attempt')}",
                  f"version_normativa={listing.get('version')}",
                  f"total_parametros={listing.get('total_encontrados')}",
                  f"mostrados_en_listado={listing.get('mostrados')}",
                  f"total_preguntas={root.get('total_preguntas')}",
                  f"mezclado_minimo_segundos={details['mezclado'].get('valor', {}).get('valor')}",
                  f"tuberias_columna_porcentaje={details['tuberias_columna'].get('valor', {}).get('valor')}",
                  f"unidad_concreto_edad_dias={details['unidad_concreto'].get('valor', {}).get('valor')}",
                  f"instalacion_seca_diametro_mm={details['instalacion_seca'].get('valor', {}).get('valor')}",
                  f"anclaje_caidas_kgf={details['anclaje_caidas'].get('valor', {}).get('valor')}",
                  f"piloto_estado={details['piloto'].get('estado_revision')}",
                  f"comprobaciones_correctas={sum(checks.values())}/{len(checks)}",
              ]) + '\n',
              encoding='utf-8',
          )
          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              raise SystemExit('Comprobaciones fallidas: ' + ', '.join(failed))
          PY

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-normativa-1-5-audit
          path: live-audit-1-5
          retention-days: 1
