name: Temporary apply gas and special equipment

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-apply-gas-equipos-especiales.yml'

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply reviewed expansion
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path

          root=Path('.')
          norm_path=root/'backend/normativa_tecnica.json'
          faq_path=root/'backend/preguntas_tecnicas.json'
          norm=json.loads(norm_path.read_text(encoding='utf-8'))
          faq=json.loads(faq_path.read_text(encoding='utf-8'))
          if norm.get('version')!='1.8.0' or len(norm.get('parametros',[]))!=697:
              raise SystemExit('La base cambió desde la auditoría del bloque especial.')
          total_q=sum(len(c.get('preguntas',[])) for c in faq.get('categorias',[]))
          if total_q!=2160:
              raise SystemExit(f'Se esperaban 2160 preguntas y hay {total_q}.')

          date='2026-07-27'
          rne_url='https://www.gob.pe/institucion/vivienda/informes-publicaciones/2309793-reglamento-nacional-de-edificaciones-rne'
          em040_url='https://www.gob.pe/institucion/vivienda/normas-legales/211654-341-2018-vivienda'

          def src(code,title,device,numeral,url=rne_url):
              return {'tipo':'RNE','norma':code,'denominacion':title,'dispositivo':device,'numeral':numeral,'numeral_confirmado':True,'url_oficial':url}
          def val_text(text): return {'tipo':'texto','texto':text}
          def val_num(value,unit,text): return {'tipo':'numero','valor':value,'unidad':unit,'texto':text}
          def val_formula(formula,text): return {'tipo':'formula','formula':formula,'texto':text}
          def add(pid,cat,elem,param,classification,value,conditions,source,warning,qid):
              return {'id':pid,'categoria':cat,'elemento':elem,'parametro':param,'clasificacion':classification,'valor':value,'condiciones':conditions,'fuente':source,'estado_revision':'validado_con_numeral','advertencia':warning,'faq_relacionadas':[qid],'fecha_revision':date}

          specs=[]
          questions=[]
          def push(pid,cat,elem,param,classification,value,conditions,source,warning,question,answer):
              qid=f'q{2161+len(specs)}'
              specs.append(add(pid,cat,elem,param,classification,value,conditions,source,warning,qid))
              questions.append({'id':qid,'pregunta':question,'respuesta':answer})

          gas='Instalaciones de gas'
          gas_src=lambda n: src('EM.040','Instalaciones de Gas','RM N.° 341-2018-VIVIENDA',n,em040_url)
          push('em040-ventilacion-evacuacion-obligatoria',gas,'Ambiente con artefactos a gas','Ventilación y evacuación de combustión','condicion_normativa',val_text('El funcionamiento seguro exige ventilación conveniente del ambiente y evacuación apropiada de los productos de combustión.'),['Aplica a instalaciones internas de gas natural y GLP.','La solución depende del tipo de artefacto y del ambiente.'],gas_src('2.1'),'No instales un artefacto a gas en un ambiente cerrado sin resolver aire de combustión y salida de gases.','¿Una cocina o calentador a gas necesita ventilación y salida de gases?','Sí. La EM.040 exige ventilación conveniente y evacuación apropiada de los productos de combustión según el artefacto y el ambiente.')
          push('em040-ambiente-abierto-muro-porcentaje',gas,'Ambiente abierto hacia el exterior','Área de vano permanente en muro','formula_normativa',val_formula('A_vano ≥ 0.40 A_muros_exteriores','El vano permanente en muro debe ocupar al menos 40% de los muros o paredes que dan al exterior.'),['El vano debe permanecer libre.','Además debe cumplir el mínimo absoluto de 2 m².'],gas_src('3.7.a'),'Una ventana pequeña que puede cerrarse no convierte al ambiente en abierto hacia el exterior.','¿Qué porcentaje del muro debe quedar abierto para considerar un ambiente abierto al exterior?','La EM.040 exige un vano permanentemente libre de por lo menos 40% de los muros que dan al exterior y además no menor de 2 m².')
          push('em040-ambiente-abierto-muro-area-minima',gas,'Ambiente abierto hacia el exterior','Área mínima absoluta del vano en muro','minimo_normativo',val_num(2,'m²','El vano permanentemente libre en muros no debe ser menor de 2 m².'),['Se cumple además el 40% del área de muros exteriores.'],gas_src('3.7.a'),'Deben cumplirse simultáneamente el porcentaje y el área mínima.','¿Cuál es el área mínima del vano permanente en un muro para un ambiente abierto al exterior?','No debe ser menor de 2 m² y también debe representar al menos 40% de los muros que dan al exterior.')
          push('em040-ambiente-abierto-vano-distancia-techo',gas,'Ambiente abierto hacia el exterior','Distancia del borde superior del vano al techo','maximo_normativo',val_num(0.5,'m','El borde superior del vano debe quedar a no más de 0.50 m del techo.'),['Aplica al vano permanente ubicado en muro.'],gas_src('3.7.a'),'Un vano muy bajo puede no evacuar adecuadamente gases calientes.','¿A qué distancia máxima del techo debe quedar el vano permanente de ventilación?','La EM.040 fija como máximo 0.50 m entre el borde superior del vano y el techo.')
          push('em040-ambiente-abierto-techo-porcentaje',gas,'Ambiente abierto hacia el exterior','Área de abertura permanente en techo','formula_normativa',val_formula('A_vano ≥ 0.40 A_techo','La abertura permanente en techo debe ocupar al menos 40% de la superficie superior.'),['La abertura debe permanecer libre.','Además debe cumplir el mínimo absoluto de 2 m².'],gas_src('3.7.b'),'Una claraboya cerrable no equivale a una abertura permanente.','¿Qué porcentaje del techo debe quedar abierto para considerar el ambiente abierto?','La abertura permanentemente libre debe ocupar por lo menos 40% del techo y no ser menor de 2 m².')
          push('em040-ambiente-abierto-techo-area-minima',gas,'Ambiente abierto hacia el exterior','Área mínima absoluta de abertura en techo','minimo_normativo',val_num(2,'m²','La abertura permanente en techo no debe ser menor de 2 m².'),['Se cumple además el 40% de la superficie superior.'],gas_src('3.7.b'),'El mínimo de 2 m² no reemplaza el requisito porcentual.','¿Cuál es el área mínima de una abertura permanente en el techo?','La EM.040 exige por lo menos 2 m² y, simultáneamente, 40% de la superficie superior.')
          push('em040-espacio-confinado-umbral',gas,'Ambiente con artefactos a gas','Umbral de espacio confinado','formula_normativa',val_formula('V < 4.8 m³/kW','Es espacio confinado cuando el volumen es menor de 4.8 m³ por kW de potencia nominal agregada.'),['Se suma la potencia de los artefactos instalados, excepto los Tipo C según la norma.'],gas_src('3.22'),'No basta evaluar solo el área del piso; debe relacionarse volumen y potencia.','¿Cuándo un ambiente se considera confinado para instalar artefactos a gas?','Cuando su volumen es menor de 4.8 m³ por cada kW de potencia nominal agregada de los artefactos considerados.')
          push('em040-espacio-no-confinado-umbral',gas,'Ambiente con artefactos a gas','Umbral de espacio no confinado','formula_normativa',val_formula('V ≥ 4.8 m³/kW','Es espacio no confinado cuando el volumen es igual o mayor de 4.8 m³ por kW de potencia nominal agregada.'),['Se aplican las exclusiones y comunicaciones permanentes indicadas por la norma.'],gas_src('3.23'),'Ser no confinado no elimina la obligación de ventilación y evacuación.','¿Cuándo un ambiente se considera no confinado para artefactos a gas?','Cuando tiene 4.8 m³ o más por cada kW de potencia nominal agregada, sin dejar de cumplir ventilación y evacuación.')
          push('em040-comunicacion-ambientes-area-minima',gas,'Ambientes comunicados para cálculo de volumen','Área mínima del vano permanente','minimo_normativo',val_num(2,'m²','El vano permanentemente libre entre ambientes debe tener por lo menos 2 m² para considerarlos como un solo espacio de análisis.'),['El vano debe estar libre de cierre y obstáculos.'],gas_src('3.22-3.23'),'Una puerta que normalmente permanece cerrada no cumple esta definición.','¿Qué abertura mínima permite sumar dos ambientes para evaluar el volumen disponible?','La comunicación permanente debe tener un vano libre de por lo menos 2 m² y sin posibilidad de cierre u obstáculo.')
          push('em040-glp-presion-maxima-despues-regulador',gas,'Tubería de GLP después del regulador de primera etapa','Presión máxima de operación','maximo_normativo',val_num(20,'psig','La presión máxima de operación después del regulador de primera etapa es 20 psig.'),['Aplica a tuberías de GLP posteriores al regulador de alta presión o primera etapa.'],gas_src('5.1'),'La presión y los reguladores deben corresponder al proyecto y a equipos certificados.','¿Cuál es la presión máxima de operación de una tubería de GLP después del primer regulador?','La EM.040 establece un máximo de 20 psig después del regulador de primera etapa.')
          push('em040-glp-punto-transferencia-ubicacion',gas,'Punto de transferencia desplazado de GLP','Ubicación','condicion_normativa',val_text('Debe ubicarse en el muro de la fachada o dentro del retiro reglamentario.'),['Aplica cuando el sistema utiliza punto de transferencia desplazado.'],gas_src('5.3.a'),'No debe ocultarse en ambientes interiores ni quedar inaccesible.','¿Dónde se ubica el punto de transferencia desplazado de GLP?','En el muro de fachada o dentro del retiro reglamentario, según la EM.040.')
          push('em040-glp-linea-carga-exterior',gas,'Línea de carga a tanque estacionario','Recorrido exterior','condicion_normativa',val_text('La línea de carga debe ubicarse completamente en el exterior de la edificación.'),['Incluye la línea de retorno de vapor o compensación cuando corresponda.'],gas_src('5.3.b'),'No lleves la línea de llenado por dormitorios, cocinas, escaleras o ductos interiores.','¿La línea de carga de un tanque de GLP puede pasar por el interior de la vivienda?','No. La EM.040 exige que se ubique completamente en el exterior de la edificación.')
          push('em040-glp-linea-carga-no-empotrada',gas,'Línea de carga a tanque estacionario','Prohibición de empotramiento e ingreso','prohibicion',val_text('La línea puede cubrirse, pero no debe empotrarse en muros ni ingresar al interior de la edificación.'),['Aplica a línea de carga y retorno de vapor o compensación.'],gas_src('5.3.b.i'),'Cubrir no significa encerrar sin inspección o ventilación.','¿Puedo empotrar la tubería de llenado del tanque de GLP en un muro?','No. Puede cubrirse, pero no empotrarse en el muro ni ingresar al interior de la edificación.')
          push('em040-glp-linea-carga-ventilacion',gas,'Cubierta de línea de carga de GLP','Aberturas de ventilación','condicion_normativa',val_text('La cubierta debe contar con aberturas superiores e inferiores para ventilación.'),['Aplica cuando la línea exterior se cubre.'],gas_src('5.3.b.i'),'Una caja hermética puede acumular GLP en caso de fuga.','¿Una tubería exterior de llenado de GLP puede encerrarse en una caja cerrada?','No debe quedar hermética; la cubierta necesita aberturas superiores e inferiores de ventilación.')
          push('em040-glp-tanque-exterior-sin-techo',gas,'Tanque estacionario de GLP','Ubicación general','condicion_normativa',val_text('Debe ubicarse en el exterior, perfectamente nivelado y sin techo.'),['Debe mantener circulación para mantenimiento y distancias de seguridad.'],gas_src('5.3.d'),'No coloques un tanque estacionario en un cuarto cerrado o debajo de una cobertura improvisada.','¿Dónde debe instalarse un tanque estacionario de GLP?','En el exterior del edificio, nivelado y sin techo, con acceso para mantenimiento y distancias de seguridad.')
          push('em040-glp-tanque-perimetro-libre',gas,'Tanque estacionario de GLP','Perímetro lateral libre','minimo_normativo',val_num(50,'% del perímetro','Debe existir espacio lateral libre en por lo menos 50% del perímetro del tanque respecto de su área de influencia.'),['Se conservan además las distancias de seguridad específicas.'],gas_src('5.3.d'),'El espacio libre es necesario para ventilación, inspección y respuesta a emergencias.','¿Qué parte del perímetro de un tanque estacionario de GLP debe quedar libre?','Por lo menos 50% de su perímetro debe tener espacio lateral libre, además de las distancias de seguridad.')
          push('em040-glp-tanque-altura-transferencia-obligatoria',gas,'Tanque estacionario de GLP elevado','Punto de transferencia y línea de llenado','condicion_normativa',val_num(16,'m sobre nivel de vereda','Cuando el tanque se ubica a más de 16 m sobre la vereda, es obligatorio dejar punto de transferencia desplazado y línea de llenado.'),['La altura se mide respecto del nivel de vereda.'],gas_src('5.3.e'),'No pretendas llenar un tanque alto directamente con una manguera desde la calle.','¿Qué exige la EM.040 cuando el tanque de GLP está a más de 16 m de altura?','Exige un punto de transferencia desplazado y una línea de llenado hasta el tanque.')
          push('em040-glp-prueba-hermeticidad-total',gas,'Instalación interna de GLP','Prueba de hermeticidad','condicion_normativa',val_text('La conformidad incluye una prueba de hermeticidad de todo tramo de tubería instalado.'),['Debe seguir los procedimientos de la NTP 321.129 citada por la EM.040.'],gas_src('5.3.i'),'Nunca cubras o habilites una red de GLP sin probarla y documentarla.','¿Debe probarse toda la tubería de GLP antes de usarla?','Sí. La EM.040 exige verificar la conformidad y pasar prueba de hermeticidad a todo tramo instalado.')

          mech='Transporte mecánico y equipos especiales'
          em070=lambda n: src('EM.070','Transporte Mecánico','RM N.° 084-2019-VIVIENDA',n)
          push('em070-puerta-pozo-bloqueo-movimiento',mech,'Puerta de acceso al pozo de ascensor','Bloqueo durante funcionamiento','condicion_normativa',val_text('La puerta del pozo debe estar impedida de abrirse mientras el ascensor funciona, salvo cuando nivela en un piso.'),['El desbloqueo debe realizarse mediante el dispositivo previsto por la norma.'],em070('5.4.a'),'Una puerta de piso sin enclavamiento expone directamente al vacío del pozo.','¿Puede abrirse la puerta del pozo mientras el ascensor está en movimiento?','No. Debe permanecer bloqueada y solo habilitarse cuando el ascensor nivela en el piso correspondiente.')
          push('em070-cabina-no-mover-puerta-abierta',mech,'Cabina de ascensor','Movimiento con puerta abierta','prohibicion',val_text('La cabina no debe moverse cuando su puerta de acceso está abierta, salvo mantenimiento o modo de revisión.'),['La excepción corresponde a operación técnica controlada.'],em070('5.4.b'),'No anules sensores o enclavamientos para hacer funcionar el ascensor.','¿Puede moverse un ascensor con la puerta de cabina abierta?','No, salvo durante mantenimiento o modo de revisión bajo control técnico.')
          push('em070-puerta-sensor-obstaculo',mech,'Puerta automática de ascensor','Reapertura ante obstáculo','condicion_normativa',val_text('Debe contar con dispositivo electrónico que reabra inmediatamente la puerta al encontrar un obstáculo, sin golpearlo bruscamente.'),['Aplica durante el cierre automático.'],em070('5.4.c'),'Una simple banda mecánica deteriorada no sustituye un sistema de detección operativo.','¿Qué debe hacer la puerta del ascensor si detecta una persona u objeto?','Debe reabrirse inmediatamente sin golpear bruscamente al obstáculo.')
          push('em070-cabina-boton-alarma',mech,'Cabina de ascensor','Botón de alarma','condicion_normativa',val_text('La cabina debe tener interruptor o botón de alarma que produzca una señal acústica en caso de emergencia o atrapamiento.'),[],em070('5.5.a'),'El botón debe mantenerse operativo y no quedar oculto o desconectado.','¿Un ascensor necesita botón de alarma dentro de la cabina?','Sí. Debe generar una señal acústica ante emergencia o atrapamiento.')
          push('em070-cabina-ventilacion-mecanica',mech,'Cabina de ascensor','Ventilación mecánica','condicion_normativa',val_text('La cabina debe disponer de ventilación mecánica suficiente.'),[],em070('5.5.b'),'La ventilación es crítica durante una detención prolongada.','¿La cabina del ascensor necesita ventilación?','Sí. La EM.070 exige ventilación mecánica suficiente.')
          push('em070-rieles-soldadura-prohibida',mech,'Rieles guía de ascensor','Uso de soldadura','prohibicion',val_text('No se permite soldadura de ningún tipo para la fijación mecánica o unión de rieles guía.'),['Los empalmes y fijaciones deben seguir el sistema certificado.'],em070('5.7.b'),'Soldar en obra puede alterar alineación, material y certificación del sistema.','¿Se pueden soldar los rieles guía de un ascensor?','No. La EM.070 prohíbe la soldadura para fijarlos o unirlos.')
          push('em070-tablero-independiente-por-equipo',mech,'Instalación eléctrica de ascensor','Tablero independiente','condicion_normativa',val_text('Cada ascensor o equipo de transporte vertical debe contar con tablero eléctrico independiente y normalizado.'),['Debe ubicarse en sala de máquinas o ambiente normalizado.'],em070('5.8.b'),'No alimentes varios equipos desde un tablero improvisado común.','¿Cada ascensor necesita su propio tablero eléctrico?','Sí. La EM.070 exige un tablero independiente y normalizado por cada equipo.')
          push('em070-instalaciones-garantizadas-fabricante',mech,'Instalaciones del equipo de transporte vertical','Responsabilidad del fabricante','condicion_normativa',val_text('Las instalaciones eléctricas y de telecomunicaciones propias del equipo deben ser ejecutadas y garantizadas por el fabricante.'),['No se permiten adiciones no certificadas por el fabricante.'],em070('5.8.e'),'Agregar cámaras, parlantes o cableado sin autorización puede comprometer seguridad y garantía.','¿Puedo agregar cableado o equipos dentro del ascensor por mi cuenta?','No. Las instalaciones propias deben ser ejecutadas y garantizadas por el fabricante; se prohíben adiciones no certificadas.')
          push('em070-cabina-rotulo-carga-pasajeros',mech,'Cabina de ascensor','Información obligatoria del rótulo','condicion_normativa',val_text('El rótulo debe indicar la carga útil y el número de pasajeros.'),['Debe ser visible, legible y durar tanto como el equipo.'],em070('5.10.a-5.10.c'),'No uses el ascensor por encima de la carga indicada.','¿Qué información debe mostrar la placa dentro del ascensor?','Debe indicar claramente la carga útil y el número de pasajeros permitidos.')
          push('em070-accesos-tecnicos-cartel-peligro',mech,'Puertas de inspección y sala de máquinas','Señal de acceso restringido','condicion_normativa',val_text('Deben llevar el cartel: “PELIGRO. ACCESO SOLO A PERSONAL AUTORIZADO”.'),['Aplica a puertas de inspección del pozo, vano de izaje de azotea y sala de máquinas.'],em070('5.10.d'),'Mantén estos accesos cerrados y fuera del alcance de niños y usuarios.','¿Qué señal deben tener las puertas de inspección y sala de máquinas del ascensor?','Deben advertir peligro y acceso exclusivo a personal autorizado.')
          push('em070-pozo-resistencia-fuego',mech,'Pozo de ascensor','Resistencia al fuego del cerramiento','minimo_normativo',val_num(2,'horas','El cerramiento cortafuego del pozo debe tener resistencia no menor de 2 horas en el supuesto regulado.'),['Aplica según la configuración indicada en 6.7.g.'],em070('6.7.g'),'El pozo puede propagar humo y fuego verticalmente si no está compartimentado.','¿Qué resistencia al fuego debe tener el cerramiento del pozo del ascensor?','La EM.070 establece no menos de 2 horas en la configuración regulada por el numeral 6.7.g.')
          push('em070-puerta-pozo-resistencia-relativa',mech,'Puerta de acceso al pozo','Resistencia al fuego relativa','formula_normativa',val_formula('RF_puerta ≥ 0.75 RF_cerramiento','La puerta debe resistir al fuego por lo menos tres cuartas partes del tiempo exigido al cerramiento.'),[],em070('6.7.g'),'Una puerta común puede anular la compartimentación del pozo.','¿La puerta del ascensor debe resistir fuego igual que el pozo?','Debe alcanzar como mínimo tres cuartas partes del tiempo de resistencia del cerramiento.')
          push('em070-pozo-cabinas-sin-muro-maximo',mech,'Pozo agrupado de ascensores','Cabinas contiguas sin muro cortafuego','maximo_normativo',val_num(4,'cabinas','Un pozo puede agrupar hasta 4 cabinas contiguas sin muro cortafuego intermedio.'),[],em070('6.7.h'),'Para más cabinas se requiere separación adicional.','¿Cuántas cabinas pueden compartir un pozo sin muro cortafuego intermedio?','Hasta cuatro cabinas contiguas.')
          push('em070-pozo-mas-cuatro-muro',mech,'Pozo agrupado de ascensores','Muro cortafuego para más de cuatro cabinas','condicion_normativa',val_text('Si el pozo agrupa más de cuatro cabinas, debe incorporarse un muro cortafuego intermedio.'),[],em070('6.7.i'),'No amplíes una batería de ascensores sin revisar la compartimentación.','¿Qué ocurre si un pozo agrupa más de cuatro ascensores?','Debe añadirse un muro cortafuego intermedio.')
          push('em070-foso-proteccion-infiltraciones',mech,'Foso de ascensor','Protección contra agua','condicion_normativa',val_text('El foso debe estar protegido contra infiltraciones de agua.'),['Debe coordinarse drenaje e impermeabilización sin crear riesgos eléctricos.'],em070('6.7.j'),'El agua en el foso daña equipos y crea riesgo eléctrico.','¿El foso del ascensor necesita impermeabilización?','Sí. La EM.070 exige protección contra infiltraciones de agua.')
          push('em070-pozo-elementos-ajenos-prohibidos',mech,'Pozo de ascensor','Instalaciones ajenas','prohibicion',val_text('Dentro del pozo no deben alojarse tuberías, conducciones eléctricas ni elementos extraños al servicio del ascensor.'),[],em070('6.7.l'),'No uses el pozo como ducto común de agua, desagüe, gas o cableado del edificio.','¿Pueden pasar tuberías de agua o gas por el pozo del ascensor?','No. El pozo no puede alojar instalaciones ajenas al servicio del ascensor.')
          push('em070-pozo-iluminacion-minima',mech,'Pozo de ascensor','Iluminación artificial','minimo_normativo',val_num(50,'lux','El pozo debe estar preparado para una iluminación artificial mínima de 50 lux.'),[],em070('6.7.m'),'La iluminación debe permitir inspección y mantenimiento seguros.','¿Cuánta iluminación mínima necesita el pozo del ascensor?','La EM.070 exige por lo menos 50 lux.')
          push('em070-cuarto-maquinas-altura-minima',mech,'Cuarto de máquinas de ascensor','Altura mínima','minimo_normativo',val_num(2,'m','La altura mínima del cuarto de máquinas es 2.00 m.'),['Las demás dimensiones las define el fabricante.'],em070('6.8.f'),'No reduzcas la altura por vigas, ductos o almacenamiento.','¿Cuál es la altura mínima del cuarto de máquinas de un ascensor?','La EM.070 establece 2.00 m como mínimo.')
          push('em070-plataforma-inclinada-desnivel-maximo',mech,'Plataforma elevadora inclinada','Desnivel máximo de uso','maximo_normativo',val_text('Se destina a salvar pequeños desniveles no mayores de un piso o 3 m.'),['Debe cumplir además dimensiones, carga y seguridad del fabricante y la norma.'],em070('8.9.g'),'No la uses como sustituto improvisado de un ascensor para varios pisos.','¿Hasta qué desnivel puede utilizarse una plataforma elevadora inclinada?','La EM.070 la limita a pequeños desniveles: no más de un piso o 3 m.')
          push('em070-minicarga-capacidad-maxima',mech,'Equipo minicarga','Capacidad de carga','maximo_normativo',val_num(300,'kg','La capacidad de una minicarga llega hasta 300 kg.'),['No está destinada al transporte de personas.'],em070('10.1'),'Nunca permitas que una persona viaje dentro de una minicarga.','¿Cuál es la capacidad máxima de un equipo minicarga?','La EM.070 establece hasta 300 kg y no autoriza el transporte de personas.')

          chim='Chimeneas, hogares y climatización'
          em060=lambda n: src('EM.060','Chimeneas y Hogares','DS N.° 011-2006-VIVIENDA',n)
          push('em060-aparato-bajo-calor-limite',chim,'Aparato productor de calor','Clasificación de bajo calor','maximo_normativo',val_num(280,'°C','Es aparato de bajo calor cuando la temperatura de salida de humos es hasta 280 °C.'),[],em060('Artículo 2'),'La clasificación determina materiales y distancias; debe conocerse la temperatura real del equipo.','¿Hasta qué temperatura se considera un aparato de bajo calor?','Hasta 280 °C según la EM.060.')
          push('em060-aparato-medio-calor-rango',chim,'Aparato productor de calor','Clasificación de medio calor','condicion_normativa',val_text('Se considera de medio calor cuando la temperatura de los gases se encuentra entre 280 °C y 800 °C.'),[],em060('Artículo 2'),'No selecciones una chimenea de baja temperatura para un equipo de medio calor.','¿Qué rango corresponde a un aparato de medio calor?','Entre 280 °C y 800 °C.')
          push('em060-aparato-alto-calor-umbral',chim,'Aparato productor de calor','Clasificación de alto calor','minimo_normativo',val_num(800,'°C','Es aparato de alto calor cuando los gases de combustión superan 800 °C.'),[],em060('Artículo 2'),'Requiere materiales y separaciones especiales.','¿Desde qué temperatura un aparato se considera de alto calor?','Cuando los gases de combustión superan 800 °C.')
          push('em060-camara-forro-refractario-minimo',chim,'Cámara de combustión','Espesor de forro refractario','minimo_normativo',val_num(0.05,'m','El forro de ladrillo refractario debe tener por lo menos 0.05 m.'),[],em060('Artículo 4.2'),'No sustituyas el refractario por ladrillo común.','¿Qué espesor mínimo debe tener el forro refractario de una cámara de combustión?','Por lo menos 0.05 m.')
          push('em060-caja-fuego-espesor-total-minimo',chim,'Caja de fuego con forro','Espesor total','minimo_normativo',val_num(0.2,'m','El espesor total de la caja de fuego, incluido el forro, no debe ser menor de 0.20 m.'),[],em060('Artículo 4.2'),'El espesor incluye el sistema completo, no solo el revestimiento visible.','¿Cuál es el espesor total mínimo de una caja de fuego con forro?','No menor de 0.20 m incluyendo el forro.')
          push('em060-caja-fuego-sin-forro-espesor',chim,'Caja de fuego sin forro','Espesor de muros','minimo_normativo',val_num(0.3,'m','Sin forro de acero ni ladrillo refractario, las paredes deben tener por lo menos 0.30 m de albañilería.'),[],em060('Artículo 4.2'),'No reduzcas el muro si se omite el revestimiento previsto.','¿Qué espesor necesita una caja de fuego sin forro metálico ni refractario?','Por lo menos 0.30 m de albañilería.')
          push('em060-combustible-abertura-distancia',chim,'Abertura de hogar','Separación de materiales combustibles expuestos','minimo_normativo',val_num(0.15,'m','Los materiales combustibles expuestos no deben ubicarse dentro de 0.15 m de la abertura del hogar.'),[],em060('Artículo 4.5'),'Cortinas, muebles y acabados combustibles deben mantenerse fuera de esa zona.','¿A qué distancia mínima deben quedar materiales combustibles de la abertura de un hogar?','Por lo menos a 0.15 m.')
          push('em060-salida-humos-area-minima-absoluta',chim,'Salida de humos de hogar','Área mínima absoluta','minimo_normativo',val_num(0.04,'m²','La sección neta de salida de humos nunca debe ser menor de 0.04 m².'),['También se aplican las relaciones 1/10 o 1/8 con el área de la abertura según la altura de chimenea.'],em060('Artículo 5.1'),'El área mínima absoluta no reemplaza el cálculo proporcional.','¿Cuál es el área mínima absoluta de una salida de humos?','Nunca menos de 0.04 m², además de cumplir la relación con la abertura del hogar.')
          push('em060-ducto-altura-construcciones-cercanas',chim,'Ducto de humos','Altura sobre construcciones cercanas','formula_normativa',val_formula('h ≥ 3 m sobre construcciones ubicadas hasta 7 m','El ducto debe elevarse al menos 3 m por encima de cualquier construcción situada a una distancia de hasta 7 m.'),['La norma contiene una excepción para determinados aparatos de aire forzado.'],em060('Artículo 5.2'),'Una descarga baja puede introducir humo en techos y ventanas cercanas.','¿Cuánto debe sobresalir una chimenea respecto de construcciones cercanas?','Como regla general, 3 m por encima de cualquier construcción ubicada hasta 7 m de distancia.')
          push('em060-chimenea-metalica-vivienda-prohibida',chim,'Chimenea metálica','Uso en vivienda','prohibicion',val_text('No se permite el uso de chimeneas metálicas en viviendas unifamiliares, edificios multifamiliares, albergues tipo dormitorio y usos similares.'),[],em060('Artículo 6.1'),'No confundas un conducto certificado de un artefacto con una chimenea metálica construida in situ.','¿Se permite construir una chimenea metálica en una vivienda?','La EM.060 prohíbe las chimeneas metálicas en viviendas unifamiliares y multifamiliares y usos similares.')

          em050=lambda n: src('EM.050','Instalaciones de Climatización','DS N.° 011-2006-VIVIENDA',n)
          push('em050-equipos-certificados',chim,'Equipos y materiales de climatización','Calificación y certificación','condicion_normativa',val_text('Los equipos y materiales deben contar con aprobación, certificación o registro de una entidad o laboratorio reconocido según corresponda.'),[],em050('Artículo 6'),'No instales equipos sin identificación, ficha técnica o respaldo verificable.','¿Los equipos de climatización deben estar certificados?','La EM.050 exige calificación respaldada por laboratorio o entidad reconocida, según se trate de equipo aprobado, certificado o registrado.')
          push('em050-proyecto-equipos-materiales',chim,'Proyecto de climatización','Descripción de equipos y materiales','condicion_normativa',val_text('El proyecto debe describir equipos y materiales y contener el catálogo de conceptos y cantidades necesarios.'),[],em050('Artículo 7.1'),'La selección no debe dejarse a decisiones improvisadas durante la obra.','¿Qué debe indicar un proyecto de climatización sobre equipos y materiales?','Debe describirlos y detallar conceptos y cantidades necesarias para ejecutar la instalación.')
          push('em050-planos-obra-terminada',chim,'Instalación de climatización terminada','Planos conforme a obra','condicion_normativa',val_text('Deben elaborarse planos de obra terminada con la arquitectura actualizada; es requisito para considerar culminados los trabajos y entregar la instalación.'),[],em050('Artículo 7.5'),'Conserva rutas, equipos, drenajes y conexiones reales para mantenimiento futuro.','¿Es obligatorio entregar planos finales de la instalación de climatización?','Sí. La EM.050 exige planos de obra terminada actualizados para cerrar y entregar los trabajos.')

          if len(specs)!=50 or len(questions)!=50:
              raise SystemExit(f'Se esperaban 50 registros y se generaron {len(specs)}.')
          existing={p['id'] for p in norm['parametros']}
          dup=existing & {p['id'] for p in specs}
          if dup: raise SystemExit('IDs normativos duplicados: '+', '.join(sorted(dup)))
          existing_q={q['id'] for c in faq['categorias'] for q in c.get('preguntas',[])}
          if existing_q & {q['id'] for q in questions}: raise SystemExit('IDs FAQ duplicados.')

          norm['parametros'].extend(specs)
          norm['version']='1.9.0'
          norm['fecha_revision']=date
          faq['categorias'].append({'nombre':'Instalaciones de Gas y Equipos Especiales','preguntas':questions})
          new_total=sum(len(c.get('preguntas',[])) for c in faq['categorias'])
          if len(norm['parametros'])!=747 or new_total!=2210:
              raise SystemExit(f'Totales inesperados: {len(norm["parametros"])} parámetros y {new_total} preguntas.')
          norm_path.write_text(json.dumps(norm,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          faq_path.write_text(json.dumps(faq,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')

          checker_path=root/'scripts/check_normativa.py'
          checker=checker_path.read_text(encoding='utf-8')
          replacements=[
            ('if len(base.parametros) < 697:','if len(base.parametros) < 747:'),
            ('por lo menos 697 parámetros revisados','por lo menos 747 parámetros revisados'),
            ('if validados < 663:','if validados < 713:'),
            ('al menos 663 numerales RNE validados','al menos 713 numerales RNE validados'),
            ('if base.version != "1.8.0":','if base.version != "1.9.0":'),
            ('La versión normativa esperada es 1.8.0','La versión normativa esperada es 1.9.0'),
            ('if len(todas) < 2160:','if len(todas) < 2210:'),
            ('El bloque de accesibilidad y seguridad requiere por lo menos 2160 preguntas técnicas.','El bloque de gas y equipos especiales requiere por lo menos 2210 preguntas técnicas.'),
          ]
          for old,new in replacements:
              if old not in checker: raise SystemExit('No se encontró en validador: '+old)
              checker=checker.replace(old,new,1)
          marker='    detalle = api.detalle_parametro_normativo(\n        "a010-escalera-contrahuella-maxima"\n    )\n'
          extra='''    gas_presion = api.detalle_parametro_normativo("em040-glp-presion-maxima-despues-regulador")\n    if gas_presion["valor"]["valor"] != 20:\n        raise SystemExit("La presión máxima de GLP debe conservar 20 psig.")\n\n    pozo_luz = api.detalle_parametro_normativo("em070-pozo-iluminacion-minima")\n    if pozo_luz["valor"]["valor"] != 50:\n        raise SystemExit("El pozo de ascensor debe conservar 50 lux.")\n\n    minicarga = api.detalle_parametro_normativo("em070-minicarga-capacidad-maxima")\n    if minicarga["valor"]["valor"] != 300:\n        raise SystemExit("La minicarga debe conservar 300 kg.")\n\n    chimenea = api.detalle_parametro_normativo("em060-chimenea-metalica-vivienda-prohibida")\n    if chimenea["clasificacion"] != "prohibicion":\n        raise SystemExit("La chimenea metálica en vivienda debe conservarse como prohibición.")\n\n'''
          if marker not in checker: raise SystemExit('No se encontró punto de inserción del validador.')
          checker=checker.replace(marker,extra+marker,1)
          checker_path.write_text(checker,encoding='utf-8')

          doc=root/'docs/VALIDACION_NORMATIVA_GAS_EQUIPOS_2026-07-27.md'
          doc.write_text('''# Validación normativa de gas y equipos especiales — 27 de julio de 2026\n\n## Alcance\n\nSe incorporaron 50 parámetros y 50 preguntas sobre instalaciones de gas, ascensores, pozos y cuartos de máquinas, chimeneas, hogares y climatización.\n\n## Fuentes\n\n- EM.040 Instalaciones de Gas — RM N.° 341-2018-VIVIENDA.\n- EM.070 Transporte Mecánico — RM N.° 084-2019-VIVIENDA.\n- EM.060 Chimeneas y Hogares.\n- EM.050 Instalaciones de Climatización.\n\nLa RM N.° 167-2026-VIVIENDA solo crea un grupo de trabajo para actualizar EM.040; no sustituye la edición vigente.\n\n## Resultado\n\n- Versión normativa: `1.9.0`.\n- Parámetros: 747.\n- Preguntas: 2210.\n- Nuevos registros con numeral RNE confirmado: 50.\n\n## Criterios editoriales\n\n- La ventilación de gas no se reduce a colocar una rejilla aislada; depende del ambiente, potencia y tipo de artefacto.\n- Los 20 psig corresponden al tramo de GLP posterior al regulador de primera etapa.\n- Las instalaciones propias del ascensor permanecen bajo responsabilidad y garantía del fabricante.\n- El pozo del ascensor no se usa como ducto común de otras instalaciones.\n- Las chimeneas y hogares conservan condiciones de temperatura, material y separación de combustibles.\n''',encoding='utf-8')
          PY

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q -r requirements.txt

      - name: Validate contract API and package
        run: |
          python scripts/check_normativa.py
          python -m py_compile backend/api.py backend/normativa.py scripts/check_normativa.py
          node --check frontend/app/normative-module.js
          rm -rf public
          python scripts/prepare_frontend.py
          test -f public/index.html
          test -f public/app/normative-module.js
          test ! -e public/backend
          test ! -e public/scripts

      - name: Commit permanent files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/normativa_tecnica.json backend/preguntas_tecnicas.json scripts/check_normativa.py docs/VALIDACION_NORMATIVA_GAS_EQUIPOS_2026-07-27.md
          git commit -m 'Ampliar normativa de gas y equipos especiales'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
