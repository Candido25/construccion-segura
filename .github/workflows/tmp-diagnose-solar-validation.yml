name: Temporary diagnose solar validation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-diagnose-solar-validation.yml'

permissions:
  contents: read

jobs:
  diagnose-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/ampliar-normativa-cubiertas-energia-20260727
          fetch-depth: 0

      - name: Recreate validated candidate files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/legacy-current /tmp/legacy-output /tmp/legacy-source diagnosis-validation
          git fetch origin agent/gas-energia-equipos-20260727
          for part in 00 01 02 03; do
            git show origin/agent/gas-energia-equipos-20260727:.tmp/bloque9.part${part} >> /tmp/legacy-source/payload.b64
          done
          base64 -d /tmp/legacy-source/payload.b64 | gzip -dc > /tmp/legacy-source/original.py
          cp backend/normativa_tecnica.json /tmp/legacy-current/normativa_tecnica.json
          cp backend/preguntas_tecnicas.json /tmp/legacy-current/preguntas_tecnicas.json
          cp scripts/check_normativa.py /tmp/legacy-current/check_normativa.py

          python - <<'PY'
          from pathlib import Path
          import re
          workflow=Path('.github/workflows/tmp-apply-solar-transport-completion.yml').read_text(encoding='utf-8')
          blocks=re.findall(r"          python - <<'PY'\n(.*?)\n          PY",workflow,flags=re.S)
          def clean(block):
              return '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines()).lstrip()+'\n'
          Path('/tmp/legacy-source/adapt.py').write_text(clean(blocks[0]),encoding='utf-8')
          Path('/tmp/legacy-source/refine.py').write_text(clean(blocks[1]),encoding='utf-8')
          PY
          python /tmp/legacy-source/adapt.py
          python /tmp/legacy-source/adapted.py
          python /tmp/legacy-source/refine.py
          cp /tmp/legacy-output/normativa_tecnica.json backend/normativa_tecnica.json
          cp /tmp/legacy-output/preguntas_tecnicas.json backend/preguntas_tecnicas.json
          cp /tmp/legacy-output/check_normativa.py scripts/check_normativa.py
          cp /tmp/legacy-output/VALIDACION_NORMATIVA_SOLAR_COMPLEMENTOS_2026-07-27.md docs/VALIDACION_NORMATIVA_SOLAR_COMPLEMENTOS_2026-07-27.md

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q -r requirements.txt

      - name: Capture validation stages
        shell: bash
        run: |
          set +e
          python scripts/check_normativa.py > diagnosis-validation/01-check-normativa.log 2>&1
          echo $? > diagnosis-validation/01-check-normativa.status
          python -m py_compile backend/api.py backend/normativa.py > diagnosis-validation/02-compile.log 2>&1
          echo $? > diagnosis-validation/02-compile.status
          python scripts/prepare_frontend.py > diagnosis-validation/03-prepare.log 2>&1
          echo $? > diagnosis-validation/03-prepare.status
          test -f public/app/normative-module.js
          echo $? > diagnosis-validation/04-module.status
          test -f public/app/normative.css
          echo $? > diagnosis-validation/05-css.status
          test -f public/backend/normativa_tecnica.json
          echo $? > diagnosis-validation/06-data.status
          git status --short > diagnosis-validation/07-git-status.log 2>&1
          test -z "$(git status --short public)"
          echo $? > diagnosis-validation/08-public-clean.status
          set -e

          cp scripts/check_normativa.py diagnosis-validation/generated-check-normativa.py
          python - <<'PY' > diagnosis-validation/09-data-summary.log 2>&1
          import json
          from collections import Counter
          from pathlib import Path
          norm=json.loads(Path('backend/normativa_tecnica.json').read_text(encoding='utf-8'))
          faq=json.loads(Path('backend/preguntas_tecnicas.json').read_text(encoding='utf-8'))
          print('version',norm.get('version'))
          print('parameters',len(norm.get('parametros',[])))
          print('questions',sum(len(c.get('preguntas',[])) for c in faq.get('categorias',[])))
          print('states',Counter(x.get('estado_revision') for x in norm.get('parametros',[])))
          print('em080',sum(x.get('fuente',{}).get('norma')=='EM.080' for x in norm.get('parametros',[])))
          PY

      - name: Upload validation diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solar-validation-diagnosis
          path: diagnosis-validation
          retention-days: 2
