name: Temporary apply normative batch 3

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-apply-normativa-lote-3.yml'

permissions:
  contents: write

jobs:
  apply-normative-batch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply verified parameters and FAQ corrections
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          norm_path = Path('backend/normativa_tecnica.json')
          faq_path = Path('backend/preguntas_tecnicas.json')
          norm = json.loads(norm_path.read_text(encoding='utf-8'))
          faq = json.loads(faq_path.read_text(encoding='utf-8'))

          if len(norm.get('parametros', [])) != 41 or norm.get('version') != '1.2.0':
              raise SystemExit('La base normativa cambió desde el lote 2; revisar antes de aplicar.')

          existing_ids = {item['id'] for item in norm['parametros']}
          source_url = 'https://www.gob.pe/institucion/vivienda/informes-publicaciones/2309793-reglamento-nacional-de-edificaciones-rne'
          review_date = '2026-07-27'

          def source(norm_name: str, title: str, device: str, numeral: str) -> dict:
              return {
                  'tipo': 'RNE',
                  'norma': norm_name,
                  'denominacion': title,
                  'dispositivo': device,
                  'numeral': numeral,
                  'numeral_confirmado': True,
                  'url_oficial': source_url,
              }

          e060 = lambda numeral: source('E.060', 'Concreto Armado', 'DS N.° 010-2009-VIVIENDA', numeral)
          e070 = lambda numeral: source('E.070', 'Albañilería', 'DS N.° 011-2006-VIVIENDA', numeral)

          new_parameters = [
              {
                  'id': 'e060-concreto-estructural-resistencia-minima',
                  'categoria': 'Concreto y acero de refuerzo',
                  'elemento': 'Concreto estructural',
                  'parametro': 'Resistencia especificada a compresión',
                  'clasificacion': 'minimo_normativo',
                  'valor': {'tipo': 'numero', 'valor': 17, 'unidad': 'MPa', 'texto': "La resistencia especificada f'c del concreto estructural no debe ser menor de 17 MPa."},
                  'condiciones': ['Es un límite general de la E.060; los planos pueden exigir una resistencia mayor.', 'La resistencia se verifica mediante probetas y criterios de aceptación de la norma.'],
                  'fuente': e060('5.1.1 y 9.4.1'),
                  'estado_revision': 'validado_con_numeral',
                  'advertencia': "No debe reemplazarse la resistencia indicada en los planos por el mínimo de 17 MPa.",
                  'faq_relacionadas': ['q1520'],
                  'fecha_revision': review_date,
              },
              {
                  'id': 'e060-agregado-maximo-respecto-encofrado',
                  'categoria': 'Concreto y acero de refuerzo',
                  'elemento': 'Agregado grueso',
                  'parametro': 'Tamaño máximo respecto al encofrado',
                  'clasificacion': 'formula_normativa',
                  'valor': {'tipo': 'formula', 'formula': 'Dmax ≤ b/5', 'texto': 'El tamaño máximo nominal no debe superar 1/5 de la menor separación entre los lados del encofrado.'},
                  'condiciones': ['b representa la menor separación libre entre caras del encofrado.', 'Puede exceptuarse únicamente si se demuestra colocación y compactación sin vacíos ni cangrejeras.'],
