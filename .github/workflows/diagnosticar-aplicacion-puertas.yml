name: Diagnosticar aplicación de puertas

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/diagnosticar-aplicacion-puertas.yml

permissions:
  contents: write

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          ref: agent/ampliar-puertas-ventanas-seguridad-20260727
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Capturar resultado
        run: |
          set +e
          python scripts/aplicar_ampliacion_puertas_ventanas.py > docs/RESULTADO_PUERTAS.txt 2>&1
          echo "ESTADO_APLICAR=$?" >> docs/RESULTADO_PUERTAS.txt
          python scripts/check_normativa.py >> docs/RESULTADO_PUERTAS.txt 2>&1
          echo "ESTADO_VALIDAR=$?" >> docs/RESULTADO_PUERTAS.txt
          exit 0
      - name: Confirmar diagnóstico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/RESULTADO_PUERTAS.txt
          git diff --cached --quiet || git commit -m "Registrar resultado de puertas"
          git push origin HEAD:agent/ampliar-puertas-ventanas-seguridad-20260727
