name: Aplicar ampliación de instalaciones de gas

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/aplicar_ampliacion_gas.py
      - .github/workflows/aplicar-instalaciones-gas.yml

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ampliar-instalaciones-gas-20260727
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Aplicar inventario con conteos dinámicos
        run: python scripts/aplicar_ampliacion_gas.py
      - run: python scripts/check_normativa.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/normativa_tecnica.json backend/preguntas_tecnicas.json scripts/check_normativa.py docs/VALIDACION_INSTALACIONES_GAS_2026-07-27.md
          git diff --cached --quiet || git commit -m "Ampliar instalaciones de gas y combustión"
          git push origin HEAD:agent/ampliar-instalaciones-gas-20260727
