name: Temporary diagnose normative block 8

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-diagnosticar-bloque-8.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Diagnose transfer and generator
        shell: bash
        run: |
          mkdir -p diagnosis /mnt/data/bloques89/current /mnt/data/bloques89/block8
          cat .tmp/bloque8.part00 .tmp/bloque8.part01 .tmp/bloque8.part02 .tmp/bloque8.part03 .tmp/bloque8.part04 .tmp/bloque8.part05 > diagnosis/generator.b64
          wc -c diagnosis/generator.b64 > diagnosis/length.txt
          sha256sum diagnosis/generator.b64 > diagnosis/hash.txt
          set +e
          base64 -d diagnosis/generator.b64 > diagnosis/generator.py.gz 2> diagnosis/base64-error.txt
          echo "base64_status=$?" >> diagnosis/base64-error.txt
          gzip -t diagnosis/generator.py.gz 2> diagnosis/gzip-error.txt
          echo "gzip_status=$?" >> diagnosis/gzip-error.txt
          gzip -dc diagnosis/generator.py.gz > diagnosis/generator.py 2>> diagnosis/gzip-error.txt
          sha256sum diagnosis/generator.py > diagnosis/python-hash.txt
          cp backend/normativa_tecnica.json /mnt/data/bloques89/current/
          cp backend/preguntas_tecnicas.json /mnt/data/bloques89/current/
          cp backend/normativa.py /mnt/data/bloques89/current/
          cp scripts/check_normativa.py /mnt/data/bloques89/current/
          cp frontend/app/normative-module.js /mnt/data/bloques89/current/
          cp docs/CONTRATO_NORMATIVA.md /mnt/data/bloques89/current/
          python diagnosis/generator.py > diagnosis/run.txt 2>&1
          echo "run_status=$?" >> diagnosis/run.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostico-bloque-8
          path: diagnosis
          retention-days: 2
