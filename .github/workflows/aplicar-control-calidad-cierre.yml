name: Aplicar control de calidad, recepción y cierre

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/ampliar_control_calidad_cierre.py
      - scripts/control_calidad_payload.trigger
      - .github/workflows/aplicar-control-calidad-cierre.yml

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ampliar-control-calidad-cierre-20260727
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Recuperar inventario desde comentarios del PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          number = os.environ["PR_NUMBER"]
          token = os.environ["GH_TOKEN"]
          url = f"https://api.github.com/repos/{repo}/issues/{number}/comments?per_page=100"
          request = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urllib.request.urlopen(request) as response:
              comments = json.load(response)
          chunks = []
          for comment in comments:
              body = comment.get("body", "")
              if not body.startswith("CONTROL_CALIDAD_PAYLOAD_") or ":" not in body:
                  continue
              label, data = body.split(":", 1)
              chunks.append((int(label.removeprefix("CONTROL_CALIDAD_PAYLOAD_")), "".join(data.split())))
          chunks.sort()
          if [n for n, _ in chunks] != list(range(1, len(chunks) + 1)):
              raise SystemExit("Inventario incompleto o desordenado")
          payload = "".join(data for _, data in chunks)
          open("/tmp/control_calidad_payload.b64", "w", encoding="utf-8").write(payload)
          print(f"Inventario recuperado: {len(chunks)} fragmentos, {len(payload)} caracteres")
          PY
      - name: Diagnosticar aplicación y validación
        run: |
          set +e
          python scripts/ampliar_control_calidad_cierre.py /tmp/control_calidad_payload.b64 > docs/RESULTADO_CONTROL_CALIDAD.txt 2>&1
          APLICACION=$?
          echo "APLICACION=$APLICACION" >> docs/RESULTADO_CONTROL_CALIDAD.txt
          if [ "$APLICACION" -eq 0 ]; then
            python scripts/check_normativa.py >> docs/RESULTADO_CONTROL_CALIDAD.txt 2>&1
            echo "VALIDACION=$?" >> docs/RESULTADO_CONTROL_CALIDAD.txt
          fi
          exit 0
      - name: Publicar diagnóstico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/RESULTADO_CONTROL_CALIDAD.txt
          git diff --cached --quiet || git commit -m "Registrar diagnóstico de control de calidad"
          git push origin HEAD:agent/ampliar-control-calidad-cierre-20260727
