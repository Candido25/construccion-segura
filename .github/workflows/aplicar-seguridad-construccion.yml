name: Aplicar ampliación de seguridad durante la construcción

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/aplicar_ampliacion_seguridad.py
      - .github/workflows/aplicar-seguridad-construccion.yml

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ampliar-seguridad-construccion-20260727
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Aplicar inventario final de seguridad
        run: python scripts/aplicar_ampliacion_seguridad.py
      - name: Validar base y API
        run: python scripts/check_normativa.py
      - name: Confirmar archivos generados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/normativa_tecnica.json backend/preguntas_tecnicas.json scripts/check_normativa.py docs/VALIDACION_SEGURIDAD_CONSTRUCCION_2026-07-27.md
          git diff --cached --quiet || git commit -m "Ampliar seguridad durante la construcción"
          git pull --rebase origin agent/ampliar-seguridad-construccion-20260727
          git push origin HEAD:agent/ampliar-seguridad-construccion-20260727
