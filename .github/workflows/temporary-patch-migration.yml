name: Temporary patch migration

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-phase-zero:
    if: github.head_ref == 'agent/arquitectura-raiz-estatica-20260726' || github.ref_name == 'agent/arquitectura-raiz-estatica-20260726'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/arquitectura-raiz-estatica-20260726
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply controlled migration
        run: python scripts/phase0_migration.py

      - name: Install validators
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 tinycss2==1.4.0

      - name: Validate migrated architecture
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_frontend.py
          python scripts/run_frontend_validator.py check_assets
          python scripts/run_frontend_validator.py check_resources
          python scripts/run_frontend_validator.py check_site
          python -m py_compile backend/api.py
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find public -type f -name '*.js' -print0)
          test -f index.html
          test -f frontend/app/index.html
          test ! -e frontend/index.html
          test ! -e public/backend
          test ! -e public/scripts

      - name: Remove temporary migration automation
        shell: bash
        run: |
          rm -f scripts/phase0_migration.py
          rm -f .github/workflows/temporary-architecture-migration.yml
          rm -f .github/workflows/temporary-architecture-debug.yml
          rm -f .github/workflows/temporary-patch-migration.yml

      - name: Commit migrated architecture
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migrar web institucional a la raíz"
          git push origin HEAD:agent/arquitectura-raiz-estatica-20260726
