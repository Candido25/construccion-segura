name: Diagnosticar aplicación de seguridad

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/diagnosticar-aplicacion-seguridad.yml

permissions:
  contents: write

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ampliar-seguridad-construccion-20260727
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: |
          set +e
          python scripts/aplicar_ampliacion_seguridad.py > docs/RESULTADO_SEGURIDAD.txt 2>&1
          echo "APLICACION=$?" >> docs/RESULTADO_SEGURIDAD.txt
          python scripts/check_normativa.py >> docs/RESULTADO_SEGURIDAD.txt 2>&1
          echo "VALIDACION=$?" >> docs/RESULTADO_SEGURIDAD.txt
          exit 0
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/RESULTADO_SEGURIDAD.txt
          git diff --cached --quiet || git commit -m "Registrar diagnóstico de validación de seguridad"
          git push origin HEAD:agent/ampliar-seguridad-construccion-20260727
