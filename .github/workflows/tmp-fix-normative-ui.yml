name: Temporary normative empty-state fix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-fix-normative-ui.yml'

permissions:
  contents: write

jobs:
  patch-empty-state:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Hide retry button after successful empty searches
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/app/normative-module.js')
          text = path.read_text(encoding='utf-8')
          old = 'retryButton?.toggleAttribute("hidden", items.length !== 0);'
          new = 'retryButton?.setAttribute("hidden", "");'
          if old not in text:
              raise SystemExit('No se encontró la línea esperada para corregir.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit correction
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/normative-module.js
          git commit -m "Corregir estado vacío de consulta normativa"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
