name: Temporary normative hidden-state fix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-fix-normative-hidden.yml'

permissions:
  contents: write

jobs:
  patch-hidden-state:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Enforce hidden state inside normative module
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/app/normative.css')
          text = path.read_text(encoding='utf-8')
          marker = '.normative-section {\n'
          rule = '.normative-section [hidden] {\n  display: none !important;\n}\n\n'
          if rule in text:
              raise SystemExit(0)
          if marker not in text:
              raise SystemExit('No se encontró el inicio esperado de normative.css.')
          path.write_text(rule + text, encoding='utf-8')
          PY

      - name: Commit correction
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/normative.css
          git commit -m "Corregir estados ocultos del módulo normativo"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
