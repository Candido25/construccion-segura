name: Diagnosticar impermeabilización y humedad

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/diagnosticar_impermeabilizacion_humedad.py
      - .github/workflows/diagnosticar-impermeabilizacion-humedad.yml

permissions:
  contents: write

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ampliar-impermeabilizacion-humedad-20260727
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/diagnosticar_impermeabilizacion_humedad.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DIAGNOSTICO_IMPERMEABILIZACION_HUMEDAD_2026-07-27.md
          git diff --cached --quiet || git commit -m "Registrar diagnóstico de impermeabilización"
          git push origin HEAD:agent/ampliar-impermeabilizacion-humedad-20260727
