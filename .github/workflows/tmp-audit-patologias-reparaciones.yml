name: Temporary audit pathologies repairs and extensions

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-audit-patologias-reparaciones.yml'

permissions:
  contents: read

jobs:
  audit-official-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Download official sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-patologias
          python - <<'PY'
          from __future__ import annotations
          import pathlib
          import time
          import urllib.request

          files = {
              'G040.pdf': 'https://cdn.www.gob.pe/uploads/document/file/2365098/04%20G.040%20DEFINICIONES_RM%20N%C2%B0%20029-2021-VIVIENDA.pdf?v=1636055463',
              'G050.pdf': 'https://cdn.www.gob.pe/uploads/document/file/2365155/05%20G.050%20SEGURIDAD%20DURANTE%20LA%20CONSTRUCCI%C3%93N%20DS%20N%C2%B0%20010-2009.pdf?v=1636045000',
              'GE040.pdf': 'https://cdn.www.gob.pe/uploads/document/file/2366527/34%20GE.040%20USO%20Y%20MANTENIMIENTO.pdf?v=1636058378',
              'A010.pdf': 'https://cdn.www.gob.pe/uploads/document/file/2366528/35%20A.010%20CONDICIONES%20GENERALES%20DE%20DISE%C3%91O%20-%20RM%20N%C2%B0%20191-2021-VIVIENDA.pdf?v=1636058378',
              'E030-2026.pdf': 'https://cdn.www.gob.pe/uploads/document/file/9902957/8081915-nt-e-030-diseno-sismorresistente-2026.pdf?v=1777909403',
              'E050.pdf': 'https://cdn.www.gob.pe/uploads/document/file/2366655/54%20E.050%20SUELOS%20Y%20CIMENTACIONES%20RM%20N%C2%B0%20406-2018-VIVIENDA.pdf?v=1677250657',
              'E060.pdf': 'https://cdn.www.gob.pe/uploads/document/file/2366660/55%20E.060%20CONCRETO%20ARMADO%20DS%20N%C2%B0%20010-2009.pdf?v=1677250657',
              'E070.pdf': 'https://cdn.www.gob.pe/uploads/document/file/2366661/56%20E.070%20ALBA%C3%91ILERIA.pdf?v=1677250657',
              'DS029-2019.pdf': 'https://cdn.www.gob.pe/uploads/document/file/421562/DS_029-2019-VIVIENDA.pdf?v=1573609889',
              'EDAN-MVCS-v3.pdf': 'https://cdn.www.gob.pe/uploads/document/file/8316144/6929298-anexo-rm-170-2025-vivienda.pdf?v=1751581683',
          }
          output = pathlib.Path('audit-patologias')
          for name, url in files.items():
              target = output / name
              last = None
              for attempt in range(1, 6):
                  try:
                      request = urllib.request.Request(
                          url,
                          headers={
                              'User-Agent': 'Mozilla/5.0 ConstruccionSegura/1.7 audit',
                              'Accept': 'application/pdf,*/*',
                          },
                      )
                      with urllib.request.urlopen(request, timeout=120) as response:
                          data = response.read()
                      if len(data) < 1000:
                          raise RuntimeError(f'{name}: descarga demasiado pequeña')
                      target.write_bytes(data)
                      break
                  except Exception as error:  # noqa: BLE001
                      last = error
                      if attempt == 5:
                          raise
                      time.sleep(attempt * 2)
              print(name, target.stat().st_size, last or 'ok')
          PY
          for pdf in audit-patologias/*.pdf; do
            pdftotext -layout "$pdf" "${pdf%.pdf}.txt"
          done

      - name: Build audit report
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          import unicodedata
          from pathlib import Path

          root = Path('audit-patologias')
          norm = json.loads(Path('backend/normativa_tecnica.json').read_text(encoding='utf-8'))
          faq = json.loads(Path('backend/preguntas_tecnicas.json').read_text(encoding='utf-8'))

          def normalize(value: str) -> str:
              text = unicodedata.normalize('NFD', str(value).lower())
              return ' '.join(''.join(ch for ch in text if unicodedata.category(ch) != 'Mn').split())

          documents = {
              path.stem: path.read_text(encoding='utf-8', errors='ignore')
              for path in root.glob('*.txt')
          }

          questions = []
          for category in faq.get('categorias', []):
              category_name = category.get('nombre') or category.get('categoria') or ''
              for item in category.get('preguntas', []):
                  if isinstance(item, dict):
                      questions.append({
                          'id': item.get('id'),
                          'category': category_name,
                          'question': item.get('pregunta', ''),
                          'answer': item.get('respuesta', ''),
                          'search': normalize(f"{category_name} {item.get('pregunta', '')} {item.get('respuesta', '')}"),
                      })

          searches = {
              'G040': [
                  r'ampliacion', r'remodelacion', r'refaccion', r'reparacion', r'reforzamiento',
                  r'demolicion', r'mantenimiento', r'obra nueva', r'puesta en valor', r'acondicionamiento',
              ],
              'G050': [
                  r'demolicion', r'apuntal', r'elemento inestable', r'colapso', r'escombro', r'caida',
                  r'material peligroso', r'corte', r'energia', r'agua', r'secuencia', r'vibracion', r'excavacion',
              ],
              'GE040': [
                  r'mantenimiento', r'manual', r'conservacion', r'propietario', r'usuario', r'inspeccion',
                  r'reparacion', r'modificacion', r'instalacion', r'estructura', r'vida util',
              ],
              'A010': [
                  r'remodelacion', r'ampliacion', r'modificacion', r'vano', r'muro', r'humedad', r'impermeabil',
                  r'cubierta', r'techo', r'fachada', r'junta', r'evacuacion',
              ],
              'E030-2026': [
                  r'edificaciones existentes', r'reforzamiento', r'reparacion', r'cambio de uso', r'ampliacion',
                  r'irregularidad', r'junta', r'dano', r'colapso', r'evaluacion', r'estructura existente',
              ],
              'E050': [
                  r'edificacion existente', r'excavacion', r'calzadura', r'cimentacion vecina', r'socavacion',
                  r'asentamiento', r'fisura', r'relleno', r'nivel freatico', r'talud', r'estabilidad',
              ],
              'E060': [
                  r'evaluacion de estructuras', r'prueba de carga', r'resistencia insuficiente', r'testigo',
                  r'reparacion', r'corrosion', r'fisura', r'deterioro', r'concreto existente', r'anclaje',
                  r'adhesivo', r'junta', r'demolicion', r'corte', r'perforacion',
              ],
              'E070': [
                  r'reparacion', r'reforzamiento', r'agrietamiento', r'fisura', r'muro existente', r'dano',
                  r'talud', r'humedad', r'eflorescencia', r'corrosion', r'modificacion', r'demolicion',
              ],
              'DS029-2019': [
                  r'ampliacion', r'remodelacion', r'refaccion', r'acondicionamiento', r'puesta en valor',
                  r'demolicion', r'modificacion estructural', r'licencia', r'modalidad a', r'modalidad b',
                  r'obra menor', r'emergencia', r'conformidad de obra', r'responsable de obra',
              ],
              'EDAN-MVCS-v3': [
                  r'vivienda destruida', r'vivienda inhabitable', r'vivienda afectada', r'dano estructural',
                  r'dano no estructural', r'colapso', r'grieta', r'fisura', r'inclinacion', r'evacuacion',
                  r'evaluacion', r'peligro', r'recomendacion', r'habitabilidad',
              ],
          }

          def contexts(text: str, patterns: list[str], limit: int = 80) -> list[str]:
              lines = text.splitlines()
              normalized = [normalize(line) for line in lines]
              blocks = []
              fingerprints = set()
              for index, line in enumerate(normalized):
                  if any(re.search(pattern, line) for pattern in patterns):
                      start = max(0, index - 7)
                      end = min(len(lines), index + 14)
                      block = '\n'.join(lines[start:end]).strip()
                      fingerprint = normalize(block)[:500]
                      if block and fingerprint not in fingerprints:
                          blocks.append(block)
                          fingerprints.add(fingerprint)
                      if len(blocks) >= limit:
                          break
              return blocks

          report = [
              '# Auditoría de patologías, reparaciones, ampliaciones y demoliciones', '',
              f"- Versión actual: `{norm.get('version')}`",
              f"- Parámetros actuales: {len(norm.get('parametros', []))}",
              f"- Preguntas actuales: {len(questions)}", '',
              '## Fuentes oficiales revisadas', '',
              '- G.040 Definiciones — RM N.° 029-2021-VIVIENDA.',
              '- G.050 Seguridad durante la construcción — DS N.° 010-2009-VIVIENDA.',
              '- GE.040 Uso y mantenimiento.',
              '- A.010 Condiciones Generales de Diseño — RM N.° 191-2021-VIVIENDA.',
              '- E.030 Diseño Sismorresistente 2026 — RM N.° 183-2026-VIVIENDA.',
              '- E.050 Suelos y Cimentaciones — RM N.° 406-2018-VIVIENDA.',
              '- E.060 Concreto Armado — DS N.° 010-2009-VIVIENDA.',
              '- E.070 Albañilería.',
              '- Reglamento de Licencias — DS N.° 029-2019-VIVIENDA.',
              '- Manual EDAN del MVCS, versión 3.0 — RM N.° 170-2025-VIVIENDA.', '',
          ]

          for name, patterns in searches.items():
              report += [f'## {name}', '']
              blocks = contexts(documents.get(name, ''), patterns)
              if not blocks:
                  report.append('_Sin coincidencias extraídas._')
              for number, block in enumerate(blocks, 1):
                  report += [f'### Contexto {number}', '```text', block[:7000], '```', '']

          faq_terms = [
              'grieta', 'fisura', 'humedad', 'salitre', 'eflorescencia', 'corrosion', 'asentamiento',
              'inclinacion', 'reparacion', 'reforzamiento', 'ampliacion', 'remodelacion', 'demolicion',
              'apuntalamiento', 'calzadura', 'muro portante', 'cortar columna', 'cortar viga', 'abrir vano',
              'cambio de uso', 'vivienda inhabitable', 'evaluacion despues de sismo', 'mantenimiento',
          ]
          report += ['## Preguntas existentes relacionadas', '']
          for term in faq_terms:
              token = normalize(term)
              matches = [item for item in questions if token in item['search']][:25]
              report += [f'### {term}', '']
              if not matches:
                  report.append('_Sin coincidencias directas._')
              for item in matches:
                  answer = ' '.join(str(item['answer']).split())
                  report.append(f"- `{item['id']}` [{item['category']}]: **{item['question']}** — {answer[:500]}")
              report.append('')

          related_tokens = [
              'grieta', 'fisura', 'humedad', 'repar', 'reforz', 'ampli', 'remodel', 'demolic',
              'mantenimiento', 'asentamiento', 'calzadura', 'corrosion', 'dano', 'existente',
          ]
          report += ['## Parámetros existentes relacionados', '']
          for item in norm.get('parametros', []):
              haystack = normalize(' '.join([
                  item.get('id', ''), item.get('categoria', ''), item.get('elemento', ''),
                  item.get('parametro', ''), item.get('valor', {}).get('texto', ''),
                  ' '.join(item.get('condiciones', [])), item.get('advertencia', ''),
              ]))
              if any(token in haystack for token in related_tokens):
                  report.append(
                      f"- `{item.get('id')}` — {item.get('categoria')} / {item.get('elemento')} / "
                      f"{item.get('parametro')} / {item.get('fuente', {}).get('norma')} {item.get('fuente', {}).get('numeral')}"
                  )

          Path('audit-patologias/report.md').write_text('\n'.join(report) + '\n', encoding='utf-8')
          PY

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: pathologies-repairs-audit
          path: audit-patologias
          retention-days: 3
