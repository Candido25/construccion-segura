name: Corregir mensaje de versión de acabados

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/corregir-version-acabados.yml

permissions:
  contents: write

jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          ref: agent/ampliar-acabados-construccion-20260727

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Corregir mensaje, limpiar y validar
        run: |
          sed -i 's/La versión normativa esperada es 2.2.0/La versión normativa esperada es 2.3.0/' scripts/check_normativa.py
          rm -f .github/workflows/corregir-version-acabados.yml
          python scripts/check_normativa.py

      - name: Confirmar corrección
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Corregir mensaje de versión de acabados"
          git push origin HEAD:agent/ampliar-acabados-construccion-20260727
