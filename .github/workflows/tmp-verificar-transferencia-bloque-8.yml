name: Temporary verify block 8 transfer

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-verificar-transferencia-bloque-8.yml'

permissions:
  contents: read

jobs:
  verify-transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Verify concatenated base64
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/bloque8.part00 .tmp/bloque8.part01 .tmp/bloque8.part02 .tmp/bloque8.part03 .tmp/bloque8.part04 .tmp/bloque8.part05 > /tmp/generator.b64
          test "$(wc -c < /tmp/generator.b64)" = "20532"
          echo 'e53fd00a08a970b6de6558d2f6cbeabf4c0589cf05127a6e2ee1e73a72e578fe  /tmp/generator.b64' | sha256sum -c -
      - name: Verify decoded Python generator
        shell: bash
        run: |
          set -euo pipefail
          base64 -d /tmp/generator.b64 | gzip -d > /tmp/build_block8.py
          echo '79ccc7748e7186bd2ca814dc405bc48e2b57d5e5922f78b146aa908a2081ccff  /tmp/build_block8.py' | sha256sum -c -
          python -m py_compile /tmp/build_block8.py
      - name: Execute generator against current base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /mnt/data/bloques89/current /mnt/data/bloques89/block8
          cp backend/normativa_tecnica.json /mnt/data/bloques89/current/
          cp backend/preguntas_tecnicas.json /mnt/data/bloques89/current/
          cp backend/normativa.py /mnt/data/bloques89/current/
          cp scripts/check_normativa.py /mnt/data/bloques89/current/
          cp frontend/app/normative-module.js /mnt/data/bloques89/current/
          cp docs/CONTRATO_NORMATIVA.md /mnt/data/bloques89/current/
          python /tmp/build_block8.py
          test -f /mnt/data/bloques89/block8/normativa_tecnica.json
          test -f /mnt/data/bloques89/block8/preguntas_tecnicas.json
