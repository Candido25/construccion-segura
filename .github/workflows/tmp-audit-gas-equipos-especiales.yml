name: Temporary audit gas and special equipment

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-audit-gas-equipos-especiales.yml'

permissions:
  contents: read

jobs:
  audit-official-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Download official RNE standards
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-special
          python - <<'PY'
          from pathlib import Path
          import html,re,urllib.request
          page='https://www.gob.pe/institucion/vivienda/informes-publicaciones/2309793-reglamento-nacional-de-edificaciones-rne'
          req=urllib.request.Request(page,headers={'User-Agent':'ConstruccionSegura-audit/1.0'})
          with urllib.request.urlopen(req,timeout=90) as r: text=r.read().decode('utf-8','ignore')
          text=html.unescape(text).replace('\\u002F','/').replace('\\/','/')
          links=list(dict.fromkeys(re.findall(r'https://cdn\.www\.gob\.pe/[^"\'<> ]+',text,re.I)))
          wanted={
            'A010':['a.010','condiciones generales'],
            'A020':['a.020','vivienda'],
            'EM040':['em.040','instalaciones de gas'],
            'EM050':['em.050','climatizacion'],
            'EM060':['em.060','chimeneas'],
            'EM070':['em.070','transporte mecanico'],
          }
          selected={}
          for key,terms in wanted.items():
              scored=[]
              for link in links:
                  low=link.lower()
                  score=sum(t in low for t in terms)+(2 if '.pdf' in low else 0)
                  scored.append((score,link))
              for score,link in sorted(scored,reverse=True):
                  if score<2: continue
                  try:
                      req=urllib.request.Request(link,headers={'User-Agent':'ConstruccionSegura-audit/1.0'})
                      with urllib.request.urlopen(req,timeout=90) as r: data=r.read()
                      if data.startswith(b'%PDF'):
                          Path(f'audit-special/{key}.pdf').write_bytes(data)
                          selected[key]=link
                          break
                  except Exception:
                      pass
          Path('audit-special/selected-links.txt').write_text('\n'.join(f'{k}={v}' for k,v in selected.items()),encoding='utf-8')
          missing=[k for k in wanted if k not in selected]
          if missing: raise SystemExit('No se descargaron: '+', '.join(missing))
          PY
          for pdf in audit-special/*.pdf; do pdftotext -layout "$pdf" "${pdf%.pdf}.txt"; done

      - name: Build inventory and extract clauses
        shell: bash
        run: |
          python - <<'PY'
          import json,re,unicodedata
          from pathlib import Path
          faq=json.loads(Path('backend/preguntas_tecnicas.json').read_text(encoding='utf-8'))
          norm=json.loads(Path('backend/normativa_tecnica.json').read_text(encoding='utf-8'))
          def n(s):
              s=unicodedata.normalize('NFD',str(s).lower())
              return ' '.join(''.join(c for c in s if unicodedata.category(c)!='Mn').split())
          qs=[]
          for cat in faq['categorias']:
              cn=cat.get('nombre') or cat.get('categoria') or ''
              for q in cat.get('preguntas',[]): qs.append((q.get('id'),cn,q.get('pregunta',''),q.get('respuesta',''),n(f"{cn} {q.get('pregunta','')} {q.get('respuesta','')}")))
          lines=['# Auditoría de gas, transporte mecánico y equipos especiales','',f"- Versión actual: `{norm['version']}`",f"- Parámetros actuales: {len(norm['parametros'])}",f"- Preguntas actuales: {len(qs)}",'',
                 '## Vigencia comprobada','',
                 '- EM.040 vigente: RM N.° 341-2018-VIVIENDA. La RM N.° 167-2026-VIVIENDA solo creó un grupo de trabajo para actualizarla; no reemplaza el texto vigente.',
                 '- EM.070 vigente: RM N.° 084-2019-VIVIENDA.',
                 '- EM.050 y EM.060 se toman del compendio oficial del RNE.',
                 '- A.010 y A.020 se usan para estacionamientos, circulación, azoteas y cuartos técnicos relacionados.','']
          topics={
            'Gas':['gas natural','glp','cilindro','balon de gas','medidor de gas','ventilacion de gas','tuberia de gas','valvula de gas','artefacto a gas','monoxido'],
            'Ascensores y transporte':['ascensor','elevador','montacarga','plataforma elevadora','escalera mecanica','cuarto de maquinas','pozo de ascensor'],
            'Chimeneas y hogares':['chimenea','hogar','ducto de humos','evacuacion de gases','tiro de chimenea'],
            'Climatizacion':['aire acondicionado','climatizacion','unidad condensadora','drenaje de condensado','refrigerante'],
            'Estacionamientos y azoteas':['estacionamiento','garaje','azotea','techo','cuarto tecnico'],
          }
          for name,terms in topics.items():
              lines += [f'## Preguntas existentes: {name}','']
              hits=[q for q in qs if any(n(t) in q[4] for t in terms)]
              for qid,cat,q,a,_ in hits[:100]: lines.append(f'- `{qid}` [{cat}] **{q}** — {" ".join(a.split())[:300]}')
              if not hits: lines.append('_Sin coincidencias directas._')
              lines.append('')
          patterns={
            'EM040':['ventilacion','cilindro','tanque','tuberia','valvula','medidor','distancia','artefacto','combustion','monoxido','gabinete','regulador'],
            'EM070':['ascensor','cabina','puerta','pozo','cuarto de maquinas','carga','velocidad','plataforma','montacarga','senalizacion','emergencia'],
            'EM060':['chimenea','hogar','conducto','distancia','altura','material combustible','sombrerete'],
            'EM050':['climatizacion','condensado','aire exterior','refrigerante','unidad','mantenimiento'],
            'A010':['estacionamiento','azotea','cuarto de maquinas','rampa vehicular','ventilacion'],
            'A020':['estacionamiento','azotea','gas','medidor'],
          }
          for key,terms in patterns.items():
              text=Path(f'audit-special/{key}.txt').read_text(encoding='utf-8',errors='ignore')
              raw=text.splitlines(); normlines=[n(x) for x in raw]
              lines += [f'## Extractos {key}','']
              used=[]
              for i,line in enumerate(normlines):
                  if any(n(t) in line for t in terms):
                      block='\n'.join(raw[max(0,i-4):min(len(raw),i+10)]).strip()
                      if block and block not in used:
                          used.append(block); lines += ['```text',block[:3000],'```','']
                      if len(used)>=45: break
          Path('audit-special/report.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: gas-special-equipment-audit
          path: audit-special
          retention-days: 3
