name: Aplicar ampliación de azoteas

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/aplicar_ampliacion_azoteas.py
      - scripts/data_azoteas/**
      - .github/workflows/aplicar-ampliacion-azoteas.yml

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama de trabajo
        uses: actions/checkout@v4
        with:
          ref: agent/ampliar-azoteas-drenaje-estacionamientos-20260727

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Aplicar inventario normativo
        id: aplicar
        continue-on-error: true
        run: python scripts/aplicar_ampliacion_azoteas.py > docs/RESULTADO_APLICACION_AZOTEAS.txt 2>&1

      - name: Registrar diagnóstico si falla
        if: steps.aplicar.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/RESULTADO_APLICACION_AZOTEAS.txt
          git commit -m "Registrar diagnóstico de ampliación de azoteas"
          git push origin HEAD:agent/ampliar-azoteas-drenaje-estacionamientos-20260727
          exit 1

      - name: Validar base y API
        if: steps.aplicar.outcome == 'success'
        run: python scripts/check_normativa.py

      - name: Confirmar archivos generados
        if: steps.aplicar.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f docs/RESULTADO_APLICACION_AZOTEAS.txt
          git add -A backend/normativa_tecnica.json backend/preguntas_tecnicas.json scripts/check_normativa.py docs/VALIDACION_AZOTEAS_DRENAJE_ESTACIONAMIENTOS_2026-07-27.md docs/RESULTADO_APLICACION_AZOTEAS.txt
          git diff --cached --quiet || git commit -m "Ampliar azoteas, drenaje y estacionamientos"
          git push origin HEAD:agent/ampliar-azoteas-drenaje-estacionamientos-20260727
