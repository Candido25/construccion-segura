name: Temporary normative work audit

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-audit-normativa.yml'

permissions:
  contents: read

jobs:
  audit-normativa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect main, branches and history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-normativa
          report=audit-normativa/report.txt
          : > "$report"

          echo '=== MAIN FILES WITH RELEVANT NAMES ===' >> "$report"
          find . -path './.git' -prune -o -type f -printf '%P\n' | grep -Ei 'norm|toler|param|faq|pregunta' | sort >> "$report" || true

          echo >> "$report"
          echo '=== CURRENT MAIN MATCHES ===' >> "$report"
          git grep -n -i -E 'normativa_tecnica|normative-module|normative_module|tolerancia|tolerancias|parametro|parámetro|garganta|ancho mínimo|profundidad mínima|espesor mínimo' HEAD -- '*.py' '*.js' '*.json' '*.html' '*.md' >> "$report" || true

          echo >> "$report"
          echo '=== ALL REMOTE BRANCHES ===' >> "$report"
          git branch -r | sed 's/^ *//' >> "$report"

          echo >> "$report"
          echo '=== RELEVANT FILES ACROSS REMOTE BRANCHES ===' >> "$report"
          while IFS= read -r ref; do
            ref=${ref#refs/remotes/}
            [[ "$ref" == 'origin/HEAD' ]] && continue
            files=$(git ls-tree -r --name-only "$ref" | grep -Ei 'normativa|normative|tolerancia|parametro|parámetro' || true)
            if [[ -n "$files" ]]; then
              echo "--- $ref" >> "$report"
              printf '%s\n' "$files" >> "$report"
            fi
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin)

          echo >> "$report"
          echo '=== RELEVANT CONTENT ACROSS REMOTE BRANCHES ===' >> "$report"
          while IFS= read -r ref; do
            ref=${ref#refs/remotes/}
            [[ "$ref" == 'origin/HEAD' ]] && continue
            matches=$(git grep -n -i -E 'normativa_tecnica|normative-module|normative_module|tolerancia|tolerancias|parametro|parámetro' "$ref" -- '*.py' '*.js' '*.json' '*.html' '*.md' 2>/dev/null | head -n 80 || true)
            if [[ -n "$matches" ]]; then
              echo "--- $ref" >> "$report"
              printf '%s\n' "$matches" >> "$report"
            fi
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin)

          echo >> "$report"
          echo '=== RELEVANT COMMITS IN ALL HISTORY ===' >> "$report"
          git log --all --date=iso --pretty=format:'%H|%ad|%s' --regexp-ignore-case --grep='normativa\|tolerancia\|parametro\|parámetro' >> "$report" || true

          echo >> "$report"
          echo '=== FAQ STRUCTURE AND NORMATIVE-LIKE CONTENT ===' >> "$report"
          python - <<'PY' >> "$report"
          import json
          import re
          from collections import Counter
          from pathlib import Path

          path = Path('backend/preguntas_tecnicas.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          categories = data.get('categorias', [])
          questions = [
              (cat.get('nombre', ''), q)
              for cat in categories
              for q in cat.get('preguntas', [])
          ]
          print(f'categories={len(categories)}')
          print(f'questions={len(questions)}')
          print('question_field_sets=' + repr(Counter(tuple(sorted(q.keys())) for _, q in questions)))

          patterns = {
              'minimum': re.compile(r'\b(m[ií]nim[oa]s?|por lo menos|no menor|como m[ií]nimo)\b', re.I),
              'maximum': re.compile(r'\b(m[aá]xim[oa]s?|no mayor|como m[aá]ximo)\b', re.I),
              'tolerance': re.compile(r'\b(tolerancia|desviaci[oó]n|variaci[oó]n permitida)\b', re.I),
              'dimension': re.compile(r'\b(ancho|altura|espesor|profundidad|longitud|di[aá]metro|secci[oó]n|recubrimiento)\b', re.I),
              'rne_reference': re.compile(r'\b(E\.0\d\d|RNE|Reglamento Nacional de Edificaciones)\b', re.I),
              'calculation_required': re.compile(r'\b(c[aá]lculo estructural|debe calcularse|seg[uú]n dise[nñ]o|depende del c[aá]lculo)\b', re.I),
          }
          for name, pattern in patterns.items():
              matches = []
              for category, q in questions:
                  text = f"{q.get('pregunta','')} {q.get('respuesta','')}"
                  if pattern.search(text):
                      matches.append((category, q.get('id'), q.get('pregunta')))
              print(f'{name}_count={len(matches)}')
              for item in matches[:12]:
                  print(f'{name}_sample={item!r}')

          for target in ('Escaleras', 'Cimentaciones', 'Columnas', 'Vigas', 'Muros'):
              selected = [(cat, q) for cat, q in questions if target.lower() in cat.lower()]
              print(f'category_like_{target}={len(selected)}')
              for cat, q in selected[:8]:
                  print(f'category_sample={cat}|{q.get("id")}|{q.get("pregunta")}')
          PY

          cat "$report"

      - uses: actions/upload-artifact@v4
        with:
          name: normative-work-audit
          path: audit-normativa
          retention-days: 1
