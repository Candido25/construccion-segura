name: Aplicar ampliación de instalaciones eléctricas

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/aplicar_ampliacion_electrica.py
      - .github/workflows/aplicar-instalaciones-electricas.yml

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          ref: agent/ampliar-instalaciones-electricas-20260727
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Aplicar inventario eléctrico
        run: python scripts/aplicar_ampliacion_electrica.py
      - name: Validar base y API
        run: python scripts/check_normativa.py
      - name: Confirmar archivos generados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/normativa_tecnica.json backend/preguntas_tecnicas.json scripts/check_normativa.py docs/VALIDACION_INSTALACIONES_ELECTRICAS_2026-07-27.md
          git diff --cached --quiet || git commit -m 'Ampliar instalaciones eléctricas en ejecución'
          git push origin HEAD:agent/ampliar-instalaciones-electricas-20260727
