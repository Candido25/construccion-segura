name: Temporary audit roofs energy and legacy batch

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-audit-cubiertas-energia.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out current feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Recover and inspect legacy PR 78 payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-cubiertas-energia/legacy
          git fetch origin agent/gas-energia-equipos-20260727
          for part in 00 01 02 03; do
            git show origin/agent/gas-energia-equipos-20260727:.tmp/bloque9.part${part} >> audit-cubiertas-energia/legacy/payload.b64
          done
          base64 -d audit-cubiertas-energia/legacy/payload.b64 | gzip -dc > audit-cubiertas-energia/legacy/payload.txt
          file audit-cubiertas-energia/legacy/payload.txt > audit-cubiertas-energia/legacy/file-type.txt
          wc -c -l audit-cubiertas-energia/legacy/payload.txt >> audit-cubiertas-energia/legacy/file-type.txt

      - name: Build current inventory and legacy delta
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          from collections import Counter
          from pathlib import Path

          root = Path('audit-cubiertas-energia')
          payload = (root / 'legacy/payload.txt').read_text(encoding='utf-8', errors='replace')
          normative = json.loads(Path('backend/normativa_tecnica.json').read_text(encoding='utf-8'))
          faq = json.loads(Path('backend/preguntas_tecnicas.json').read_text(encoding='utf-8'))
          current_ids = {str(item.get('id')) for item in normative.get('parametros', [])}

          patterns = [
              r"push\(\s*['\"]([^'\"]+)['\"]",
              r"['\"]id['\"]\s*:\s*['\"]([^'\"]+)['\"]",
          ]
          legacy_ids = []
          for pattern in patterns:
              legacy_ids.extend(re.findall(pattern, payload))
          legacy_ids = list(dict.fromkeys(legacy_ids))
          remaining = [item for item in legacy_ids if item not in current_ids]
          duplicates = [item for item in legacy_ids if item in current_ids]

          def prefix(value: str) -> str:
              return value.split('-', 1)[0].lower() if '-' in value else value.lower()

          terms = [
              'solar', 'terma', 'colector', 'fotovolta', 'eolica', 'azotea',
              'cubierta', 'techo', 'impermeabil', 'pluvial', 'sumidero',
              'estacionamiento', 'garaje', 'pararray', 'puesta a tierra',
              'em080', 'em090', 'ce040', 'is010', 'e020', 'a010', 'a020',
          ]
          term_counts = {term: payload.lower().count(term) for term in terms}

          current_matches = []
          for item in normative.get('parametros', []):
              text = ' '.join([
                  str(item.get('id', '')),
                  str(item.get('categoria', '')),
                  str(item.get('elemento', '')),
                  str(item.get('parametro', '')),
                  str(item.get('valor', {}).get('texto', '')),
              ]).lower()
              if any(term in text for term in terms):
                  current_matches.append(item)

          report = [
              '# Inventario para cubiertas, energía y exteriores', '',
              f"- Versión actual: `{normative.get('version')}`",
              f"- Parámetros actuales: {len(normative.get('parametros', []))}",
              f"- Preguntas actuales: {sum(len(c.get('preguntas', [])) for c in faq.get('categorias', []))}",
              f"- Identificadores encontrados en el payload del PR 78: {len(legacy_ids)}",
              f"- Ya incorporados en main: {len(duplicates)}",
              f"- Aún no incorporados: {len(remaining)}", '',
              '## Prefijos de identificadores pendientes', '',
          ]
          for key, value in Counter(prefix(item) for item in remaining).most_common():
              report.append(f'- `{key}`: {value}')
          report += ['', '## Términos en el payload heredado', '']
          for key, value in term_counts.items():
              report.append(f'- `{key}`: {value}')
          report += ['', '## Identificadores pendientes del PR 78', '']
          report.extend(f'- `{item}`' for item in remaining)
          report += ['', '## Identificadores del PR 78 ya incorporados', '']
          report.extend(f'- `{item}`' for item in duplicates)
          report += ['', '## Registros actuales relacionados', '']
          for item in current_matches:
              source = item.get('fuente', {})
              report.append(
                  f"- `{item.get('id')}` — {item.get('elemento')} / {item.get('parametro')} / "
                  f"{source.get('norma')} {source.get('numeral')}"
              )
          report += ['', '## Primeras líneas del payload heredado', '```text']
          report.extend(payload.splitlines()[:80])
          report += ['```', '', '## Últimas líneas del payload heredado', '```text']
          report.extend(payload.splitlines()[-80:])
          report += ['```', '']

          (root / 'inventory.md').write_text('\n'.join(report), encoding='utf-8')
          (root / 'legacy/remaining-ids.json').write_text(
              json.dumps(remaining, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          (root / 'legacy/duplicate-ids.json').write_text(
              json.dumps(duplicates, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: Download official source pages for the next block
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-cubiertas-energia/official
          curl -L --fail --retry 4 --retry-all-errors \
            'https://www.gob.pe/institucion/vivienda/informes-publicaciones/2309793-reglamento-nacional-de-edificaciones-rne' \
            -o audit-cubiertas-energia/official/rne.html
          curl -L --fail --retry 4 --retry-all-errors \
            'https://www.gob.pe/institucion/vivienda/normas-legales/8315150-009-2026-vivienda' \
            -o audit-cubiertas-energia/official/drenaje-2026.html
          curl -L --fail --retry 4 --retry-all-errors \
            'https://www.gob.pe/institucion/vivienda/normas-legales/6205380-431-2024-vivienda' \
            -o audit-cubiertas-energia/official/ce040-modificacion.html
          curl -L --fail --retry 4 --retry-all-errors \
            'https://www.gob.pe/institucion/vivienda/normas-legales/266383-083-2019-vivienda' \
            -o audit-cubiertas-energia/official/em010.html

      - name: Extract official document links and contexts
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import html
          import re
          from pathlib import Path
          from urllib.parse import urljoin

          root = Path('audit-cubiertas-energia/official')
          sources = [
              ('RNE compendium', root / 'rne.html', 'https://www.gob.pe/institucion/vivienda/informes-publicaciones/2309793-reglamento-nacional-de-edificaciones-rne'),
              ('Drainage regulation 2026', root / 'drenaje-2026.html', 'https://www.gob.pe/institucion/vivienda/normas-legales/8315150-009-2026-vivienda'),
              ('CE.040 modification', root / 'ce040-modificacion.html', 'https://www.gob.pe/institucion/vivienda/normas-legales/6205380-431-2024-vivienda'),
              ('EM.010 modification', root / 'em010.html', 'https://www.gob.pe/institucion/vivienda/normas-legales/266383-083-2019-vivienda'),
          ]
          targets = ['A.010', 'A.020', 'IS.010', 'EM.010', 'EM.080', 'EM.090', 'E.020', 'CE.040', 'DRENAJE']
          lines = ['# Enlaces oficiales candidatos', '']
          all_links = []
          for name, path, base in sources:
              text = path.read_text(encoding='utf-8', errors='ignore')
              links = []
              for match in re.finditer(r'href=["\']([^"\']+)["\']', text, flags=re.I):
                  href = html.unescape(match.group(1))
                  context = re.sub(r'<[^>]+>', ' ', text[max(0, match.start()-350):match.end()+350])
                  context = ' '.join(html.unescape(context).split())
                  absolute = urljoin(base, href)
                  if any(target.lower() in context.lower() or target.lower() in absolute.lower() for target in targets):
                      links.append((absolute, context[:700]))
              unique = []
              seen = set()
              for item in links:
                  if item[0] not in seen:
                      seen.add(item[0]); unique.append(item)
              lines += [f'## {name}', '']
              if not unique:
                  lines.append('_No se encontraron vínculos candidatos en el HTML estático._')
              for url, context in unique:
                  lines += [f'- {url}', f'  - Contexto: {context}']
                  all_links.append(url)
              lines.append('')
          (root / 'links.md').write_text('\n'.join(lines), encoding='utf-8')
          (root / 'candidate-urls.txt').write_text('\n'.join(dict.fromkeys(all_links)) + '\n', encoding='utf-8')
          PY

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: roofs-energy-legacy-audit
          path: audit-cubiertas-energia
          retention-days: 3
