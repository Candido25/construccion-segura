name: Temporary apply official RNE numerals

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-apply-rne-numerals.yml'

permissions:
  contents: write

jobs:
  apply-editorial-validation:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply official numerals and editorial corrections
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          path = Path('backend/normativa_tecnica.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          items = {item['id']: item for item in data['parametros']}

          expected = {
              'e050-its-condiciones-aplicacion',
              'e050-its-puntos-exploracion-minimo',
              'e050-its-profundidad-exploracion-minima',
              'e050-cimentacion-profundidad-minima-no-arriostrada',
              'e050-cimiento-corrido-ancho',
              'e050-cimiento-corrido-peralte',
              'a010-escalera-vivienda-huella-minima',
              'a010-escalera-contrahuella-maxima',
              'a010-escalera-pasos-maximos-entre-descansos',
              'a010-escalera-descanso-lineal-longitud-minima',
              'a020-escalera-vivienda-entre-muros-ancho-minimo',
              'a020-escalera-vivienda-lado-abierto-ancho-minimo',
              'a020-escalera-vivienda-dos-tramos-sin-muro-ancho-minimo',
              'a020-escalera-multifamiliar-comun-ancho-minimo',
              'a010-escalera-baranda-inclinada-altura-minima',
              'a010-escalera-baranda-descanso-altura-minima',
              'a010-baranda-altura-especial-minima',
              'e060-escalera-garganta-sin-minimo-universal',
              'e060-losa-escalera-simple-referencia-espesor',
              'e060-losa-escalera-un-extremo-continuo-referencia-espesor',
          }
          if set(items) != expected:
              missing = sorted(expected - set(items))
              extra = sorted(set(items) - expected)
              raise SystemExit(f'La base cambió durante la auditoría. Faltan={missing}; extras={extra}')

          urls = {
              'A.010': 'https://www.gob.pe/institucion/vivienda/normas-legales/2013148-191-2021-',
              'A.020': 'https://www.gob.pe/institucion/vivienda/normas-legales/2011712-188-2021-vivienda',
              'E.050': 'https://www.gob.pe/institucion/vivienda/normas-legales/222983-406-2018-vivienda',
              'E.060': 'https://www.gob.pe/institucion/vivienda/informes-publicaciones/2309793-reglamento-nacional-de-edificaciones-rne',
          }

          numerals = {
              'e050-its-condiciones-aplicacion': '5.36 y 6.3.1-6.3.4',
              'e050-its-puntos-exploracion-minimo': '5.36 y 6.3.1',
              'e050-its-profundidad-exploracion-minima': '5.36 y 6.3.1',
              'e050-cimentacion-profundidad-minima-no-arriostrada': '26.2',
              'e050-cimiento-corrido-ancho': '22.1, 22.2, 27, 28 y 29',
              'e050-cimiento-corrido-peralte': 'Artículo 23, Figura 4 (nota)',
              'a010-escalera-vivienda-huella-minima': '23.2.b.i',
              'a010-escalera-contrahuella-maxima': '23.2.c',
              'a010-escalera-pasos-maximos-entre-descansos': '23.2.a',
              'a010-escalera-descanso-lineal-longitud-minima': '23.2.a',
              'a020-escalera-vivienda-entre-muros-ancho-minimo': '15.1.a',
              'a020-escalera-vivienda-lado-abierto-ancho-minimo': '15.1.a',
              'a020-escalera-vivienda-dos-tramos-sin-muro-ancho-minimo': '15.1.a',
              'a020-escalera-multifamiliar-comun-ancho-minimo': '15.2.b',
              'a010-escalera-baranda-inclinada-altura-minima': '35.b',
              'a010-escalera-baranda-descanso-altura-minima': '35.a',
              'a010-baranda-altura-especial-minima': '35.a',
              'e060-escalera-garganta-sin-minimo-universal': '9.6.1, 9.6.2.1 y Tabla 9.1',
              'e060-losa-escalera-simple-referencia-espesor': '9.6.2.1, Tabla 9.1',
              'e060-losa-escalera-un-extremo-continuo-referencia-espesor': '9.6.2.1, Tabla 9.1',
          }

          pilot_id = 'e060-escalera-garganta-sin-minimo-universal'
          for item_id, item in items.items():
              source = item['fuente']
              source['url_oficial'] = urls[source['norma']]
              source['numeral'] = numerals[item_id]
              source['numeral_confirmado'] = True
              item['estado_revision'] = (
                  'piloto_verificado' if item_id == pilot_id else 'validado_con_numeral'
              )
              item['fecha_revision'] = '2026-07-26'

          item = items['e050-its-condiciones-aplicacion']
          item['valor']['texto'] = (
              'ITS aplicable en suelo conocido y uniforme, sin problemas especiales de cimentación, '
              'para edificación de hasta tres pisos, sin sótano, con área techada del primer piso '
              'menor de 500 m² y que no requiera cimentación especial, profunda o por platea.'
          )
          item['condiciones'] = [
              'Las condiciones indicadas en el numeral 6.3.1 deben cumplirse simultáneamente.',
              'El Profesional Responsable sustenta los valores asumidos con no menos de tres puntos de exploración.',
              'Si se requiere cimentación especial, profunda o por platea, corresponde efectuar un EMS.',
              'El ITS debe ser firmado por el Profesional Responsable e incluir la hoja resumen exigida por la norma.',
          ]
          item['advertencia'] = (
              'El supuesto simplificado no autoriza a omitir la exploración ni es aplicable automáticamente '
              'a rellenos, suelos heterogéneos o terrenos con problemas especiales.'
          )

          item = items['e050-its-puntos-exploracion-minimo']
          item['valor']['texto'] = 'No menos de 3 puntos de exploración para el ITS.'
          item['condiciones'] = [
              'Los puntos deben representar el área de la edificación y figurar en el plano de ubicación del ITS.',
              'La condición corresponde al supuesto simplificado regulado por el numeral 6.3.',
          ]

          item = items['e050-its-profundidad-exploracion-minima']
          item['valor']['texto'] = 'Profundidad mínima de exploración: 3.00 m para cada punto del ITS.'
          item['condiciones'] = [
              'La condición corresponde al supuesto simplificado regulado por el numeral 6.3.',
              'La investigación debe ampliarse cuando el perfil encontrado o el proyecto requieran mayor profundidad.',
          ]

          item = items['e050-cimentacion-profundidad-minima-no-arriostrada']
          item['valor']['texto'] = (
              'No menor de 0.80 m para cimentaciones de elementos portantes o no portantes no '
              'arriostrados lateralmente; en roca el Profesional Responsable define la profundidad.'
          )
          item['condiciones'] = [
              'La profundidad final la define el Profesional Responsable según la estratigrafía y las condiciones de uso.',
              'La excepción por roca exige comprobar que el estrato de apoyo sea roca.',
          ]

          item = items['e050-cimiento-corrido-ancho']
          item['valor']['texto'] = (
              'El ancho se dimensiona con la presión admisible, las características del suelo, las cargas, '
              'los asentamientos y las correcciones por excentricidad o inclinación; no es una medida universal.'
          )
          item['condiciones'] = [
              'Debe corresponder a la presión admisible determinada según el Capítulo III de la E.050.',
              'Debe considerar la profundidad y dimensiones de la cimentación, el nivel freático y el asentamiento tolerable.',
              'Las cargas excéntricas o inclinadas modifican el área efectiva o la capacidad de carga.',
          ]
          item['advertencia'] = 'No copies el ancho de otra obra ni lo presentes como mínimo general del RNE.'

          item = items['e050-cimiento-corrido-peralte']
          item['valor']['texto'] = (
              'El peralte de la cimentación debe ser determinado por el ingeniero que efectúa '
              'el diseño estructural del proyecto.'
          )
          item['condiciones'] = [
              'Debe verificarse con la geometría, el material, las cargas y las solicitaciones del elemento.',
              'La nota de la Figura 4 de la E.050 no establece un peralte único para todos los proyectos.',
          ]
          item['advertencia'] = 'Un predimensionamiento no reemplaza el cálculo ni el detalle de los planos estructurales.'

          item = items['a010-escalera-vivienda-huella-minima']
          item['valor']['texto'] = 'Paso o huella mínima en vivienda: 0.25 m.'
          item['condiciones'] = [
              'Corresponde a la dimensión mínima del paso establecida para vivienda en el numeral 23.2.b.i.',
              'La geometría final debe revisarse junto con el contrapaso, ancho, descansos y altura libre.',
          ]

          item = items['a010-escalera-contrahuella-maxima']
          item['valor']['texto'] = 'Contrapaso o contrahuella máxima: 0.18 m.'
          item['condiciones'] = [
              'Los pasos y contrapasos de un mismo tramo deben conservar dimensiones uniformes.',
          ]

          item = items['a010-escalera-pasos-maximos-entre-descansos']
          item['valor']['texto'] = 'Máximo 17 pasos entre descansos.'
          item['condiciones'] = [
              'Cuando el desarrollo requiera más pasos, debe incorporarse un descanso adicional.',
          ]

          item = items['a010-escalera-descanso-lineal-longitud-minima']
          item['valor']['texto'] = 'Longitud mínima del descanso en una escalera lineal: 0.90 m.'
          item['condiciones'] = [
              'En otros tipos de escalera, el ancho del descanso debe ser igual o mayor que el ancho del tramo.',
          ]

          item = items['a020-escalera-vivienda-entre-muros-ancho-minimo']
          item['valor']['texto'] = 'Ancho libre mínimo entre los muros que conforman la escalera: 0.90 m.'
          item['condiciones'] = ['Escalera al interior de una vivienda.', 'Medida libre entre acabados terminados.']

          item = items['a020-escalera-vivienda-lado-abierto-ancho-minimo']
          item['valor']['texto'] = 'Ancho libre mínimo: 0.80 m cuando el tramo tiene un lado abierto.'
          item['condiciones'] = ['Escalera al interior de una vivienda.', 'Configuración con un lado abierto.']

          item = items['a020-escalera-vivienda-dos-tramos-sin-muro-ancho-minimo']
          item['valor']['texto'] = 'Ancho libre mínimo por tramo: 0.80 m cuando existen dos tramos sin muro intermedio.'
          item['condiciones'] = ['Escalera al interior de una vivienda.', 'Dos tramos sin muro intermedio.']

          item = items['a020-escalera-multifamiliar-comun-ancho-minimo']
          item['valor']['texto'] = 'Ancho mínimo entre muros: 1.20 m.'
          item['condiciones'] = [
              'Escalera integrada en edificio multifamiliar o conjunto residencial de uso colectivo.',
              'No corresponde a la escalera interior privada de una vivienda.',
          ]

          item = items['a010-escalera-baranda-inclinada-altura-minima']
          item['valor']['texto'] = (
              'Altura mínima: 0.85 m, medida verticalmente desde la arista entre el paso y el contrapaso.'
          )
          item['condiciones'] = ['Tramo inclinado de escalera que requiere elemento de protección.']

          item = items['a010-escalera-baranda-descanso-altura-minima']
          item['elemento'] = 'Baranda en descanso con abertura en altura'
          item['valor']['texto'] = (
              'Altura mínima: 1.00 m, cuando el descanso tenga un costado abierto situado '
              'a más de 1.00 m sobre el suelo adyacente.'
          )
          item['condiciones'] = [
              'La medida se toma desde el nivel de piso interior terminado.',
              'Aplica a descansos y otras aberturas en altura que requieren baranda o antepecho.',
          ]
          item['advertencia'] = (
              'No todos los descansos requieren la misma solución: primero verifica la altura de caída y la configuración del borde.'
          )

          item = items['a010-baranda-altura-especial-minima']
          item['valor']['texto'] = (
              'Altura mínima: 1.10 m cuando la diferencia con el suelo adyacente es de 11.00 m o más, '
              'y también en azoteas.'
          )
          item['condiciones'] = [
              'La medida se toma desde el nivel de piso interior terminado.',
              'La condición de gran desnivel y la condición de azotea son supuestos independientes del numeral 35.a.',
          ]

          item = items[pilot_id]
          item['valor']['texto'] = (
              'La E.060 no proporciona una cifra única denominada “garganta mínima” para toda escalera. '
              'El espesor se diseña para resistencia y servicio; cuando la losa trabaja en una dirección, '
              'la Tabla 9.1 aporta referencias según sus apoyos si no se calculan las deflexiones.'
          )
          item['condiciones'] = [
              'La aplicación de la Tabla 9.1 a una losa de escalera exige identificar correctamente su dirección resistente y apoyos.',
              'La luz, cargas, continuidad, refuerzo, resistencia, recubrimiento y deflexiones forman parte del diseño.',
          ]
          item['advertencia'] = (
              'Este registro sigue como piloto porque la norma no contiene una regla específica titulada “espesor de garganta de escalera”.'
          )

          for item_id, divisor, support in [
              ('e060-losa-escalera-simple-referencia-espesor', 20, 'simplemente apoyada'),
              ('e060-losa-escalera-un-extremo-continuo-referencia-espesor', 24, 'continua en un extremo'),
          ]:
              item = items[item_id]
              item['valor']['texto'] = (
                  f'Referencia h ≥ L/{divisor} para una losa maciza unidireccional {support}, '
                  'cuando no se calculan explícitamente las deflexiones.'
              )
              item['condiciones'] = [
                  'Elemento de concreto de peso normal y refuerzo con fy = 420 MPa; para otras condiciones se aplican los modificadores de la tabla.',
                  'No debe soportar ni estar ligado a elementos no estructurales susceptibles de dañarse por deflexiones excesivas.',
                  'Puede emplearse un espesor menor si el cálculo de deflexiones demuestra que no se producen efectos adversos.',
                  'La referencia solo es aplicable después de confirmar que la losa de escalera trabaja en una dirección y tiene la condición de apoyo indicada.',
              ]
              item['advertencia'] = (
                  'La relación de la Tabla 9.1 controla deflexiones; no sustituye las verificaciones de resistencia, detalle y constructibilidad.'
              )

          data['version'] = '1.1.0'
          data['fecha_revision'] = '2026-07-26'
          data['advertencia_general'] = (
              'Base educativa con trazabilidad editorial. Los numerales confirmados identifican la cláusula oficial revisada, '
              'pero su aplicación depende de las condiciones indicadas. Los planos, el estudio del suelo, el cálculo estructural '
              'y la revisión profesional prevalecen para cada obra.'
          )

          path.write_text(
              json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n',
              encoding='utf-8',
          )

          validated = sum(item['estado_revision'] == 'validado_con_numeral' for item in data['parametros'])
          pilots = sum(item['estado_revision'] == 'piloto_verificado' for item in data['parametros'])
          if (validated, pilots) != (19, 1):
              raise SystemExit(f'Conteo editorial inesperado: validados={validated}, pilotos={pilots}')
          print(f'Base actualizada: {validated} validados con numeral y {pilots} piloto interpretativo.')
          PY

      - name: Strengthen normative validation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/check_normativa.py')
          text = path.read_text(encoding='utf-8')
          old = '''        if parametro.estado_revision == "validado_con_numeral":\n            if not parametro.fuente.numeral or not parametro.fuente.numeral_confirmado:\n                raise SystemExit(\n                    f"{parametro.id}: un registro validado requiere numeral confirmado."\n                )\n\n    BaseNormativa.model_validate(datos_crudos)\n'''
          new = '''        if parametro.fuente.numeral_confirmado and not parametro.fuente.numeral:\n            raise SystemExit(\n                f"{parametro.id}: un numeral marcado como confirmado no puede estar vacío."\n            )\n        if parametro.estado_revision == "validado_con_numeral":\n            if not parametro.fuente.numeral or not parametro.fuente.numeral_confirmado:\n                raise SystemExit(\n                    f"{parametro.id}: un registro validado requiere numeral confirmado."\n                )\n\n    validados = sum(\n        parametro.estado_revision == "validado_con_numeral"\n        for parametro in base.parametros\n    )\n    if validados < 19:\n        raise SystemExit(\n            f"La revisión editorial debe conservar al menos 19 numerales validados; hay {validados}."\n        )\n    if base.version == "1.0.0-piloto":\n        raise SystemExit("La versión piloto inicial ya no debe permanecer activa.")\n\n    BaseNormativa.model_validate(datos_crudos)\n'''
          if old not in text:
              raise SystemExit('No se encontró el bloque esperado en check_normativa.py.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Write editorial validation record
        shell: bash
        run: |
          cat > docs/VALIDACION_NORMATIVA_2026-07-26.md <<'EOF'
          # Validación editorial de normativa - 26 de julio de 2026

          ## Alcance

          Se revisaron los 20 registros iniciales de `backend/normativa_tecnica.json`
          contra las publicaciones oficiales de las normas A.010, A.020, E.050 y
          E.060 del Reglamento Nacional de Edificaciones.

          La revisión distingue entre:

          - requisitos o fórmulas expresos que pueden marcarse como
            `validado_con_numeral`;
          - criterios de aplicación que conservan el estado `piloto_verificado`
            cuando la norma no contiene una regla específica con el mismo nombre.

          ## Fuentes oficiales revisadas

          - A.010 Condiciones Generales de Diseño: RM N.° 191-2021-VIVIENDA.
          - A.020 Vivienda: RM N.° 188-2021-VIVIENDA.
          - E.050 Suelos y Cimentaciones: RM N.° 406-2018-VIVIENDA.
          - E.060 Concreto Armado: DS N.° 010-2009-VIVIENDA.

          ## Resultado

          | Grupo | Numerales confirmados | Registros |
          | --- | --- | ---: |
          | ITS y cimentaciones E.050 | 5.36; 6.3.1-6.3.4; 22.1-22.2; Art. 23, Fig. 4; 26.2; 27-29 | 6 |
          | Geometría de escaleras A.010 | 23.2.a; 23.2.b.i; 23.2.c | 4 |
          | Escaleras de vivienda A.020 | 15.1.a; 15.2.b | 4 |
          | Barandas A.010 | 35.a; 35.b | 3 |
          | Deflexiones E.060 | 9.6.2.1 y Tabla 9.1 | 2 |
          | Garganta de escalera | 9.6.1, 9.6.2.1 y Tabla 9.1 como contexto de diseño | 1 piloto |

          En total quedaron 19 registros como `validado_con_numeral` y un registro
          como `piloto_verificado`. El piloto corresponde al espesor de garganta:
          la E.060 regula diseño y control de deflexiones, pero no contiene una regla
          específica titulada “espesor mínimo de garganta de escalera”.

          ## Correcciones editoriales relevantes

          - Se precisaron todas las condiciones simultáneas para usar el ITS.
          - Se evitó presentar ancho o peralte de un cimiento corrido como medida universal.
          - La baranda de 1.00 m en descansos quedó condicionada a la existencia de una
            abertura situada a más de 1.00 m sobre el suelo adyacente.
          - Las relaciones L/20 y L/24 se identificaron como referencias para control de
            deflexiones y no como sustitutos del diseño completo.

          ## Regla para ampliaciones futuras

          Ningún registro nuevo puede usar `validado_con_numeral` sin indicar una
          cláusula comprobada y una URL oficial. Cuando el dato sea una interpretación
          técnica o una aplicación por analogía, debe conservarse como piloto hasta
          completar su revisión editorial.
          EOF

      - name: Run normative checks
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python scripts/check_normativa.py
          python -m py_compile backend/api.py backend/normativa.py

      - name: Commit validated base
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/normativa_tecnica.json scripts/check_normativa.py docs/VALIDACION_NORMATIVA_2026-07-26.md
          git commit -m 'Validar numerales oficiales de la normativa'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
