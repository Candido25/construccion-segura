name: Finalizar ampliación de acabados

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/diagnosticar-acabados.yml

permissions:
  contents: write

jobs:
  finalizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          ref: agent/ampliar-acabados-construccion-20260727

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Limpiar archivos temporales y validar
        run: |
          rm -f scripts/diagnosticar_acabados.py
          rm -f scripts/aplicar_ampliacion_acabados.py
          rm -rf scripts/data_acabados
          rm -f docs/DIAGNOSTICO_ACABADOS_2026-07-27.md
          rm -f docs/RESULTADO_APLICACION_ACABADOS.txt
          rm -f .github/workflows/diagnosticar-acabados.yml
          python scripts/check_normativa.py

      - name: Confirmar resultado definitivo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalizar ampliación de acabados"
          git push origin HEAD:agent/ampliar-acabados-construccion-20260727
