name: Temporary diagnose gas and special equipment

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-diagnose-gas-equipos-especiales.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Execute apply script and capture error
        shell: bash
        run: |
          mkdir -p diagnose-special
          set +e
          python - <<'PY' > diagnose-special/output.txt 2>&1
          from pathlib import Path
          import textwrap
          workflow=Path('.github/workflows/tmp-apply-gas-equipos-especiales.yml').read_text(encoding='utf-8')
          marker="          python - <<'PY'\n"
          start=workflow.index(marker)+len(marker)
          end=workflow.index("\n          PY",start)
          script=textwrap.dedent(workflow[start:end])
          exec(compile(script,'apply-gas-special.py','exec'),{})
          PY
          echo "status=$?" >> diagnose-special/output.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: gas-special-diagnosis
          path: diagnose-special
          retention-days: 2
