name: Temporary capture block 8 generator error

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-capturar-error-bloque-8.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Reconstruct generator
        shell: bash
        run: |
          cat .tmp/bloque8.part00 .tmp/bloque8.part01 .tmp/bloque8.part02 .tmp/bloque8.part03 .tmp/bloque8.part04 .tmp/bloque8.part05 \
            | base64 -d | gzip -d > /tmp/build_block8.py
          mkdir -p /mnt/data/bloques89/current /mnt/data/bloques89/block8 diagnosis
          cp backend/normativa_tecnica.json /mnt/data/bloques89/current/
          cp backend/preguntas_tecnicas.json /mnt/data/bloques89/current/
          cp backend/normativa.py /mnt/data/bloques89/current/
          cp scripts/check_normativa.py /mnt/data/bloques89/current/
          cp frontend/app/normative-module.js /mnt/data/bloques89/current/
          cp docs/CONTRATO_NORMATIVA.md /mnt/data/bloques89/current/
      - name: Capture current base summary
        shell: bash
        run: |
          python - <<'PY' > diagnosis/base.txt
          import json
          from pathlib import Path
          n=json.loads(Path('backend/normativa_tecnica.json').read_text(encoding='utf-8'))
          q=json.loads(Path('backend/preguntas_tecnicas.json').read_text(encoding='utf-8'))
          print('version',n.get('version'))
          print('parameters',len(n.get('parametros',[])))
          print('questions',sum(len(c.get('preguntas',[])) for c in q.get('categorias',[])))
          print('categories')
          for c in q.get('categorias',[]): print(repr(c.get('nombre') or c.get('categoria')))
          PY
      - name: Run generator and capture traceback
        continue-on-error: true
        shell: bash
        run: python /tmp/build_block8.py > diagnosis/run.txt 2>&1
      - name: Upload traceback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: error-generador-bloque-8
          path: diagnosis
          retention-days: 2
