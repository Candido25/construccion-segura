name: Diagnosticar aplicación de acabados

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/aplicar_ampliacion_acabados.py
      - scripts/data_acabados/**
      - .github/workflows/diagnosticar-acabados.yml

permissions:
  contents: write

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          ref: agent/ampliar-acabados-construccion-20260727

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar y capturar resultado
        run: |
          set +e
          python scripts/aplicar_ampliacion_acabados.py > docs/RESULTADO_APLICACION_ACABADOS.txt 2>&1
          echo "ESTADO=$?" >> docs/RESULTADO_APLICACION_ACABADOS.txt
          exit 0

      - name: Confirmar diagnóstico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/RESULTADO_APLICACION_ACABADOS.txt
          git commit -m "Registrar resultado de aplicación de acabados"
          git push origin HEAD:agent/ampliar-acabados-construccion-20260727
