name: Temporary normative batch 4 audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-audit-normativa-lote-4.yml'

permissions:
  contents: read

jobs:
  audit-official-standards:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install PDF text tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Download official E.060 and E.030 PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-lote-4
          curl -L --fail --retry 4 --retry-all-errors \
            -A 'Mozilla/5.0 ConstruccionSegura/1.0' \
            'https://cdn.www.gob.pe/uploads/document/file/2366660/55%20E.060%20CONCRETO%20ARMADO%20DS%20N%C2%B0%20010-2009.pdf?v=1677250657' \
            -o audit-lote-4/E060.pdf
          curl -L --fail --retry 4 --retry-all-errors \
            -A 'Mozilla/5.0 ConstruccionSegura/1.0' \
            'https://cdn.www.gob.pe/uploads/document/file/9902957/8081915-nt-e-030-diseno-sismorresistente-2026.pdf?v=1777909403' \
            -o audit-lote-4/E030-2026.pdf
          pdftotext -layout audit-lote-4/E060.pdf audit-lote-4/E060.txt
          pdftotext -layout audit-lote-4/E030-2026.pdf audit-lote-4/E030-2026.txt

      - name: Extract clauses and map existing questions
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          import unicodedata
          from pathlib import Path

          out = Path('audit-lote-4/report.md')
          norm = json.loads(Path('backend/normativa_tecnica.json').read_text(encoding='utf-8'))
          faq = json.loads(Path('backend/preguntas_tecnicas.json').read_text(encoding='utf-8'))
          e060 = Path('audit-lote-4/E060.txt').read_text(encoding='utf-8', errors='ignore')
          e030 = Path('audit-lote-4/E030-2026.txt').read_text(encoding='utf-8', errors='ignore')

          def normalize(value: str) -> str:
              text = unicodedata.normalize('NFD', str(value).lower())
              text = ''.join(ch for ch in text if unicodedata.category(ch) != 'Mn')
              return ' '.join(text.split())

          questions = []
          for category in faq.get('categorias', []):
              category_name = category.get('nombre') or category.get('categoria') or ''
              for item in category.get('preguntas', []):
                  if not isinstance(item, dict):
                      continue
                  question = item.get('pregunta', '')
                  answer = item.get('respuesta', '')
                  questions.append({
                      'id': item.get('id'),
                      'category': category_name,
                      'question': question,
                      'answer': answer,
                      'search': normalize(f'{question} {answer} {category_name}'),
                  })

          def contexts(text: str, patterns: list[str], radius: int = 950, limit: int = 12) -> list[str]:
              found = []
              lowered = normalize(text)
              # Search in normalized text only to find candidate line numbers, then emit original line windows.
              original_lines = text.splitlines()
              normalized_lines = [normalize(line) for line in original_lines]
              for index, line in enumerate(normalized_lines):
                  if any(re.search(pattern, line) for pattern in patterns):
                      start = max(0, index - 5)
                      end = min(len(original_lines), index + 9)
                      block = '\n'.join(original_lines[start:end]).strip()
                      if block and block not in found:
                          found.append(block)
                      if len(found) >= limit:
                          break
              return found

          searches = {
              'E.060 - longitudes de desarrollo y anclajes': (
                  e060,
                  [r'longitud de desarrollo', r'gancho estandar', r'anclaje', r'desarrollo de barras'],
              ),
              'E.060 - empalmes y traslapes': (
                  e060,
                  [r'empalmes? por traslape', r'empalmes? de barras', r'no deben hacerse empalmes', r'clase a', r'clase b'],
              ),
              'E.060 - vigas y refuerzo sísmico': (
                  e060,
                  [r'requisitos para vigas', r'refuerzo transversal', r'estribos cerrados', r'zonas de confinamiento', r'capitulo 21'],
              ),
              'E.060 - losas y refuerzo mínimo': (
                  e060,
                  [r'refuerzo minimo', r'losas en una direccion', r'losas macizas', r'espaciamiento del refuerzo', r'retraccion y temperatura'],
              ),
              'E.030 2026 - separación sísmica': (
                  e030,
                  [r'separacion entre edificaciones', r'junta de separacion', r'distancia minima', r'separacion sismica'],
              ),
              'E.030 2026 - desplazamientos y deriva': (
                  e030,
                  [r'desplazamiento lateral', r'deriva', r'desplazamientos laterales permisibles', r'limites para la distorsion'],
              ),
              'E.030 2026 - diafragmas y continuidad': (
                  e030,
                  [r'diafragma', r'continuidad estructural', r'irregularidad de diafragma'],
              ),
              'E.030 2026 - albañilería y autoconstrucción': (
                  e030,
                  [r'albanileria confinada', r'vivienda', r'edificaciones de categoria c', r'sistema estructural'],
              ),
          }

          faq_terms = [
              'longitud de desarrollo', 'anclaje', 'gancho', 'traslape', 'empalme',
              'estribo', 'viga', 'losa', 'refuerzo minimo', 'acero minimo',
              'junta sismica', 'separacion entre edificios', 'deriva', 'diafragma',
              'desplazamiento lateral', 'columna corta', 'viga solera',
          ]

          lines = [
              '# Auditoría normativa - lote 4', '',
              f"- Versión actual: `{norm.get('version')}`",
              f"- Parámetros actuales: {len(norm.get('parametros', []))}",
              f"- Preguntas actuales: {len(questions)}", '',
              '## Versiones oficiales verificadas', '',
              '- E.060 Concreto Armado: DS N.° 010-2009-VIVIENDA (PDF oficial del RNE).',
              '- E.030 Diseño Sismorresistente: RM N.° 183-2026-VIVIENDA, con disposición transitoria modificada por RM N.° 217-2026-VIVIENDA.', '',
          ]

          for heading, (text, patterns) in searches.items():
              lines += [f'## {heading}', '']
              blocks = contexts(text, patterns)
              if not blocks:
                  lines.append('_Sin coincidencias extraídas._')
              for number, block in enumerate(blocks, 1):
                  lines += [f'### Contexto {number}', '```text', block[:5000], '```', '']

          lines += ['## Mapeo de preguntas existentes', '']
          for term in faq_terms:
              token = normalize(term)
              matches = [q for q in questions if token in q['search']][:12]
              lines += [f'### {term}', '']
              if not matches:
                  lines.append('_Sin coincidencias directas._')
              for item in matches:
                  answer = ' '.join(str(item['answer']).split())
                  lines.append(f"- `{item['id']}` [{item['category']}]: **{item['question']}** — {answer[:420]}")
              lines.append('')

          lines += ['## Identificadores normativos existentes relacionados', '']
          for item in norm.get('parametros', []):
              item_id = item.get('id', '')
              haystack = normalize(' '.join([
                  item_id,
                  item.get('categoria', ''),
                  item.get('elemento', ''),
                  item.get('parametro', ''),
                  item.get('valor', {}).get('texto', ''),
              ]))
              if any(token in haystack for token in ['viga', 'losa', 'ancl', 'traslap', 'sism', 'diafragma', 'estrib']):
                  lines.append(f"- `{item_id}` — {item.get('elemento')} / {item.get('parametro')} / {item.get('fuente', {}).get('numeral')}")

          out.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: normative-batch-4-audit
          path: audit-lote-4
          retention-days: 3
