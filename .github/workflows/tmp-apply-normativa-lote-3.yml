                  ('q1539', '¿Cuánto tiempo se cura un concreto de alta resistencia inicial?', 'La E.060 exige mantenerlo por encima de 10 °C y permanentemente húmedo por lo menos durante los primeros 3 días, salvo un método alternativo que demuestre resistencia y durabilidad equivalentes.'),
