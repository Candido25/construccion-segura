name: Temporary apply gas and special equipment v2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-apply-gas-equipos-especiales-v2.yml'

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Execute reviewed 51-record expansion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          workflow=Path('.github/workflows/tmp-apply-gas-equipos-especiales.yml').read_text(encoding='utf-8')
          marker="          python - <<'PY'\n"
          start=workflow.index(marker)+len(marker)
          end=workflow.index("\n          PY",start)
          script=textwrap.dedent(workflow[start:end])
          replacements=[
            ("if len(specs)!=50 or len(questions)!=50:","if len(specs)!=51 or len(questions)!=51:"),
            ("Se esperaban 50 registros y se generaron", "Se esperaban 51 registros y se generaron"),
            ("len(norm['parametros'])!=747 or new_total!=2210", "len(norm['parametros'])!=748 or new_total!=2211"),
            ("if len(base.parametros) < 747:", "if len(base.parametros) < 748:"),
            ("por lo menos 747 parámetros revisados", "por lo menos 748 parámetros revisados"),
            ("if validados < 713:", "if validados < 714:"),
            ("al menos 713 numerales RNE validados", "al menos 714 numerales RNE validados"),
            ("if len(todas) < 2210:", "if len(todas) < 2211:"),
            ("por lo menos 2210 preguntas técnicas", "por lo menos 2211 preguntas técnicas"),
            ("Se incorporaron 50 parámetros y 50 preguntas", "Se incorporaron 51 parámetros y 51 preguntas"),
            ("- Parámetros: 747.", "- Parámetros: 748."),
            ("- Preguntas: 2210.", "- Preguntas: 2211."),
            ("- Nuevos registros con numeral RNE confirmado: 50.", "- Nuevos registros con numeral RNE confirmado: 51."),
          ]
          for old,new in replacements:
              if old not in script:
                  raise SystemExit('No se encontró para corregir: '+old)
              script=script.replace(old,new)
          exec(compile(script,'apply-gas-special-v2.py','exec'),{})
          PY

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q -r requirements.txt

      - name: Validate contract API and package
        run: |
          python scripts/check_normativa.py
          python -m py_compile backend/api.py backend/normativa.py scripts/check_normativa.py
          node --check frontend/app/normative-module.js
          rm -rf public
          python scripts/prepare_frontend.py
          test -f public/index.html
          test -f public/app/normative-module.js
          test ! -e public/backend
          test ! -e public/scripts

      - name: Commit permanent files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/normativa_tecnica.json backend/preguntas_tecnicas.json scripts/check_normativa.py docs/VALIDACION_NORMATIVA_GAS_EQUIPOS_2026-07-27.md
          git commit -m 'Ampliar normativa de gas y equipos especiales'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
