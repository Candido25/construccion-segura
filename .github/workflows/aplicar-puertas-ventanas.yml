name: Aplicar ampliación de puertas y ventanas

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/aplicar_ampliacion_puertas_ventanas.py
      - .github/workflows/aplicar-puertas-ventanas.yml

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          ref: agent/ampliar-puertas-ventanas-seguridad-20260727
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Aplicar inventario corregido
        run: python scripts/aplicar_ampliacion_puertas_ventanas.py
      - name: Validar base y API
        run: python scripts/check_normativa.py
      - name: Confirmar archivos generados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/normativa_tecnica.json backend/preguntas_tecnicas.json scripts/check_normativa.py docs/VALIDACION_PUERTAS_VENTANAS_SEGURIDAD_2026-07-27.md
          git diff --cached --quiet || git commit -m "Ampliar puertas, ventanas y cerrajería"
          git push origin HEAD:agent/ampliar-puertas-ventanas-seguridad-20260727
