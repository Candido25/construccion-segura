name: Finalizar ampliación de azoteas

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/aplicar-ampliacion-azoteas.yml

permissions:
  contents: write

jobs:
  finalizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama de trabajo
        uses: actions/checkout@v4
        with:
          ref: agent/ampliar-azoteas-drenaje-estacionamientos-20260727

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Corregir, limpiar y validar
        run: |
          sed -i 's/La versión normativa esperada es 2.0.0/La versión normativa esperada es 2.1.0/' scripts/check_normativa.py
          rm -f scripts/aplicar_ampliacion_azoteas.py
          rm -rf scripts/data_azoteas
          rm -f .github/workflows/aplicar-ampliacion-azoteas.yml
          python scripts/check_normativa.py

      - name: Confirmar resultado definitivo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalizar ampliación de azoteas y drenaje"
          git push origin HEAD:agent/ampliar-azoteas-drenaje-estacionamientos-20260727
