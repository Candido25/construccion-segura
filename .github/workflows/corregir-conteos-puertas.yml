name: Corregir conteos de puertas

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/corregir_conteos_puertas.py
      - .github/workflows/corregir-conteos-puertas.yml

permissions:
  contents: write

jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          ref: agent/ampliar-puertas-ventanas-seguridad-20260727
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Corregir conteos
        run: python scripts/corregir_conteos_puertas.py
      - name: Confirmar corrección
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/aplicar_ampliacion_puertas_ventanas.py
          git diff --cached --quiet || git commit -m "Corregir conteos del bloque de puertas"
          git push origin HEAD:agent/ampliar-puertas-ventanas-seguridad-20260727
