name: Temporary tune hero image scaling

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  tune-hero-scaling:
    runs-on: ubuntu-latest
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/portada-imagen-html-20260726
          fetch-depth: 0

      - name: Match background cover scaling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("frontend/hero.css")
          text = path.read_text(encoding="utf-8")
          old = '''.home-conversion-hero .hero-image img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
          }
          '''
          new = '''.home-conversion-hero .hero-image img {
            position: absolute;
            top: 0;
            left: 50%;
            display: block;
            width: auto;
            max-width: none;
            height: 100%;
            transform: translateX(-50%);
          }
          '''
          if old not in text:
              raise SystemExit("No se encontró el bloque actual de escalado de la portada")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_frontend.py
          python scripts/run_frontend_validator.py check_site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/hero.css
          git commit -m "Ajustar escalado de la imagen de portada"
          git push origin HEAD:agent/portada-imagen-html-20260726
