name: Diagnosticar instalaciones eléctricas

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/diagnosticar_instalaciones_electricas.py
      - .github/workflows/diagnosticar-instalaciones-electricas.yml

permissions:
  contents: write

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          ref: agent/ampliar-instalaciones-electricas-20260727

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar diagnóstico
        run: python scripts/diagnosticar_instalaciones_electricas.py

      - name: Confirmar diagnóstico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DIAGNOSTICO_INSTALACIONES_ELECTRICAS_2026-07-27.md
          git diff --cached --quiet || git commit -m "Registrar diagnóstico de instalaciones eléctricas"
          git push origin HEAD:agent/ampliar-instalaciones-electricas-20260727
