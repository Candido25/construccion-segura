name: Site checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-static-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Ensure public identity uses Ingeniero
        run: |
          matches=$(grep -RIlE 'Ing\. Civil|Ingeniero civil|ingeniero civil' frontend --include='*.html' || true)
          if [ -n "$matches" ]; then
            echo "Retired specialty found in:"
            printf '%s\n' "$matches"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare public frontend
        run: python scripts/prepare_frontend.py

      - name: Validate local links and duplicate IDs
        run: python scripts/run_frontend_validator.py check_site

      - name: Validate backend API syntax
        run: python -m py_compile backend/api.py

      - name: Validate JavaScript syntax
        run: |
          node --check frontend/script.js
          node --check frontend/privacy.js
          node --check frontend/site-global.js
          node --check frontend/service-worker.js
          node --check frontend/app/faq-search.js
