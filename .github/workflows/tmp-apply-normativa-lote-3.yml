      - name: Update validation thresholds
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/check_normativa.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('if len(base.parametros) < 41:', 'if len(base.parametros) < 70:')
          text = text.replace('por lo menos 41 parámetros validados', 'por lo menos 70 parámetros validados')
          text = text.replace('if validados < 40:', 'if validados < 69:')
          text = text.replace('al menos 40 numerales validados', 'al menos 69 numerales validados')
          text = text.replace("if base.version == \"1.0.0-piloto\":\n        raise SystemExit(\"La versión piloto inicial ya no debe permanecer activa.\")", "if base.version != \"1.3.0\":\n        raise SystemExit(f\"La versión normativa esperada es 1.3.0 y se recibió {base.version}.\")")
          old = '''    detalle = api.detalle_parametro_normativo(\n        "a010-escalera-contrahuella-maxima"\n    )\n    if detalle["valor"]["valor"] != 0.18:\n        raise SystemExit("El detalle normativo de prueba no conserva el valor esperado.")\n'''
          new = old + '''\n    recubrimiento = api.detalle_parametro_normativo(\n        "e060-recubrimiento-contra-suelo-minimo"\n    )\n    if recubrimiento["valor"]["valor"] != 70:\n        raise SystemExit("El recubrimiento contra suelo debe conservar 70 mm.")\n\n    preguntas = json.loads(\n        (BACKEND / "preguntas_tecnicas.json").read_text(encoding="utf-8")\n    )\n    todas = [\n        item\n        for categoria in preguntas.get("categorias", [])\n        for item in categoria.get("preguntas", [])\n        if isinstance(item, dict)\n    ]\n    if len(todas) < 1539:\n        raise SystemExit("El lote 3 requiere por lo menos 1539 preguntas técnicas.")\n    respuesta_q307 = next(\n        item.get("respuesta", "") for item in todas if item.get("id") == "q307"\n    )\n    if "70 mm" not in respuesta_q307 or "75 mm" in respuesta_q307:\n        raise SystemExit("La FAQ q307 debe indicar el recubrimiento correcto de 70 mm.")\n'''
          if old not in text:
              raise SystemExit('No se encontró el bloque de prueba esperado en check_normativa.py.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Document batch 3
        run: |
          cat > docs/VALIDACION_NORMATIVA_LOTE_3_2026-07-27.md <<'EOF'
          # Validación normativa - lote 3 - 27 de julio de 2026

          ## Alcance

          Se incorporaron 29 parámetros verificados de las normas E.060 Concreto Armado y E.070 Albañilería, priorizando consultas de utilidad directa para autoconstrucción responsable.

          ## Resultado

          - Base normativa: 70 parámetros.
          - Registros con numeral confirmado: 69.
          - Registros piloto: 1, correspondiente a la garganta de escalera.
          - Base de preguntas: 1539 preguntas.
          - Preguntas nuevas: 20.

          ## Grupos incorporados

          - resistencia mínima del concreto estructural;
          - límites del tamaño máximo nominal del agregado grueso;
          - curado del concreto convencional y de alta resistencia inicial;
          - separaciones libres mínimas del acero;
          - recubrimientos en elementos interiores y contra el suelo;
          - preparación de juntas de construcción;
          - resistencia del grout y del concreto de confinamiento;
          - espesor de juntas de mortero y altura diaria del muro;
          - conexiones dentadas y a ras;
          - cierres de estribos y traslapes;
          - secuencia de vaciado, recubrimientos y dimensiones mínimas de elementos de confinamiento.

          ## Corrección editorial

          Se corrigió la familia de preguntas sobre concreto vaciado contra tierra: la E.060 vigente establece 70 mm en el numeral 7.7.1(a), no 75 mm.

          ## Fuentes

          - E.060 Concreto Armado, DS N.° 010-2009-VIVIENDA.
          - E.070 Albañilería, aprobada dentro del RNE por DS N.° 011-2006-VIVIENDA.
          - Publicaciones oficiales del Ministerio de Vivienda, Construcción y Saneamiento.

          Las automatizaciones temporales utilizadas para descargar y examinar las normas deben retirarse antes de la integración.
          EOF

