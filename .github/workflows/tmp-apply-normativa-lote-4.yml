      - name: Update normative validation thresholds
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/check_normativa.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('if len(base.parametros) < 70:', 'if len(base.parametros) < 100:')
          text = text.replace('por lo menos 70 parámetros validados', 'por lo menos 100 parámetros validados')
          text = text.replace('if validados < 69:', 'if validados < 99:')
          text = text.replace('al menos 69 numerales validados', 'al menos 99 numerales validados')
          marker = '    detalle = api.detalle_parametro_normativo(\n        "a010-escalera-contrahuella-maxima"\n    )\n'
          if marker not in text:
              raise SystemExit('No se encontró el punto de inserción del validador.')
          extra = '''    desarrollo = api.detalle_parametro_normativo(\n        "e060-desarrollo-traccion-longitud-minima"\n    )\n    if desarrollo["valor"]["valor"] != 300:\n        raise SystemExit("La longitud mínima de desarrollo a tracción debe ser 300 mm.")\n\n    separacion = api.detalle_parametro_normativo(\n        "e030-separacion-edificios-formula-minima"\n    )\n    if "0.02" not in separacion["valor"]["formula"]:\n        raise SystemExit("La fórmula de separación sísmica no conserva la E.030 2026.")\n\n'''
          text = text.replace(marker, extra + marker)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Document batch 4
        shell: bash
        run: |
          cat > docs/VALIDACION_NORMATIVA_LOTE_4_2026-07-27.md <<'EOF'
          # Validación normativa - lote 4 - 27 de julio de 2026

          ## Alcance

          Se incorporaron 30 parámetros y 30 preguntas sobre vigas, losas, desarrollo y empalme de acero, diafragmas y separación sísmica entre edificaciones.

          La revisión se realizó contra:

          - E.060 Concreto Armado, DS N.° 010-2009-VIVIENDA.
          - E.030 Diseño Sismorresistente 2026, aprobada mediante RM N.° 183-2026-VIVIENDA.
          - RM N.° 217-2026-VIVIENDA, que modifica la disposición transitoria de la RM N.° 183-2026-VIVIENDA.

          ## Resultado

          - Base normativa: versión `1.4.0`.
          - Parámetros totales: 100.
          - Registros validados con numeral: 99.
          - Registros piloto: 1.
          - Preguntas técnicas: 1569.

          ## Principios editoriales aplicados

          - Los mínimos de 300 mm y 200 mm para desarrollo son límites inferiores; no reemplazan el cálculo.
          - Los empalmes Clase A y B se expresan en función de `ld`, evitando convertirlos en una longitud fija para toda barra.
          - Los detalles sísmicos de vigas del artículo 21.4 se muestran con su condición de aplicación y no como reglas universales.
          - La separación entre edificios usa la E.030 2026 y advierte que 30 mm es solo el límite inferior.
          - La condición de diafragma rígido requiere verificar rigidez, resistencia y conexión; no se presume por la sola existencia de una losa.

          ## Actualización normativa relevante

          La E.030 empleada en este lote es la edición aprobada en 2026. No se reutilizaron numerales de la edición anterior sin contrastarlos con el nuevo texto oficial.
          EOF

